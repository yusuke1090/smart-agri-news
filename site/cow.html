<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>牛の教科書｜スマート農業News</title>
<meta name="description" content="乳牛のからだ・繁殖・エサ・乳・病気・スマート酪農を、日本語と英語でまとめた教科書。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>">
<style>
:root {
  --bg: #f5f7f2; --panel: #ffffff; --border: #dde3d6; --text: #1e2a1c; --muted: #66735f;
  --accent: #2e7d32; --accent-soft: #cfe6cc; --link: #1b5e20; --th: #eef3ea; --quote: #fff8e1; --quote-border: #f0c75e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121611; --panel: #1a2019; --border: #2d372a; --text: #e4ebdf; --muted: #93a08c;
    --accent: #66bb6a; --accent-soft: #2f4a2f; --link: #a5d6a7; --th: #222b20; --quote: #2a2618; --quote-border: #8a7330;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: 64px; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15.5px/1.85 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
.wrap { max-width: 820px; margin: 0 auto; padding: 0 16px; }
header { background: var(--panel); border-bottom: 1px solid var(--border); }
header .wrap { display: flex; align-items: center; gap: 10px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
.home { color: var(--link); text-decoration: none; font-size: 13.5px; }
.home:hover { text-decoration: underline; }
.brand { font-size: 17px; font-weight: 700; margin-right: auto; }
.langs { display: flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
.langs button { font: inherit; font-size: 13px; padding: 3px 14px; border: 0; background: var(--panel); color: var(--muted); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 700; }
.bar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--border); }
.bar .wrap { display: flex; gap: 6px; padding-top: 8px; padding-bottom: 8px; }
.bar button { font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 8px; }
.bar .step { width: 42px; flex: none; font-size: 14px; }
.bar .step:disabled { opacity: .4; cursor: default; }
#tocBtn { flex: 1; min-width: 0; text-align: left; padding: 6px 12px; font-size: 14.5px; font-weight: 700;
  display: flex; align-items: center; gap: 8px; }
#tocBtn .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tocBtn .caret { color: var(--muted); font-size: 12px; }
.toc { position: absolute; left: 0; right: 0; top: 100%; z-index: 11; }
.toc .wrap { display: block; padding-top: 0; }
.toc-in { background: var(--panel); border: 1px solid var(--border); border-radius: 0 0 12px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18);
  max-height: min(70vh, 640px); overflow: auto; padding: 6px 0 10px; }
.toc h3 { font-size: 12px; color: var(--muted); margin: 10px 16px 2px; font-weight: 700; letter-spacing: .03em; }
.toc .row { display: flex; align-items: center; }
.toc .row:hover { background: var(--bg); }
.toc .tg { flex: none; width: 34px; height: 34px; margin-left: 6px; border: 0; border-radius: 6px; background: none;
  color: var(--muted); font-size: 11px; cursor: pointer; }
.toc .tg:hover { color: var(--text); background: var(--th); }
.toc .ch { flex: 1; min-width: 0; text-align: left; font: inherit; font-size: 14.5px; padding: 6px 16px 6px 2px; border: 0; background: none; color: var(--text); cursor: pointer; }
.toc .row.on .ch { color: var(--accent); font-weight: 700; }
.toc .subs { padding: 0 0 6px; }
.toc .sub { display: block; width: 100%; text-align: left; font: inherit; font-size: 13.5px; padding: 4px 16px 4px 48px; border: 0; background: none; color: var(--muted); cursor: pointer; }
.toc .sub:hover { color: var(--text); background: var(--bg); }
main { padding-bottom: 30px; }
#body h1 { font-size: 24px; line-height: 1.5; margin: 26px 0 10px; }
#body h2 { font-size: 19px; margin: 34px 0 10px; padding-bottom: 4px; border-bottom: 2px solid var(--accent-soft); }
#body h3 { font-size: 16.5px; margin: 24px 0 6px; }
#body h4 { font-size: 15.5px; margin: 18px 0 4px; }
#body p { margin: 8px 0; }
#body ul, #body ol { margin: 8px 0; padding-left: 1.5em; }
#body li { margin: 3px 0; }
#body li ul { margin: 2px 0; }
#body a { color: var(--link); }
#body code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; background: var(--th); padding: 1px 5px; border-radius: 4px; }
#body img { display: block; max-width: 100%; height: auto; margin: 14px auto; border-radius: 10px; border: 1px solid var(--border); }
#body figure { margin: 20px 0 22px; }
#body figure img { margin: 0 auto; }
#body figcaption { margin-top: 7px; font-size: 13px; line-height: 1.6; color: var(--muted); text-align: center; }
#body figcaption b { color: var(--text); margin-right: 6px; }
#body figure img { cursor: zoom-in; }
@media (max-width: 600px) { #body figcaption::after { content: attr(data-zoom); color: var(--link); white-space: nowrap; } }
.zoom { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .93); overflow: auto; -webkit-overflow-scrolling: touch; }
.zoom img { display: block; width: 820px; max-width: none; margin: 60px auto 14px; border-radius: 10px; background: #fff; }
@media (min-width: 900px) { .zoom img { width: min(1200px, 94vw); } }
.zoom p { margin: 0 16px 28px; color: #eee; font-size: 13px; text-align: center; }
.zoom .x { position: fixed; top: 10px; right: 12px; z-index: 31; font: inherit; font-size: 14px; font-weight: 700; padding: 7px 16px;
  border: 0; border-radius: 999px; background: #fff; color: #111; cursor: pointer; }
.tbl { overflow-x: auto; margin: 10px 0 14px; -webkit-overflow-scrolling: touch; }
#body table { border-collapse: collapse; font-size: 14px; line-height: 1.6; min-width: 100%; }
#body th, #body td { border: 1px solid var(--border); padding: 6px 10px; vertical-align: top; text-align: left; }
#body th { background: var(--th); white-space: nowrap; }
#body td { background: var(--panel); }
#body blockquote { margin: 12px 0; padding: 8px 14px; background: var(--quote); border-left: 4px solid var(--quote-border); border-radius: 0 8px 8px 0; }
#body blockquote p { margin: 4px 0; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin: 36px 0 10px; }
.pager button { font: inherit; font-size: 14px; padding: 10px 14px; border-radius: 10px; cursor: pointer; max-width: 48%;
  border: 1px solid var(--border); background: var(--panel); color: var(--link); text-align: left; }
.pager button.next { margin-left: auto; text-align: right; }
.pager small { display: block; color: var(--muted); font-size: 12px; }
footer { border-top: 1px solid var(--border); background: var(--panel); font-size: 12.5px; color: var(--muted); padding-bottom: 70px; }
footer .wrap { padding-top: 14px; }
footer a { color: var(--link); }
[hidden] { display: none !important; }
@media (max-width: 480px) { body { font-size: 15px; } #body h1 { font-size: 21px; } #body h2 { font-size: 17.5px; } #body table { font-size: 13px; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <span class="brand">🐄 <span id="bookName">牛の教科書</span></span>
    <a class="home" id="home" href="index.html">← スマート農業News</a>
    <div class="langs" role="group" aria-label="言語 / Language">
      <button type="button" data-lang="ja" aria-pressed="true">日本語</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <button type="button" class="step" id="prev" aria-label="前の章">◀</button>
    <button type="button" id="tocBtn" aria-expanded="false"><span class="t" id="chTitle"></span><span class="caret">▼</span></button>
    <button type="button" class="step" id="next" aria-label="次の章">▶</button>
  </div>
  <div class="toc" id="toc" hidden><div class="wrap"><div class="toc-in" id="tocIn"></div></div></div>
</div>

<main class="wrap">
  <article id="body"></article>
  <nav class="pager" id="pager"></nav>
</main>

<footer>
  <div class="wrap">
    <p id="footNote">数字は日本のホルスタインのおおよその目安です。病気の治療は獣医師が決めます。</p>
    <p><a href="index.html" id="footHome">スマート農業News</a> ・ <a href="board.html" id="footBoard">伝言板</a></p>
  </div>
</footer>

<script type="application/json" id="book">{{BOOK}}</script>
<script>
(function () {
  "use strict";
  var BOOK = JSON.parse(document.getElementById("book").textContent);
  var chapters = BOOK.chapters;
  var UI = {
    ja: { book: "牛の教科書", home: "← スマート農業News", prev: "前の章", next: "次の章", toc: "目次",
          foot: "数字は日本のホルスタインのおおよその目安です。病気の治療は獣医師が決めます。",
          footHome: "スマート農業News", footBoard: "伝言板", title: "牛の教科書｜スマート農業News" },
    en: { book: "Dairy Cow Textbook", home: "← Smart Agri News", prev: "Previous", next: "Next", toc: "Contents",
          foot: "Numbers are rough guides for Holstein cows in Japan. A veterinarian decides how to treat a sick cow.",
          footHome: "Smart Agri News", footBoard: "Message board", title: "Dairy Cow Textbook | Smart Agri News" }
  };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var POS_KEY = "cow-book-pos";
  var $ = function (id) { return document.getElementById(id); };
  var body = $("body"), bar = document.querySelector(".bar");
  var state = { idx: 0, lang: "ja" };

  // ---------- Markdown → HTML（見出し・段落・リスト・表・引用・画像・太字・リンク・コード） ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function url(u) { return /^(https?:|#|\/)/.test(u) ? u : "cow/" + u; }
  function inline(text) {
    var codes = [];
    text = text.replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
    text = esc(text);
    text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, a, u) { return '<img src="' + esc(url(u)) + '" alt="' + a + '" loading="lazy">'; });
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, u) {
      var ext = /^https?:/.test(u);
      return '<a href="' + esc(ext ? u : url(u)) + '"' + (ext ? ' target="_blank" rel="noopener"' : "") + ">" + t + "</a>";
    });
    text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return text.replace(/\u0000(\d+)\u0000/g, function (_, i) { return "<code>" + esc(codes[i]) + "</code>"; });
  }
  // 図の番号の頭（「図 9-1」の 9、付録なら A）
  function figPrefix(ch) {
    var m = ch.title.ja.match(/^(\d+)\./) || ch.title.ja.match(/^付録([A-Z])/);
    return m ? m[1] : "";
  }
  function render(src, prefix, lang) {
    var lines = src.replace(/\r\n/g, "\n").split("\n"), out = [], i = 0, m, fig = 0;
    var isSep = function (l) { return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l); };
    var cells = function (l) {
      return l.trim().replace(/^\|/, "").replace(/(?<!\\)\|$/, "").split(/(?<!\\)\|/)
        .map(function (c) { return c.trim().replace(/\\\|/g, "|"); });
    };
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"); i++; continue; }
      if ((m = line.match(/^\s*!\[([^\]]*)\]\(([^)\s]+)\)\s*$/))) {   // 1行だけの画像は、番号と説明の付いた図にする
        fig++;
        var label = (lang === "en" ? "Fig. " : "図 ") + (prefix ? prefix + "-" : "") + fig;
        out.push('<figure><img src="' + esc(url(m[2])) + '" alt="' + esc(m[1]) + '" loading="lazy">'
          + '<figcaption data-zoom="' + (lang === "en" ? "  🔍 tap to zoom" : "　🔍 押すと拡大") + '"><b>' + label + "</b>" + inline(m[1]) + "</figcaption></figure>");
        i++; continue;
      }
      if (line.trim().charAt(0) === "|" && i + 1 < lines.length && isSep(lines[i + 1])) {
        var head = cells(line), rows = [];
        i += 2;
        while (i < lines.length && lines[i].trim().charAt(0) === "|") rows.push(cells(lines[i++]));
        out.push('<div class="tbl"><table><thead><tr>' + head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") +
          "</tr></thead><tbody>" + rows.map(function (r) {
            return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
          }).join("") + "</tbody></table></div>");
        continue;
      }
      if (/^>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
        out.push("<blockquote>" + q.filter(function (l) { return l.trim(); }).map(function (l) { return "<p>" + inline(l) + "</p>"; }).join("") + "</blockquote>");
        continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
        var ordered = /^\s*\d+\./.test(line), start = ordered ? parseInt(line.trim(), 10) : 1, items = [];
        while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i]) && !/^\s{2,}/.test(lines[i])) {
          var item = lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""), subs = [];
          while (i < lines.length && /^\s{2,}\S/.test(lines[i])) {
            if (/^\s{2,}([-*]|\d+\.)\s+/.test(lines[i])) subs.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
            else if (subs.length) subs[subs.length - 1] += " " + lines[i++].trim();
            else item += " " + lines[i++].trim();
          }
          items.push("<li>" + inline(item) + (subs.length ? "<ul>" + subs.map(function (s) { return "<li>" + inline(s) + "</li>"; }).join("") + "</ul>" : "") + "</li>");
        }
        out.push(ordered ? "<ol" + (start > 1 ? ' start="' + start + '"' : "") + ">" + items.join("") + "</ol>" : "<ul>" + items.join("") + "</ul>");
        continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|>|\s*([-*]|\d+\.)\s+|\s*\||\s*!\[)/.test(lines[i])) para.push(inline(lines[i++].trim()));
      if (para.length) out.push("<p>" + para.join("<br>") + "</p>");
      else out.push("<p>" + inline(lines[i++]) + "</p>");
    }
    return out.join("\n");
  }

  // ---------- 読んでいる場所（見出しの番号と、その節の中の割合） ----------
  function headings() { return Array.prototype.slice.call(body.querySelectorAll("h1, h2, h3, h4")); }
  function topLine() { return bar.getBoundingClientRect().bottom + 8; }
  function anchor() {
    var hs = headings(), line = topLine(), h = 0;
    for (var k = 0; k < hs.length; k++) { if (hs[k].getBoundingClientRect().top <= line) h = k; else break; }
    if (!hs.length) return { h: 0, r: 0 };
    var a = hs[h].getBoundingClientRect().top, b = hs[h + 1] ? hs[h + 1].getBoundingClientRect().top : body.getBoundingClientRect().bottom;
    var r = b > a ? Math.max(0, Math.min(1, (line - a) / (b - a))) : 0;
    return { h: h, r: Math.round(r * 1000) / 1000 };
  }
  function goAnchor(p) {
    var hs = headings();
    if (!p || !hs[p.h]) { window.scrollTo(0, 0); return; }
    var a = hs[p.h].getBoundingClientRect().top + window.scrollY;
    var b = hs[p.h + 1] ? hs[p.h + 1].getBoundingClientRect().top + window.scrollY : body.getBoundingClientRect().bottom + window.scrollY;
    var y = a + (b - a) * (p.r || 0) - (topLine() - 0);
    window.scrollTo(0, Math.max(0, p.h === 0 && !p.r ? 0 : y));
  }
  var saveTimer = null;
  function savePos() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      var a = anchor();
      store.set(POS_KEY, JSON.stringify({ idx: state.idx, lang: state.lang, h: a.h, r: a.r }));
    }, 250);
  }

  // ---------- 表示 ----------
  function t(k) { return UI[state.lang][k]; }
  function setHash() {
    var h = "#ch=" + state.idx + (state.lang === "en" ? "&lang=en" : "");
    if (location.hash !== h) history.replaceState(null, "", location.pathname + location.search + h);
  }
  function show(idx, lang, pos) {
    state.idx = Math.max(0, Math.min(chapters.length - 1, idx));
    state.lang = lang === "en" ? "en" : "ja";
    var ch = chapters[state.idx];
    document.documentElement.lang = state.lang;
    document.title = ch.title[state.lang] + (state.lang === "en" ? " | " : "｜") + t("book");
    $("bookName").textContent = t("book");
    $("home").textContent = t("home");
    $("footNote").textContent = t("foot");
    $("footHome").textContent = t("footHome");
    $("footBoard").textContent = t("footBoard");
    $("prev").setAttribute("aria-label", t("prev"));
    $("next").setAttribute("aria-label", t("next"));
    document.querySelectorAll(".langs button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.lang === state.lang ? "true" : "false"); });
    $("chTitle").textContent = ch.title[state.lang];
    $("prev").disabled = state.idx === 0;
    $("next").disabled = state.idx === chapters.length - 1;
    body.innerHTML = render(ch.md[state.lang], figPrefix(ch), state.lang);
    var prev = chapters[state.idx - 1], next = chapters[state.idx + 1];
    $("pager").innerHTML =
      (prev ? '<button type="button" data-go="' + (state.idx - 1) + '"><small>◀ ' + esc(t("prev")) + "</small>" + esc(prev.title[state.lang]) + "</button>" : "") +
      (next ? '<button type="button" class="next" data-go="' + (state.idx + 1) + '"><small>' + esc(t("next")) + " ▶</small>" + esc(next.title[state.lang]) + "</button>" : "");
    closeToc();
    setHash();
    goAnchor(pos);
    keepAnchor(pos);
    savePos();
  }

  // 図が読み込まれて高さが変わっても、自分でスクロールするまでは同じ場所に合わせ直す
  var userMoved = false, keepUntil = 0;
  ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (ev) {
    window.addEventListener(ev, function () { userMoved = true; }, { passive: true });
  });
  function keepAnchor(pos) {
    if (!pos) return;
    userMoved = false;
    keepUntil = Date.now() + 4000;
    body.querySelectorAll("img").forEach(function (img) {
      if (img.complete) return;
      img.addEventListener("load", function () { if (!userMoved && Date.now() < keepUntil) goAnchor(pos); });
    });
  }

  // ---------- 目次 ----------
  // 目次: 章ごとに ▶ で開くと、その章の見出し（##）が並ぶ。今の章は最初から開いておく
  var openSet = {};
  function outline(ch) {
    var res = [], n = 0;   // n は、ページの見出し（h1〜h4）の中での番号。goAnchor にそのまま渡せる
    ch.md[state.lang].split("\n").forEach(function (l) {
      var m = l.match(/^(#{1,4})\s+(.*)$/);
      if (!m) return;
      if (m[1].length === 2) res.push({ h: n, text: m[2].replace(/\*\*/g, "") });
      n++;
    });
    return res;
  }
  function buildToc() {
    var html = "", part = "", open = state.lang === "en" ? "Open" : "開く", shut = state.lang === "en" ? "Close" : "閉じる";
    chapters.forEach(function (c, i) {
      if (c.part[state.lang] !== part) { part = c.part[state.lang]; html += "<h3>" + esc(part) + "</h3>"; }
      var on = !!openSet[i];
      html += '<div class="row' + (i === state.idx ? " on" : "") + '">'
        + '<button type="button" class="tg" data-tg="' + i + '" aria-expanded="' + on + '" aria-label="' + (on ? shut : open) + '">' + (on ? "▼" : "▶") + "</button>"
        + '<button type="button" class="ch" data-go="' + i + '">' + esc(c.title[state.lang]) + "</button></div>";
      if (on) {
        html += '<div class="subs">' + outline(c).map(function (o) {
          return '<button type="button" class="sub" data-go="' + i + '" data-h="' + o.h + '">' + esc(o.text) + "</button>";
        }).join("") + "</div>";
      }
    });
    $("tocIn").innerHTML = html;
  }
  function openToc() {
    openSet[state.idx] = true;
    buildToc();
    $("toc").hidden = false;
    $("tocBtn").setAttribute("aria-expanded", "true");
    var on = $("tocIn").querySelector(".row.on");
    if (on) $("tocIn").scrollTop = Math.max(0, on.offsetTop - 60);
  }
  function closeToc() { $("toc").hidden = true; $("tocBtn").setAttribute("aria-expanded", "false"); }

  $("tocBtn").addEventListener("click", function () { $("toc").hidden ? openToc() : closeToc(); });
  $("tocIn").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.tg) {                               // ▶ ▼ で開く・閉じる（目次は開いたまま）
      var k = +b.dataset.tg, top = $("tocIn").scrollTop;
      openSet[k] = !openSet[k];
      buildToc();
      $("tocIn").scrollTop = top;
      return;
    }
    var go = +b.dataset.go, pos = b.dataset.h ? { h: +b.dataset.h, r: 0 } : null;
    if (go === state.idx && pos) { closeToc(); goAnchor(pos); savePos(); }
    else show(go, state.lang, pos);
  });
  document.addEventListener("click", function (e) {
    // 目次の外を押したら閉じる（▶ で目次を作り直したときは、押したボタンがもうページにないので除く）
    if (!$("toc").hidden && e.target.isConnected && !e.target.closest(".bar")) closeToc();
    var g = e.target.closest("#pager [data-go]");
    if (g) show(+g.dataset.go, state.lang, null);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closeToc(); closeZoom(); } });

  // 図を押すと、大きく表示する（スマホでは横にずらしたり、2本の指で拡大したりできる）
  var zoomEl = null;
  function closeZoom() { if (zoomEl) { zoomEl.remove(); zoomEl = null; document.body.style.overflow = ""; } }
  body.addEventListener("click", function (e) {
    var img = e.target.closest("figure img");
    if (!img) return;
    var cap = img.parentNode.querySelector("figcaption");
    zoomEl = document.createElement("div");
    zoomEl.className = "zoom";
    zoomEl.innerHTML = '<button type="button" class="x">✕ ' + (state.lang === "en" ? "Close" : "閉じる") + "</button>"
      + '<img src="' + esc(img.getAttribute("src")) + '" alt="' + esc(img.alt) + '">'
      + "<p>" + (cap ? "<b>" + esc(cap.querySelector("b").textContent) + "</b>　" + esc(cap.textContent.slice(cap.querySelector("b").textContent.length)) : "") + "<br>"
      + (state.lang === "en" ? "Scroll sideways, or pinch with two fingers to zoom." : "横にずらしたり、2本の指で広げて拡大したりできます。") + "</p>";
    zoomEl.addEventListener("click", function (ev) { if (ev.target === zoomEl || ev.target.closest(".x")) closeZoom(); });
    document.body.appendChild(zoomEl);
    document.body.style.overflow = "hidden";
    zoomEl.scrollLeft = 0;
  });
  $("prev").addEventListener("click", function () { show(state.idx - 1, state.lang, null); });
  $("next").addEventListener("click", function () { show(state.idx + 1, state.lang, null); });
  document.querySelectorAll(".langs button").forEach(function (b) {
    b.addEventListener("click", function () {
      if (b.dataset.lang === state.lang) return;
      store.set("cow-book-lang", b.dataset.lang);
      show(state.idx, b.dataset.lang, anchor());   // 同じ見出しの、同じくらいの所を出す
    });
  });
  window.addEventListener("scroll", savePos, { passive: true });

  // ---------- 最初に開く章 ----------
  function fromHash() {
    var m = location.hash.match(/ch=(\d+)/), l = location.hash.match(/lang=(ja|en)/);
    return m ? { idx: +m[1], lang: l ? l[1] : null } : null;
  }
  window.addEventListener("hashchange", function () {
    var h = fromHash();
    if (h && (h.idx !== state.idx || (h.lang && h.lang !== state.lang))) show(h.idx, h.lang || state.lang, null);
  });
  var saved = null;
  try { saved = JSON.parse(store.get(POS_KEY) || "null"); } catch (e) { saved = null; }
  var h = fromHash();
  var lang = (h && h.lang) || store.get("cow-book-lang") || (saved && saved.lang) || "ja";
  if (h) show(h.idx, lang, saved && saved.idx === h.idx && saved.lang === lang ? saved : null);
  else if (saved) show(saved.idx, lang, saved.lang === lang ? saved : { h: saved.h, r: saved.r });
  else show(0, lang, null);
})();
</script>
<script src="translate.js" defer></script>
</body>
</html>
