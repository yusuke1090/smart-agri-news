<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スマート農業News</title>
<meta name="description" content="スマート農業・酪農・畜産・IoT に関するニュースを、毎朝7時にまとめて更新しています。">
<link rel="alternate" type="application/rss+xml" title="スマート農業News" href="feed.xml">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>">
<style>
:root {
  --bg: #f5f7f2; --panel: #ffffff; --border: #dde3d6; --text: #1e2a1c; --muted: #66735f;
  --accent: #2e7d32; --accent-soft: #e5f2e3; --link: #1b5e20; --new: #d84315;
  --t-dairy: #8d5a2b; --t-dairy-bg: #f6ece1; --t-smart: #1565c0; --t-smart-bg: #e3eefa;
  --t-iot: #6a3fa0; --t-iot-bg: #efe7f8; --t-policy: #546e7a; --t-policy-bg: #e8eef1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121611; --panel: #1a2019; --border: #2d372a; --text: #e4ebdf; --muted: #93a08c;
    --accent: #66bb6a; --accent-soft: #223322; --link: #a5d6a7; --new: #ff8a65;
    --t-dairy: #e0b07f; --t-dairy-bg: #3a2c1f; --t-smart: #90caf9; --t-smart-bg: #1b2b3d;
    --t-iot: #ce93d8; --t-iot-bg: #2f2238; --t-policy: #b0bec5; --t-policy-bg: #263035;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.7 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
header { background: var(--panel); border-bottom: 1px solid var(--border); }
header .wrap { padding-top: 22px; padding-bottom: 18px; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .02em; }
h1 span { margin-right: 6px; }
.lead { color: var(--muted); margin: 0; font-size: 13.5px; }
.stats { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--text); font-size: 15px; }
.stats .newc b { color: var(--new); }
.controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px;
  border-bottom: 1px solid var(--border); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: var(--panel); color: var(--text); }
.chip span { margin-left: 6px; color: var(--muted); font-size: 12px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.chip.on span { color: rgba(255,255,255,.85); }
.row2 { display: flex; gap: 10px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.row2 input[type=search] { flex: 1; min-width: 200px; font: inherit; font-size: 14px; padding: 6px 12px;
  border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
.row2 label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; cursor: pointer; }
main { padding-bottom: 40px; }
.day h2 { font-size: 15px; margin: 26px 0 8px; display: flex; align-items: baseline; gap: 8px; }
.day h2 .count { font-size: 12px; color: var(--muted); font-weight: normal; }
.item { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 16px; margin-bottom: 8px; }
.item h3 { font-size: 15.5px; margin: 4px 0 2px; line-height: 1.55; }
.item h3 a { color: var(--link); text-decoration: none; }
.item h3 a:hover { text-decoration: underline; }
.item h3 a:visited { color: var(--muted); }
.snippet { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.meta { margin-top: 4px; font-size: 12px; color: var(--muted); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 0 8px; border-radius: 4px; line-height: 20px; }
.t-dairy { color: var(--t-dairy); background: var(--t-dairy-bg); }
.t-smart { color: var(--t-smart); background: var(--t-smart-bg); }
.t-iot { color: var(--t-iot); background: var(--t-iot-bg); }
.t-policy { color: var(--t-policy); background: var(--t-policy-bg); }
.new { font-size: 11px; font-weight: 700; color: var(--new); line-height: 20px; margin-left: 2px; }
.empty, .noresult { color: var(--muted); text-align: center; padding: 40px 0; }
footer { border-top: 1px solid var(--border); background: var(--panel); font-size: 12.5px; color: var(--muted); }
footer .wrap { padding-top: 18px; padding-bottom: 28px; }
footer h2 { font-size: 13px; color: var(--text); margin: 0 0 6px; }
footer ul { list-style: none; padding: 0; margin: 0 0 14px; display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 2px 16px; }
footer li { display: flex; justify-content: space-between; gap: 8px; }
footer li.ng { color: var(--new); }
footer a { color: var(--link); }
footer p { margin: 4px 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1><span>🐄</span>スマート農業News</h1>
    <p class="lead">スマート農業・酪農・畜産・IoT に関するニュースを、毎朝7時にまとめています。</p>
    <div class="stats">
      <span>最終更新 <b><time datetime="{{UPDATED_ISO}}">{{UPDATED}}</time></b></span>
      <span class="newc">24時間以内の新着 <b>{{NEW}}</b> 件</span>
      <span>過去{{DAYS}}日分 <b>{{TOTAL}}</b> 件</span>
    </div>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="chips" id="chips">{{CHIPS}}</div>
    <div class="row2">
      <input type="search" id="q" placeholder="キーワードで絞り込む（例: 搾乳ロボット、ドローン）" aria-label="キーワード">
      <label><input type="checkbox" id="onlyNew"> 24時間以内だけ</label>
    </div>
  </div>
</div>

<main class="wrap" id="list">
{{ITEMS}}
<p class="noresult" id="noresult" hidden>条件に合うニュースはありません</p>
</main>

<footer>
  <div class="wrap">
    <h2>ニュースの取得元</h2>
    <ul>{{SOURCES}}</ul>
    <p>各記事のタイトル・抜粋の著作権は、それぞれの配信元に帰属します。記事の全文は、リンク先の配信元のサイトでお読みください。</p>
    <p>カテゴリはキーワードで自動的に分類しているため、内容と合わないことがあります。</p>
    <p><a href="feed.xml">RSS</a> ・ <a href="https://github.com/yusuke1090/smart-agri-news" target="_blank" rel="noopener">GitHub</a></p>
  </div>
</footer>

<script>
(function () {
  var cat = "all";
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var q = document.getElementById("q"), onlyNew = document.getElementById("onlyNew");
  var chips = document.querySelectorAll(".chip");

  function apply() {
    var words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    var any = false;
    document.querySelectorAll(".day").forEach(function (day) {
      var shown = 0;
      day.querySelectorAll(".item").forEach(function (it) {
        var ok = (cat === "all" || (" " + it.dataset.cats + " ").indexOf(" " + cat + " ") >= 0)
          && (!onlyNew.checked || it.dataset.new === "1")
          && words.every(function (w) { return it.dataset.search.indexOf(w) >= 0; });
        it.hidden = !ok;
        if (ok) shown++;
      });
      day.hidden = shown === 0;
      var c = day.querySelector(".count");
      if (c) c.textContent = shown + "件";
      if (shown) any = true;
    });
    document.getElementById("noresult").hidden = any;
  }

  chips.forEach(function (b) {
    b.addEventListener("click", function () {
      cat = b.dataset.cat;
      chips.forEach(function (x) { x.classList.toggle("on", x === b); });
      store.set("agri-news-cat", cat);
      apply();
    });
  });
  q.addEventListener("input", apply);
  onlyNew.addEventListener("change", apply);

  var saved = store.get("agri-news-cat");
  if (saved) chips.forEach(function (b) { if (b.dataset.cat === saved) b.click(); });
})();
</script>
</body>
</html>
