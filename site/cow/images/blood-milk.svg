<text x="306.0" y="66.0" font-size="12" text-anchor="start" fill="#1f1f1d" font-weight="700">細い血管（毛細血管）が破れる</text>
<text x="306.0" y="81.0" font-size="10.5" text-anchor="start" fill="#52514e">a capillary breaks</text>
<text x="190.0" y="286.0" font-size="11.5" text-anchor="middle" fill="#52514e">乳腺胞のまわりを細い血管が囲む</text><text x="190.0" y="301.0" font-size="10.5" text-anchor="middle" fill="#8a8984">capillaries surround the alveoli</text>
<rect x="400" y="100" width="290" height="38" rx="7" fill="#fdecea" stroke="#e34948" stroke-width="1.5"/>
<text x="412.0" y="117.0" font-size="12.5" text-anchor="start" fill="#1f1f1d" font-weight="700">① お産の直後（いちばん多い）</text><text x="412.0" y="132.0" font-size="10.5" text-anchor="start" fill="#52514e">right after calving: udder edema</text>
<rect x="400" y="144" width="290" height="38" rx="7" fill="#f3f4f6" stroke="#9a9a95" stroke-width="1.5"/>
<text x="412.0" y="161.0" font-size="12.5" text-anchor="start" fill="#1f1f1d" font-weight="700">② 乳房のけが</text><text x="412.0" y="176.0" font-size="10.5" text-anchor="start" fill="#52514e">injury to the udder</text>
<rect x="400" y="188" width="290" height="38" rx="7" fill="#f3f4f6" stroke="#9a9a95" stroke-width="1.5"/>
<text x="412.0" y="205.0" font-size="12.5" text-anchor="start" fill="#1f1f1d" font-weight="700">③ 搾乳のしかた</text><text x="412.0" y="220.0" font-size="10.5" text-anchor="start" fill="#52514e">vacuum too high, overmilking</text>
<rect x="400" y="232" width="290" height="38" rx="7" fill="#f3f4f6" stroke="#9a9a95" stroke-width="1.5"/>
<text x="412.0" y="249.0" font-size="12.5" text-anchor="start" fill="#1f1f1d" font-weight="700">④ 乳房炎</text><text x="412.0" y="264.0" font-size="10.5" text-anchor="start" fill="#52514e">mastitis</text>
<rect x="400" y="276" width="290" height="38" rx="7" fill="#f3f4f6" stroke="#9a9a95" stroke-width="1.5"/>
<text x="412.0" y="293.0" font-size="12.5" text-anchor="start" fill="#1f1f1d" font-weight="700">⑤ 血が止まりにくい病気（まれ）</text><text x="412.0" y="308.0" font-size="10.5" text-anchor="start" fill="#52514e">clotting disorders (rare)</text>
<path d="M730 70 V250 Q 730 272 750 272 Q 770 272 770 250 V70" fill="#fde3e3" stroke="#2b2b2b" stroke-width="2"/>
