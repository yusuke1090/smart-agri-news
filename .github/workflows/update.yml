# 毎朝ニュースを集めて、GitHub Pages のサイトを更新する
name: update-news

on:
  schedule:
    # GitHub の時刻は UTC。21:40 UTC = 日本時間 6:40。
    # 混雑で実行が数分〜数十分遅れることがあるので、7時に間に合うよう少し早めにしている
    - cron: "40 21 * * *"
  workflow_dispatch:      # GitHub の画面（Actions → update-news → Run workflow）から手動でも実行できる
  push:                   # build.py やデザインを変えて push したら、すぐサイトに反映する
    branches: [main]
    paths-ignore: ["data/**", "docs/**", "**.md"]

permissions:
  contents: write         # data/news.json をコミットするため
  pages: write
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ニュースを集めて、サイトを作る
        run: python build.py

      - name: 集めたデータをコミットする
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "ニュースを更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase -X theirs || true
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
