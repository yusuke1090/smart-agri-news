<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="system-ui, 'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="11">
<rect width="820" height="360" rx="10" fill="#ffffff"/>
<text x="410" y="26" font-size="16" text-anchor="middle" font-weight="700" fill="#2b2f36">エサの種類 / Types of feed</text>
<rect x="330" y="42" width="160" height="40" rx="8" fill="#f3f4f6" stroke="#555c66" stroke-width="2"/>
<text x="410" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#2b2f36">エサ Feed</text>
<path d="M410 82 L410 104 L210 104 L210 126 M410 104 L610 104 L610 126" fill="none" stroke="#555c66" stroke-width="2"/>
<rect x="40" y="126" width="340" height="52" rx="8" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="2"/>
<text x="210" y="148" font-size="15" text-anchor="middle" font-weight="700" fill="#1f7a3d">粗飼料 Roughage / forage</text>
<text x="210" y="167" font-size="12" text-anchor="middle" fill="#555c66">繊維が多い・反芻を増やす / high fiber, more chewing</text>
<rect x="440" y="126" width="340" height="52" rx="8" fill="#fff6e0" stroke="#c28a00" stroke-width="2"/>
<text x="610" y="148" font-size="15" text-anchor="middle" font-weight="700" fill="#c28a00">濃厚飼料 Concentrate</text>
<text x="610" y="167" font-size="12" text-anchor="middle" fill="#555c66">エネルギー・たんぱく質が多い / high energy, protein</text>
<path d="M210 178 L210 189 L92 189 L92 198 M210 189 L210 198 M210 189 L327 189 L327 198" fill="none" stroke="#1f7a3d" stroke-width="1.5"/>
<path d="M610 178 L610 189 L492 189 L492 198 M610 189 L610 198 M610 189 L727 189 L727 198" fill="none" stroke="#c28a00" stroke-width="1.5"/>
<g fill="#ffffff" stroke-width="1.5">
<rect x="40" y="198" width="105" height="92" rx="6" stroke="#1f7a3d"/>
<rect x="157" y="198" width="105" height="92" rx="6" stroke="#1f7a3d"/>
<rect x="275" y="198" width="105" height="92" rx="6" stroke="#1f7a3d"/>
<rect x="440" y="198" width="105" height="92" rx="6" stroke="#c28a00"/>
<rect x="557" y="198" width="105" height="92" rx="6" stroke="#c28a00"/>
<rect x="675" y="198" width="105" height="92" rx="6" stroke="#c28a00"/>
</g>
<g text-anchor="middle" fill="#555c66">
<text x="92" y="216" font-size="13" font-weight="700" fill="#1f7a3d">乾草</text><text x="92" y="231" fill="#1f7a3d">Hay</text>
<text x="92" y="249">チモシー timothy</text><text x="92" y="264">アルファルファ</text><text x="92" y="278">alfalfa</text>
<text x="210" y="216" font-size="13" font-weight="700" fill="#1f7a3d">サイレージ</text><text x="210" y="231" fill="#1f7a3d">Silage</text>
<text x="210" y="249">コーン corn</text><text x="210" y="264">グラス grass</text><text x="210" y="278">ラップ wrapped</text>
<text x="327" y="216" font-size="13" font-weight="700" fill="#1f7a3d">わら・生草</text><text x="327" y="231" fill="#1f7a3d">Straw, pasture</text>
<text x="327" y="249">稲わら rice straw</text><text x="327" y="264">放牧の草</text><text x="327" y="278">fresh grass</text>
<text x="492" y="216" font-size="13" font-weight="700" fill="#c28a00">穀類</text><text x="492" y="231" fill="#c28a00">Grains</text>
<text x="492" y="249">トウモロコシ corn</text><text x="492" y="264">大麦 barley</text><text x="492" y="278">マイロ milo</text>
<text x="610" y="216" font-size="13" font-weight="700" fill="#c28a00">油かす</text><text x="610" y="231" fill="#c28a00">Oilseed meals</text>
<text x="610" y="249">大豆かす</text><text x="610" y="264">soybean meal</text><text x="610" y="278">なたね粕 rapeseed</text>
<text x="727" y="216" font-size="13" font-weight="700" fill="#c28a00">ぬか・かす類</text><text x="727" y="231" fill="#c28a00">By-products</text>
<text x="727" y="249">ふすま bran</text><text x="727" y="264">ビートパルプ</text><text x="727" y="278">beet pulp</text>
</g>
<rect x="40" y="304" width="340" height="40" rx="8" fill="#f3f4f6" stroke="#555c66" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="210" y="321" font-size="12" text-anchor="middle" font-weight="700" fill="#2b2f36">TMR = 粗飼料と濃厚飼料を全部混ぜる</text>
<text x="210" y="337" text-anchor="middle" fill="#555c66">TMR (total mixed ration) = everything mixed together</text>
<rect x="440" y="304" width="340" height="40" rx="8" fill="#fff6e0" stroke="#c28a00" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="610" y="321" font-size="12" text-anchor="middle" font-weight="700" fill="#2b2f36">配合飼料 = これらを工場で混ぜたもの</text>
<text x="610" y="337" text-anchor="middle" fill="#555c66">Compound feed = these, mixed in a factory</text>
</svg>
