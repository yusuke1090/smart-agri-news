<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 352" font-family="system-ui, 'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="12">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker></defs>
<rect width="820" height="352" rx="10" fill="#ffffff"/>
<rect x="30" y="20" width="370" height="36" rx="8" fill="#2a78d6"/>
<text x="215.0" y="44.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">伝染性 / contagious</text>
<rect x="70" y="74" width="290" height="50" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="215.0" y="96.0" font-size="13" text-anchor="middle" fill="#1f1f1d" font-weight="700">感染した牛の乳房</text><text x="215.0" y="113.0" font-size="11" text-anchor="middle" fill="#52514e">an infected udder</text>
<path d="M215 126 V148" stroke="#52514e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="70" y="152" width="290" height="50" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="215.0" y="174.0" font-size="13" text-anchor="middle" fill="#1f1f1d" font-weight="700">ミルカー・手・タオル</text><text x="215.0" y="191.0" font-size="11" text-anchor="middle" fill="#52514e">milking unit, hands, towels</text>
<path d="M215 204 V226" stroke="#52514e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="70" y="230" width="290" height="50" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="215.0" y="252.0" font-size="13" text-anchor="middle" fill="#1f1f1d" font-weight="700">ほかの牛の乳頭</text><text x="215.0" y="269.0" font-size="11" text-anchor="middle" fill="#52514e">another cow's teat</text>
<text x="215.0" y="322.0" font-size="11.5" text-anchor="middle" fill="#1f1f1d" font-weight="700">防ぐ: 搾乳の衛生、1頭1枚のタオル、感染した牛は最後に搾る</text><text x="215.0" y="338.0" font-size="10.5" text-anchor="middle" fill="#52514e">Prevent: milking hygiene, 1 towel per cow, milk infected cows last</text>
<rect x="420" y="20" width="370" height="36" rx="8" fill="#eb6834"/>
<text x="605.0" y="44.0" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700">環境性 / environmental</text>
<rect x="460" y="74" width="290" height="50" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
<text x="605.0" y="96.0" font-size="13" text-anchor="middle" fill="#1f1f1d" font-weight="700">ふん・敷料・泥</text><text x="605.0" y="113.0" font-size="11" text-anchor="middle" fill="#52514e">manure, bedding, mud</text>
<path d="M605 126 V148" stroke="#52514e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="460" y="152" width="290" height="50" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
<text x="605.0" y="174.0" font-size="13" text-anchor="middle" fill="#1f1f1d" font-weight="700">寝たときに乳頭の先が触れる</text><text x="605.0" y="191.0" font-size="11" text-anchor="middle" fill="#52514e">teat ends touch it when lying</text>
<path d="M605 204 V226" stroke="#52514e" stroke-width="2" marker-end="url(#ah)"/>
<rect x="460" y="230" width="290" height="50" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
<text x="605.0" y="252.0" font-size="13" text-anchor="middle" fill="#1f1f1d" font-weight="700">乳頭口から乳房へ</text><text x="605.0" y="269.0" font-size="11" text-anchor="middle" fill="#52514e">through the teat canal</text>
<text x="605.0" y="322.0" font-size="11.5" text-anchor="middle" fill="#1f1f1d" font-weight="700">防ぐ: 乾いた清潔な敷料、ポストディッピング、搾乳後は立たせる</text><text x="605.0" y="338.0" font-size="10.5" text-anchor="middle" fill="#52514e">Prevent: dry clean bedding, post-dip, keep cows standing</text>
</svg>
