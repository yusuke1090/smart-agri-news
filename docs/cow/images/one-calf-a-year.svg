<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="system-ui, 'Noto Sans JP', 'Hiragino Sans', sans-serif" font-size="12">
<rect width="820" height="330" rx="10" fill="#ffffff"/>
<text x="410" y="30" font-size="16" text-anchor="middle" font-weight="700" fill="#2b2f36">1年1産のカレンダー / One calf a year (calving interval 365 days)</text>
<path d="M60 125 C 90 82 120 62 156 62 C 300 62 500 96 645 128" fill="none" stroke="#1f7a3d" stroke-width="3"/>
<circle cx="156" cy="62" r="4" fill="#1f7a3d"/>
<text x="170" y="58" font-size="12" font-weight="700" fill="#1f7a3d">乳量のピーク（6〜8週） / peak milk (6–8 weeks)</text>
<text x="470" y="88" font-size="11" fill="#1f7a3d">泌乳曲線 / lactation curve</text>
<rect x="60" y="150" width="585" height="28" rx="4" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="1.5"/>
<text x="352" y="169" text-anchor="middle" font-weight="700" fill="#1f7a3d">泌乳期 約305日 / Lactation (about 305 days)</text>
<rect x="645" y="150" width="115" height="28" rx="4" fill="#f3f4f6" stroke="#555c66" stroke-width="1.5"/>
<text x="702" y="169" text-anchor="middle" font-weight="700" fill="#555c66">乾乳 Dry 60日</text>
<rect x="60" y="190" width="115" height="28" rx="4" fill="#f3f4f6" stroke="#555c66" stroke-width="1.5"/>
<text x="117" y="209" font-size="11" text-anchor="middle" fill="#555c66">待機 VWP 50〜60日</text>
<rect x="175" y="190" width="48" height="28" rx="4" fill="#fff6e0" stroke="#c28a00" stroke-width="2"/>
<text x="199" y="209" font-size="11" text-anchor="middle" font-weight="700" fill="#c28a00">授精 AI</text>
<rect x="223" y="190" width="537" height="28" rx="4" fill="#f1ebf8" stroke="#6b3fa0" stroke-width="1.5"/>
<text x="491" y="209" text-anchor="middle" font-weight="700" fill="#6b3fa0">妊娠 約280日 / Pregnancy (about 280 days)</text>
<path d="M60 238 L760 238" stroke="#555c66" stroke-width="1.5"/>
<path d="M60 232 L60 244 M175 232 L175 244 M223 232 L223 244 M645 232 L645 244 M760 232 L760 244" stroke="#555c66" stroke-width="1.5"/>
<text x="60" y="258" font-weight="700" fill="#2b2f36">0日 分娩 Calving</text>
<text x="175" y="258" text-anchor="middle" fill="#555c66">60日</text>
<text x="223" y="258" text-anchor="middle" fill="#555c66">85日</text>
<text x="645" y="258" text-anchor="middle" fill="#555c66">305日 乾乳 Dry-off</text>
<text x="760" y="278" text-anchor="end" font-weight="700" fill="#2b2f36">365日 次の分娩 Next calving</text>
<text x="199" y="278" text-anchor="middle" font-size="11" fill="#c28a00">↑ 授精のチャンス AI window (day 60–85)</text>
<text x="410" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">365 − 280 = 85 → お産から85日以内に妊娠させる / Get her pregnant within 85 days after calving</text>
</svg>
