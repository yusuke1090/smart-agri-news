<script type="application/json" id="book">{"chapters": [{"file": "00-guide.md", "part": {"ja": "第1部 牛のからだ", "en": "Part 1: The cow's body"}, "title": {"ja": "0. この教科書の使い方", "en": "0. How to use this book"}, "md": {"ja": "# 0. この教科書の使い方\n\n## この章でわかること\n\n- この教科書で学べること\n- 読む順番\n- 日本語と英語の切り替え方\n\n## この教科書について\n\n乳牛（おもにホルスタイン）について、からだ・繁殖・エサ・乳・病気・牧場の仕事を、ひととおりまとめた教科書です。\nスマート農業News のニュースに出てくる言葉がわかること、センサーで牛を見るときに「何を測れば何がわかるか」を考えられることを目指しています。\n\n| 部 | 内容 |\n| --- | --- |\n| 第1部 牛のからだ | 乳牛とは、4つの胃と反芻 |\n| 第2部 繁殖と子牛 | 発情・授精・妊娠、1年1産、子牛の育て方 |\n| 第3部 エサ | 粗飼料と濃厚飼料、配合飼料、チモシーとアルファルファ、サイレージ |\n| 第4部 乳と病気 | 乳ができるしくみ、搾乳、乳房炎、血乳、お産の前後の病気 |\n| 第5部 牧場とスマート酪農 | 牛の一日、牛舎、センサーとロボットでわかること |\n| 付録 | 用語集（日本語・英語）、数字の目安 |\n\n## 読む順番\n\n| 人 | 読む順番 |\n| --- | --- |\n| はじめての人 | 1 → 2 → 3 → 5 → 8 → 9 章。そのあとは好きな章を |\n| 病気のことを知りたい | 8 → 9 → 10 → 11 章 |\n| エサのことを知りたい | 2 → 5 → 6 → 7 章 |\n| センサーや IoT に関わる人 | 2 → 3 → 11 → 12 章と、付録B |\n| 英語のニュースを読みたい | 付録A の用語集と、英語版の各章 |\n\n## 日本語と英語を切り替える\n\n- 上の **日本語 / English** を押すと、同じ章の同じ見出しの所が、もう一方の言葉で出ます\n- 英語版は、やさしい英語で書いています。海外のニュースを読む練習にも使えます\n- 英語の単語や文を選ぶと「🔤 訳す」が出て、日本語の意味がわかります（右下の「🔤 訳す」からも使えます）\n- 英語版では、大事な言葉の後ろに日本語を付けています（例: mastitis（乳房炎））\n\n## 画面の使い方\n\n| 操作 | 動き |\n| --- | --- |\n| 上の章の名前を押す | 目次が開く。部ごとに並んでいて、今の章の見出しにも飛べる |\n| ◀ ▶ | 前の章・次の章へ |\n| 左上の「スマート農業News」 | ニュースに戻る |\n\n- 開き直すと、前に読んでいた章の、読んでいた所から出ます\n- アドレスの後ろに `#ch=9` のように章の番号が付きます。コピーすれば、その章を人に送れます\n\n## 注意\n\n> 数字は、日本のホルスタインのおおよその**目安**です。牛・牧場・季節・調べ方で変わります。\n> 病気の説明は、しくみを知るためのものです。**治療は獣医師が決めます。** おかしいと思ったら、早めに獣医師に相談します。\n\n## まとめ\n\n- 乳牛のからだ・繁殖・エサ・乳・病気・牧場を、5つの部と付録でまとめている\n- 日本語 / English で、同じ所を切り替えて読める。英文は「🔤 訳す」で意味がわかる\n- 数字は目安。病気の治療は獣医師が決める\n", "en": "# 0. How to use this book\n\n## What you will learn\n\n- What this book covers\n- Which order to read the chapters in\n- How to switch between Japanese and English\n\n## About this book\n\nThis book covers the basics of dairy cows (mostly Holsteins): their body, breeding, feed, milk, diseases and farm work.\nIt aims to help you understand the words in the farming news on this site, and to think about **what to measure** when you watch cows with sensors.\n\n| Part | Contents |\n| --- | --- |\n| Part 1: The cow's body | What a dairy cow is, the four stomachs and rumination |\n| Part 2: Breeding and calves | Heat, insemination, pregnancy, \"one calf a year\", raising calves |\n| Part 3: Feed | Roughage and concentrate, compound feed, timothy and alfalfa, silage |\n| Part 4: Milk and health | How milk is made, milking, mastitis, blood in milk, diseases around calving |\n| Part 5: The farm and smart dairy | A cow's day, barns, what sensors and robots can tell us |\n| Appendix | Glossary (English and Japanese), key numbers |\n\n## Reading order\n\n| Reader | Order |\n| --- | --- |\n| New to cows | Chapters 1 → 2 → 3 → 5 → 8 → 9, then any chapter you like |\n| Interested in diseases | Chapters 8 → 9 → 10 → 11 |\n| Interested in feed | Chapters 2 → 5 → 6 → 7 |\n| Working with sensors or IoT | Chapters 2 → 3 → 11 → 12 and Appendix B |\n| Reading English news | Appendix A (glossary) and the English chapters |\n\n## Switching languages\n\n- Press **日本語 / English** at the top. The same chapter opens in the other language, at the same heading\n- The English version uses plain, simple English. You can use it to practice reading farming news\n- Select an English word or sentence and press \"🔤 訳す\" to see the Japanese meaning (you can also use the \"🔤 訳す\" button at the bottom right)\n- Important words have the Japanese word after them, for example: mastitis（乳房炎）\n\n## Using the page\n\n| Action | What happens |\n| --- | --- |\n| Press the chapter name at the top | The table of contents opens. Chapters are grouped by part. You can also jump to a heading in the current chapter |\n| ◀ ▶ | Go to the previous or next chapter |\n| \"スマート農業News\" at the top left | Go back to the news |\n\n- When you come back, the page opens at the chapter and place where you stopped reading\n- The address ends with the chapter number, like `#ch=9`. Copy it to send that chapter to someone\n\n## Notes\n\n> The numbers in this book are **rough guides** for Holstein cows in Japan. They change with each cow, farm, season and way of measuring.\n> The disease chapters explain how diseases work. **A veterinarian decides the treatment.** If something seems wrong, talk to a vet early.\n\n## Summary\n\n- This book covers the body, breeding, feed, milk, health and farm life of dairy cows, in five parts and an appendix\n- Switch between 日本語 and English to read the same place in either language. Use \"🔤 訳す\" for English words\n- Numbers are rough guides. A vet decides how to treat a sick cow\n"}}, {"file": "01-dairy-cow.md", "part": {"ja": "第1部 牛のからだ", "en": "Part 1: The cow's body"}, "title": {"ja": "1. 乳牛とは", "en": "1. What is a dairy cow?"}, "md": {"ja": "# 1. 乳牛とは\n\n## この章でわかること\n\n- 乳牛と肉牛のちがい\n- 乳牛の品種\n- からだの大きさや乳の量の目安\n- 乳牛の一生\n- 牛はどんな動物か\n\n## 乳牛と肉牛\n\n| 種類 | 英語 | 目的 | 日本の主な品種 |\n| --- | --- | --- | --- |\n| 乳牛（乳用種） | dairy cattle | 乳をとる | ホルスタイン、ジャージー |\n| 肉牛（肉用種） | beef cattle | 肉をとる | 黒毛和種（和牛）など |\n| 交雑種（F1） | crossbred | 肉をとる | ホルスタインの母 × 黒毛和種の父 |\n\n- 乳を出すのはメスだけです。乳牛から生まれたオスは、肉用に育てられます\n- 乳牛に和牛の精液を使い、値段の高い交雑種（F1）の子牛を産ませることもよくあります\n\n## 乳牛の品種\n\n| 品種 | 英語 | 特徴 |\n| --- | --- | --- |\n| ホルスタイン | Holstein（Holstein-Friesian） | 白と黒のまだら。乳の量がいちばん多い。日本の乳牛のほとんどがこの品種 |\n| ジャージー | Jersey | 茶色で小さい（体重 400〜450 kg）。乳の量は少ないが、乳脂肪が多く濃い（5% ほど）。暑さに少し強い |\n| ブラウンスイス | Brown Swiss | 灰色がかった茶色で大きい。丈夫で長生き。チーズに向く乳 |\n| ガーンジー | Guernsey | 薄い茶色と白。乳が少し黄色っぽい |\n\nこの教科書の数字は、ホルスタインのものです。\n\n## 数字で見るホルスタイン\n\n| 項目 | 目安 |\n| --- | --- |\n| 体重（大人のメス） | 600〜700 kg |\n| 体高（肩の高さ） | 約 150 cm |\n| 生まれたときの体重 | 40〜45 kg |\n| 体温 | 38.0〜39.0 ℃（39.5 ℃ を超えたら熱がある） |\n| 1日の乳の量 | 平均 25〜35 kg。多い時期は 40〜50 kg を超える牛もいる |\n| 1年の乳の量 | 8,000〜10,000 kg ほど |\n| 1日に食べる量 | 乾物（水分を除いた重さ）で 20〜25 kg。水分を含めると 40〜60 kg |\n| 1日に飲む水 | 80〜150 L（暑い日や乳の多い牛はもっと） |\n| 寿命 | 自然には 20年ほど生きられるが、乳牛は 5〜6歳で牧場を離れることが多い |\n\n乳の量は、1回のお産から 305日間でまとめて数えることが多いです（305日乳量）。\n\n## 乳牛の一生\n\n| 時期 | 年齢の目安 | すること |\n| --- | --- | --- |\n| 哺育期の子牛 | 0〜2・3か月 | 初乳を飲む。ミルクと子牛用のエサで育つ（4章） |\n| 育成牛 | 3か月〜初めてのお産 | からだを大きくする。13〜15か月で初めて授精する（3章） |\n| 初産 | 22〜24か月 | 初めて子牛を産み、乳を出し始める |\n| 経産牛 | 2歳〜 | 「お産 → 乳を出す（約305日）→ 乾乳（約60日）→ お産」をくり返す |\n| 牧場を離れる | 5〜6歳ごろ | 乳が減った、子ができにくい、病気、脚が悪い、などの理由で。多くは肉になる |\n\n- **乳を出すのは、子牛を産んだあとだけ**です。だから乳牛は、毎年のようにお産をします（3章の「1年1産」）\n- 乳を止めて休ませる期間を、乾乳期（かんにゅうき, dry period）といいます\n- 生まれたメスの子牛は、次の乳牛として育てます。メスが生まれやすい精液（性選別精液）を使うこともあります\n\n## 牛はどんな動物か\n\n- 草を食べる**反芻動物**（ruminant）です。4つの胃を持ち、食べた草を口に戻してかみ直します（2章）\n- **群れ**で暮らします。群れの中には順位があり、強い牛が先にエサを食べます\n- **暑さに弱く、寒さに強い**です。快適なのは 5〜20 ℃ くらいで、暑いと食べる量と乳の量が減ります（11章）\n- 目が顔の横にあり、ほとんど一周（330度ほど）見えます。真後ろは見えないので、後ろから近づくときは声をかけます\n- いつも同じ流れ（時刻・手順）を好みます。急な音や動き、乱暴な扱いは、乳の出を悪くします（8章）\n- 1日に 10〜14時間、横になって休みます。よく休める牛ほど、乳もよく出します（12章）\n\n## まとめ\n\n- 日本の乳牛のほとんどはホルスタイン。体重 600〜700 kg、1年に 8,000〜10,000 kg の乳を出す\n- 乳を出すのはお産のあとだけ。「お産 → 乳 → 乾乳」をくり返す\n- 13〜15か月で初めて授精し、22〜24か月で初めてのお産。5〜6歳で牧場を離れることが多い\n- 牛は反芻動物で、群れで暮らし、暑さに弱い\n", "en": "# 1. What is a dairy cow?\n\n## What you will learn\n\n- The difference between dairy cattle and beef cattle\n- Dairy breeds\n- Typical body size and milk yield\n- The life of a dairy cow\n- What kind of animal a cow is\n\n## Dairy cattle and beef cattle\n\n| Type | Japanese | Purpose | Main breeds in Japan |\n| --- | --- | --- | --- |\n| Dairy cattle | 乳牛（乳用種） | Milk | Holstein, Jersey |\n| Beef cattle | 肉牛（肉用種） | Meat | Japanese Black (Wagyu) and others |\n| Crossbred (F1) | 交雑種 | Meat | Holstein mother × Japanese Black father |\n\n- Only females give milk. Male calves born to dairy cows are raised for meat\n- Farmers often use Wagyu semen on dairy cows to get crossbred (F1) calves, which sell for a good price\n\n## Dairy breeds\n\n| Breed | Japanese | Features |\n| --- | --- | --- |\n| Holstein (Holstein-Friesian) | ホルスタイン | Black-and-white. Gives the most milk. Almost all dairy cows in Japan are Holsteins |\n| Jersey | ジャージー | Brown and small (400–450 kg). Less milk, but rich, with about 5% fat. A little better in hot weather |\n| Brown Swiss | ブラウンスイス | Large, grey-brown. Strong and long-lived. Milk is good for cheese |\n| Guernsey | ガーンジー | Light brown and white. Milk is slightly yellow |\n\nThe numbers in this book are for Holsteins.\n\n## Holsteins in numbers\n\n| Item | Typical value |\n| --- | --- |\n| Body weight (adult female) | 600–700 kg |\n| Height at the shoulder | about 150 cm |\n| Birth weight | 40–45 kg |\n| Body temperature | 38.0–39.0 °C (above 39.5 °C is a fever) |\n| Milk per day | 25–35 kg on average. Some cows give more than 40–50 kg at peak |\n| Milk per year | about 8,000–10,000 kg |\n| Feed per day | 20–25 kg of dry matter (weight without water). 40–60 kg including water |\n| Water per day | 80–150 L (more on hot days and for high-yielding cows) |\n| Lifespan | A cow can live about 20 years, but dairy cows usually leave the farm at 5–6 years old |\n\nMilk yield is often counted over 305 days after one calving (the \"305-day yield\").\n\n## The life of a dairy cow\n\n| Stage | Typical age | What happens |\n| --- | --- | --- |\n| Young calf | 0 to 2–3 months | Drinks colostrum, then grows on milk and calf feed (Chapter 4) |\n| Heifer (育成牛) | 3 months to first calving | Grows. First insemination at 13–15 months (Chapter 3) |\n| First calving (初産) | 22–24 months | Gives birth for the first time and starts giving milk |\n| Cow (経産牛) | from 2 years | Repeats \"calving → milking (about 305 days) → dry period (about 60 days) → calving\" |\n| Leaving the farm | around 5–6 years | Because of low milk, failure to get pregnant, disease or bad legs. Most go for meat |\n\n- **A cow only gives milk after she has a calf.** So dairy cows have a calf almost every year (\"one calf a year\", Chapter 3)\n- The rest period with no milking is called the **dry period** (乾乳期)\n- Female calves are raised to become the next dairy cows. Farmers sometimes use **sexed semen** (性選別精液) to get more female calves\n\n## What kind of animal is a cow?\n\n- A cow is a grass-eating **ruminant** (反芻動物). It has four stomachs and brings food back to its mouth to chew again (Chapter 2)\n- Cows live in **herds**. There is a social order, and stronger cows eat first\n- Cows **handle cold well but heat badly**. They are comfortable at about 5–20 °C. When it is hot, they eat less and give less milk (Chapter 11)\n- Their eyes are on the sides of the head, so they can see almost all around (about 330 degrees). They cannot see directly behind, so speak to a cow when you come from behind\n- Cows like routine (the same times and the same steps). Sudden noise, sudden movement and rough handling reduce milk let-down (Chapter 8)\n- Cows lie down and rest for 10–14 hours a day. Cows that rest well give more milk (Chapter 12)\n\n## Summary\n\n- Almost all dairy cows in Japan are Holsteins. They weigh 600–700 kg and give 8,000–10,000 kg of milk a year\n- Cows give milk only after calving. They repeat \"calving → milking → dry period\"\n- First insemination at 13–15 months, first calving at 22–24 months. Most cows leave the farm at 5–6 years old\n- Cows are ruminants, live in herds and are weak in hot weather\n"}}, {"file": "02-stomach.md", "part": {"ja": "第1部 牛のからだ", "en": "Part 1: The cow's body"}, "title": {"ja": "2. 4つの胃と反芻", "en": "2. Four stomachs and rumination"}, "md": {"ja": "# 2. 4つの胃と反芻\n\n## この章でわかること\n\n- 4つの胃のはたらき\n- 反芻とは何か、なぜ大事か\n- 第一胃の微生物と、エサが乳になるまで\n- ルーメンアシドーシス\n\n## 4つの胃\n\n![牛の4つの胃とエサの流れ](images/stomach.svg)\n\n| 胃 | 英語 | 焼肉での名前 | はたらき |\n| --- | --- | --- | --- |\n| 第一胃 | rumen（ルーメン） | ミノ | いちばん大きい（大人で 150〜200 L）。微生物がエサを発酵させる「発酵タンク」 |\n| 第二胃 | reticulum | ハチノス | 第一胃とつながっていて、中身をかき混ぜる。食べたものを口に戻す（反芻）入口。飲み込んだ金属がたまりやすい |\n| 第三胃 | omasum | センマイ | 薄いひだがたくさんある。水分を吸い、細かくなったものだけを先へ送る |\n| 第四胃 | abomasum | ギアラ | 人の胃と同じ。胃酸と消化酵素で消化する |\n\n- 4つの胃は、お腹の左側の大部分を占めます。第一胃が全体の 8割ほどです\n- 生まれたばかりの子牛は、第四胃がいちばん大きく、第一胃はまだ小さいです。ミルクは食道溝（しょくどうこう）という通り道を通り、第一胃を通らずに第四胃に入ります。草や固形のエサを食べ始めると、第一胃が育ちます（4章）\n\n## 反芻\n\n- **反芻**（はんすう, rumination）: 一度飲み込んだエサを口に戻して、もう一度かむこと\n- 1日に **7〜10時間**（400〜600分）も反芻します。多くは横になって休んでいるときです\n- 口に戻した1つのかたまりを、40〜70回ほどかんでから、また飲み込みます\n- かむと唾液がたくさん出ます。1日に 100〜180 L にもなります\n- 唾液には重曹（炭酸水素ナトリウム）のような成分が入っていて、第一胃が酸っぱくなりすぎないようにします（緩衝作用）\n\n### 反芻が大事なわけ\n\n- 草を細かくして、微生物が分解しやすくする\n- 唾液で、第一胃の pH を保つ\n- **反芻が減るのは、体の調子が悪いサイン**です。病気・お産・発情・暑さ・ストレスで減ります。だから首輪などのセンサーで反芻の時間を測ります（12章）\n- 草（繊維）の少ないエサでは、反芻が減る → 唾液が減る → 第一胃が酸性に傾く（下の「ルーメンアシドーシス」）\n\n## 第一胃の微生物\n\n- 第一胃には、細菌・原虫・カビ（真菌）などの微生物がすんでいます。中身 1 mL に、細菌が 100億個以上います\n- 牛は自分では草の繊維（セルロース）を消化できません。**微生物が分解して発酵させ**、牛はその産物をもらって生きています\n- 発酵でできる**揮発性脂肪酸**（VFA）が、牛のエネルギーの 6〜7割をまかないます\n\n| VFA | 英語 | 多くなるエサ | 体の中で |\n| --- | --- | --- | --- |\n| 酢酸 | acetic acid | 草（繊維） | 乳脂肪のもとになる |\n| プロピオン酸 | propionic acid | 穀物（デンプン） | 肝臓でブドウ糖になる → 乳糖 → 乳の量 |\n| 酪酸 | butyric acid | 糖・デンプン | 第一胃の壁の栄養になる |\n\n- 微生物そのものも、第四胃と小腸で消化されて、牛のたんぱく質になります（微生物たんぱく質）\n- 発酵でメタンガスもでき、げっぷで出ます。1頭で 1日に数百 L になり、温室効果ガスとして、減らす研究が進んでいます（ニュースによく出ます）\n\n## エサが乳になるまで\n\n1. 口でかむ（草をちぎって飲み込む）\n2. 第一胃・第二胃で、微生物が発酵させる（VFA と微生物ができる）\n3. 反芻で、口に戻してかみ直す（何度もくり返す）\n4. 細かくなったものが第三胃 → 第四胃 → 小腸へ進み、消化・吸収される\n5. VFA は第一胃の壁から、そのほかは小腸から吸収され、血液に入る\n6. 血液が乳房に運ばれ、乳になる（8章）\n\n## ルーメンアシドーシス\n\n- **ルーメンアシドーシス**（rumen acidosis）: 第一胃が酸性になりすぎる病気\n- 穀物（濃厚飼料）を急に・たくさん食べる → デンプンが速く発酵して酸がたくさんできる → 第一胃の pH が下がる\n- 正常な pH は 6〜7 です。5.8 を下回る時間が長く続くのが**亜急性ルーメンアシドーシス**（SARA）、5.0 を下回ると急性で、命にかかわります\n\n| サイン | 理由 |\n| --- | --- |\n| 食べむらがある、反芻が減る | 第一胃の調子が悪い |\n| 便がやわらかい、泡や消化されていない穀物が混じる | 第一胃で消化しきれていない |\n| 乳脂肪率が下がる | 酢酸が減る |\n| 蹄の病気が増える | 酸や毒素が体をめぐり、蹄を傷める（11章） |\n\n防ぐには、草（繊維）を十分に与える、濃厚飼料を一度にたくさん与えない（何回かに分ける・TMR）、エサを急に変えない、ことです（5章）。\n\n## まとめ\n\n- 牛の胃は4つ。第一胃（ルーメン）は微生物の発酵タンク\n- 反芻は 1日 7〜10時間。唾液が第一胃を守る。反芻が減るのは不調のサイン\n- 微生物が草を発酵させてできる VFA が、牛のエネルギーと乳のもと\n- 穀物が多すぎるとルーメンアシドーシス。草とのバランスが大事\n", "en": "# 2. Four stomachs and rumination\n\n## What you will learn\n\n- What each of the four stomachs does\n- What rumination is, and why it matters\n- Rumen microbes, and how feed becomes milk\n- Rumen acidosis\n\n## The four stomachs\n\n![The four stomachs and the flow of feed](images/stomach.svg)\n\n| Stomach | Japanese | Name as food in Japan | What it does |\n| --- | --- | --- | --- |\n| Rumen | 第一胃 | ミノ (mino) | The largest (150–200 L in an adult). A \"fermentation tank\" where microbes ferment the feed |\n| Reticulum | 第二胃 | ハチノス (hachinosu) | Joined to the rumen and mixes its contents. The gateway for sending food back to the mouth (rumination). Swallowed metal tends to collect here |\n| Omasum | 第三胃 | センマイ (senmai) | Has many thin folds. Absorbs water and lets only small particles pass |\n| Abomasum | 第四胃 | ギアラ (giara) | Works like a human stomach. Digests food with acid and enzymes |\n\n- The four stomachs fill most of the left side of the belly. The rumen is about 80% of the total\n- In a newborn calf, the abomasum is the largest and the rumen is still small. Milk goes straight to the abomasum through a channel called the esophageal groove (食道溝), skipping the rumen. When the calf starts eating grass and solid feed, the rumen grows (Chapter 4)\n\n## Rumination\n\n- **Rumination** (反芻): bringing swallowed food back up to the mouth and chewing it again. People also say \"chewing the cud\"\n- Cows ruminate for **7–10 hours a day** (400–600 minutes), mostly while lying down and resting\n- Each ball of food (a bolus) is chewed 40–70 times and then swallowed again\n- Chewing makes a lot of saliva: 100–180 L a day\n- Saliva contains something like baking soda (sodium bicarbonate). It stops the rumen from becoming too acidic (this is called buffering)\n\n### Why rumination matters\n\n- It breaks grass into small pieces, so microbes can digest it more easily\n- Saliva keeps the rumen pH stable\n- **Less rumination is a sign that something is wrong.** It drops with illness, calving, heat (estrus), hot weather and stress. That is why collars and other sensors measure rumination time (Chapter 12)\n- If the diet has too little grass (fiber), cows ruminate less → make less saliva → the rumen becomes acidic (see \"Rumen acidosis\" below)\n\n## Rumen microbes\n\n- Bacteria, protozoa and fungi live in the rumen. There are more than 10 billion bacteria in 1 mL of rumen fluid\n- Cows cannot digest grass fiber (cellulose) by themselves. **Microbes break it down and ferment it**, and the cow lives on what they make\n- Fermentation makes **volatile fatty acids** (VFAs, 揮発性脂肪酸). VFAs supply about 60–70% of the cow's energy\n\n| VFA | Japanese | Increased by | In the body |\n| --- | --- | --- | --- |\n| Acetic acid (acetate) | 酢酸 | Grass (fiber) | Becomes milk fat |\n| Propionic acid (propionate) | プロピオン酸 | Grain (starch) | Becomes glucose in the liver → lactose → milk volume |\n| Butyric acid (butyrate) | 酪酸 | Sugar and starch | Feeds the rumen wall |\n\n- The microbes themselves are later digested in the abomasum and small intestine and become protein for the cow (microbial protein)\n- Fermentation also makes methane gas, which cows burp out. One cow makes hundreds of liters a day. Research to reduce it is active, because methane is a greenhouse gas (it is often in the news)\n\n## How feed becomes milk\n\n1. The cow bites off grass and swallows it with little chewing\n2. Microbes ferment it in the rumen and reticulum (making VFAs and more microbes)\n3. The cow brings it back up and chews it again (rumination, many times)\n4. Small particles move on to the omasum → abomasum → small intestine, where they are digested and absorbed\n5. VFAs are absorbed through the rumen wall, and other nutrients through the small intestine, into the blood\n6. The blood carries the nutrients to the udder, where they become milk (Chapter 8)\n\n## Rumen acidosis\n\n- **Rumen acidosis** (ルーメンアシドーシス): a condition where the rumen becomes too acidic\n- If a cow eats a lot of grain (concentrate) suddenly → starch ferments fast and makes a lot of acid → the rumen pH falls\n- Normal rumen pH is 6–7. When it stays below 5.8 for long periods, it is **subacute rumen acidosis** (SARA). Below 5.0 it is acute and can kill the cow\n\n| Sign | Reason |\n| --- | --- |\n| Eats unevenly, ruminates less | The rumen is not working well |\n| Loose manure with bubbles or undigested grain | Feed is not fully digested in the rumen |\n| Lower milk fat | Less acetic acid |\n| More hoof problems | Acids and toxins travel through the body and damage the hooves (Chapter 11) |\n\nTo prevent it: feed enough grass (fiber), do not feed a lot of concentrate at once (split it into several meals, or use a TMR), and do not change the diet suddenly (Chapter 5).\n\n## Summary\n\n- Cows have four stomachs. The rumen is a fermentation tank full of microbes\n- Cows ruminate 7–10 hours a day. Saliva protects the rumen. Less rumination is a sign of trouble\n- Microbes ferment grass into VFAs, which give the cow energy and become milk\n- Too much grain causes rumen acidosis. Balance it with grass\n"}}, {"file": "03-breeding.md", "part": {"ja": "第2部 繁殖と子牛", "en": "Part 2: Breeding and calves"}, "title": {"ja": "3. 繁殖と1年1産", "en": "3. Breeding: one calf a year"}, "md": {"ja": "# 3. 繁殖と1年1産\n\n## この章でわかること\n\n- 乳を出すのに、お産が必要なわけ\n- 1年1産とは、なぜ大事か\n- 発情と、発情のサイン\n- 人工授精・妊娠・分娩\n- 繁殖の成績を表す数字\n\n## 乳を出すにはお産が必要\n\n- 牛は、子牛を産むと乳を出し始めます（泌乳, lactation）\n- 乳の量は、お産から **6〜8週ごろにいちばん多くなり**（ピーク）、そのあと少しずつ減ります。この変化をグラフにしたものを泌乳曲線（lactation curve）といいます\n- 減ってきたら、次のお産の 2か月ほど前に搾乳をやめて休ませます（**乾乳**, dry-off）。乳房を休ませ、次のお産と乳に備えます\n- だから乳を出し続けるには、**毎年のようにお産**をさせる必要があります\n\n## 1年1産\n\n![1年1産のカレンダー](images/one-calf-a-year.svg)\n\n- **1年1産**: 1頭の牛が、1年に1回お産をすること。お産からお産までの日数（**分娩間隔**, calving interval）を 365日にするのが目標です\n- 妊娠期間は約 **280日** です。365 − 280 = 85 なので、**お産から 85日以内に、次の子を妊娠させる**必要があります\n- お産のあと、子宮が元に戻るまで 40日ほどかかります。そのため、お産から 50〜60日は授精しません（自発的待機期間, VWP）\n- 授精できるのは 60〜85日目ごろ。発情は 21日ごとなので、チャンスは 1〜2回しかありません\n- 1回の授精で妊娠するのは 3〜4割ほどです。だから 1年1産は、実際にはかなり難しく、日本の平均の分娩間隔は 400日を超えています\n\n### 分娩間隔が長いと困ること\n\n| 困ること | 理由 |\n| --- | --- |\n| 乳が減る | ピークを過ぎた、乳の少ない期間が長くなる |\n| 生まれる子牛が減る | 後継ぎの乳牛や、売る子牛が減る |\n| 病気が増える | 泌乳の後半に太りすぎ、次のお産で病気になりやすい（11章） |\n\n## 発情\n\n- **発情**（はつじょう, estrus / heat）: メスが交配を受け入れる状態\n- 約 **21日**（18〜24日）ごとに来ます（発情周期）\n- 発情が続くのは **10〜18時間ほど**と短いです。乳をたくさん出す牛ほど、短く弱くなりがちです\n- 排卵は、発情が終わってから 10〜12時間ほどあとです\n- 夜に始まることも多く、見逃しやすいです\n\n### 発情のサイン\n\n| サイン | 英語 | 説明 |\n| --- | --- | --- |\n| 乗られてもじっとしている | standing heat | いちばん確かなサイン。ほかの牛に乗られても逃げない |\n| ほかの牛に乗る | mounting | 発情の牛や、発情の近い牛が乗る |\n| よく歩く・動く | increased activity | 歩数がふだんの 2〜4倍になる。首輪や歩数計で見つける |\n| 落ち着かない・よく鳴く | restlessness | |\n| 透明な粘液 | clear mucus | 陰部から糸を引く透明な粘液が出る |\n| 陰部が腫れる・赤い | swollen vulva | |\n| 食べる量・乳の量が少し減る | | |\n| 尾の付け根の毛が乱れる | | 乗られてこすれる。尾の付け根に塗料やシールを付けて確かめる方法もある |\n\n- 来た発情のうち、見つけられた割合を**発情発見率**といいます。人の目だけでは半分ほどしか見つけられないこともあり、センサーが役立ちます（12章）\n\n## 人工授精\n\n- 日本の乳牛は、ほとんどが**人工授精**（AI, artificial insemination）で妊娠します。獣医師や家畜人工授精師が、凍らせた精液（ストロー）を子宮に入れます\n- 授精のタイミングは、発情が始まってから 12〜18時間後がよいとされます。「朝に発情を見つけたら夕方に、夕方に見つけたら次の朝に授精する」という目安があります（AM-PM ルール）\n- 精液は、乳の量・体型・病気への強さなどの能力がわかっている父牛（種雄牛）から選びます。遺伝子で能力を予測する方法（ゲノム評価）も使われています\n- **性選別精液**（sexed semen）: メスが生まれる確率を 9割ほどにした精液。後継ぎの乳牛を確実に得たいときに使います\n- ホルモン剤で排卵の時期をそろえ、決まった日に授精する方法もあります（定時人工授精。オブシンクなど）\n\n## 妊娠と分娩\n\n- 妊娠期間は約 **280日**（275〜285日）です\n- **妊娠鑑定**（pregnancy diagnosis）: 授精から 30〜40日ごろに、獣医師が直腸からの触診や超音波（エコー）で確かめます\n- 授精から 21日後ごろにまた発情が来たら、妊娠していません（再発情）\n- **分娩**（ぶんべん, calving）が近づくと、乳房が張る、尾の付け根のまわりがゆるむ、体温が 0.5 ℃ ほど下がる、落ち着かなくなる、などのサインがあります。センサーで知らせる方法もあります（12章）\n- お産のあと 12〜24時間以内に、胎盤（後産）が出ます。出ないのが胎盤停滞です（11章）\n\n## 繁殖の成績を表す数字\n\n| 数字 | 英語 | 意味 | 目標の目安 |\n| --- | --- | --- | --- |\n| 分娩間隔 | calving interval | お産からお産までの日数 | 365〜400日（短いほどよい） |\n| 空胎日数 | days open | お産から妊娠までの日数 | 85〜115日 |\n| 初回授精日数 | days to first service | お産から最初の授精までの日数 | 60〜80日 |\n| 受胎率 | conception rate | 授精したうち、妊娠した割合 | 40% 以上 |\n| 発情発見率 | heat detection rate | 来た発情のうち、見つけた割合 | 60〜70% 以上 |\n| 妊娠率 | pregnancy rate | 21日ごとに、妊娠できる牛のうち妊娠した割合（発情発見率 × 受胎率） | 20% 以上 |\n| 初産月齢 | age at first calving | 初めてのお産の月齢 | 22〜24か月 |\n\n## まとめ\n\n- 乳はお産のあとに出る。ピークはお産から 6〜8週。次のお産の 2か月ほど前に乾乳する\n- 1年1産 = 分娩間隔 365日。妊娠期間が 280日なので、お産から 85日以内に妊娠させる\n- 発情は 21日ごと、10〜18時間と短い。見逃さないことが大事で、センサーが役立つ\n- ほとんどが人工授精。発情が始まって 12〜18時間後に授精する\n", "en": "# 3. Breeding: one calf a year\n\n## What you will learn\n\n- Why a cow must calve to give milk\n- What \"one calf a year\" means, and why it matters\n- Heat (estrus) and the signs of heat\n- Insemination, pregnancy and calving\n- Numbers used to measure breeding performance\n\n## A cow must calve to give milk\n\n- After a cow gives birth, she starts giving milk (**lactation**, 泌乳)\n- Milk yield is **highest about 6–8 weeks after calving** (the peak) and then slowly falls. A graph of this is called the **lactation curve** (泌乳曲線)\n- When yield falls, farmers stop milking about two months before the next calving (**dry-off**, 乾乳). This rests the udder and prepares it for the next calving and lactation\n- So, to keep giving milk, a cow needs to **calve almost every year**\n\n## One calf a year\n\n![One calf a year: the calendar](images/one-calf-a-year.svg)\n\n- **One calf a year** (1年1産): each cow calves once a year. The goal is a **calving interval** (分娩間隔, the days from one calving to the next) of 365 days\n- Pregnancy lasts about **280 days**. 365 − 280 = 85, so the cow must **become pregnant again within 85 days after calving**\n- After calving, the uterus needs about 40 days to recover. So farmers wait 50–60 days before inseminating (the **voluntary waiting period**, VWP)\n- That leaves only days 60–85 for insemination. Heat comes every 21 days, so there are only one or two chances\n- Only about 30–40% of inseminations result in pregnancy. So \"one calf a year\" is hard in practice, and the average calving interval in Japan is over 400 days\n\n### Problems with a long calving interval\n\n| Problem | Reason |\n| --- | --- |\n| Less milk | The low-yield period after the peak gets longer |\n| Fewer calves | Fewer replacement heifers and fewer calves to sell |\n| More disease | Cows get too fat late in lactation and get sick more easily at the next calving (Chapter 11) |\n\n## Heat (estrus)\n\n- **Heat** or **estrus** (発情): the time when a female will accept mating\n- It comes about every **21 days** (18–24 days). This is the estrous cycle\n- Heat is **short: about 10–18 hours**. High-yielding cows tend to have shorter and weaker heats\n- Ovulation happens about 10–12 hours after heat ends\n- Heat often starts at night, so it is easy to miss\n\n### Signs of heat\n\n| Sign | Japanese | Description |\n| --- | --- | --- |\n| Standing heat | 乗られてもじっとしている | The surest sign. The cow stands still when other cows mount her |\n| Mounting | ほかの牛に乗る | Cows in heat, or close to heat, mount other cows |\n| Increased activity | よく歩く・動く | Steps increase to 2–4 times the normal level. Collars and pedometers detect this |\n| Restlessness, bellowing | 落ち着かない・よく鳴く | |\n| Clear mucus | 透明な粘液 | Clear, stringy mucus from the vulva |\n| Swollen, red vulva | 陰部が腫れる | |\n| Eats and milks a little less | 食べる量・乳が少し減る | |\n| Messy hair at the tail head | 尾の付け根の毛が乱れる | Rubbed by mounting cows. Some farmers put paint or stickers on the tail head to check |\n\n- The share of heats that are actually found is the **heat detection rate** (発情発見率). With eyes alone, farmers may find only about half of them, so sensors help (Chapter 12)\n\n## Artificial insemination\n\n- Almost all dairy cows in Japan become pregnant by **artificial insemination** (AI, 人工授精). A vet or AI technician puts frozen semen (in a thin tube called a straw) into the uterus\n- The best time is said to be 12–18 hours after heat starts. A common rule: \"If you see heat in the morning, inseminate in the evening. If you see it in the evening, inseminate the next morning\" (the **AM-PM rule**)\n- Semen is chosen from bulls (sires) with known genetic merit for milk yield, body type and disease resistance. Predictions from DNA (genomic evaluation) are also used\n- **Sexed semen** (性選別精液) gives about a 90% chance of a female calf. Farmers use it when they want replacement heifers\n- There is also a method that uses hormones to time ovulation, so cows can be inseminated on a fixed day (timed AI, for example Ovsynch)\n\n## Pregnancy and calving\n\n- Pregnancy (gestation) lasts about **280 days** (275–285 days)\n- **Pregnancy check** (妊娠鑑定): about 30–40 days after insemination, a vet checks by feeling through the rectum or by ultrasound\n- If heat comes again about 21 days after insemination, the cow is not pregnant\n- As **calving** (分娩) gets close, the udder fills up, the area around the tail head becomes loose, body temperature drops by about 0.5 °C, and the cow becomes restless. Sensors can also give an alert (Chapter 12)\n- The placenta (afterbirth) comes out within 12–24 hours after calving. If it does not, it is a retained placenta (Chapter 11)\n\n## Breeding numbers\n\n| Number | Japanese | Meaning | Rough target |\n| --- | --- | --- | --- |\n| Calving interval | 分娩間隔 | Days from one calving to the next | 365–400 days (shorter is better) |\n| Days open | 空胎日数 | Days from calving to pregnancy | 85–115 days |\n| Days to first service | 初回授精日数 | Days from calving to the first insemination | 60–80 days |\n| Conception rate | 受胎率 | Share of inseminations that result in pregnancy | 40% or more |\n| Heat detection rate | 発情発見率 | Share of heats that are found | 60–70% or more |\n| Pregnancy rate | 妊娠率 | Share of cows that could get pregnant in each 21 days that actually do (heat detection rate × conception rate) | 20% or more |\n| Age at first calving | 初産月齢 | Age in months at the first calving | 22–24 months |\n\n## Summary\n\n- Milk comes after calving. It peaks 6–8 weeks after calving. Cows are dried off about two months before the next calving\n- One calf a year = a 365-day calving interval. Pregnancy lasts 280 days, so the cow must get pregnant within 85 days after calving\n- Heat comes every 21 days and lasts only 10–18 hours. Finding it is important, and sensors help\n- Most cows are bred by AI, 12–18 hours after heat starts\n"}}, {"file": "04-calf.md", "part": {"ja": "第2部 繁殖と子牛", "en": "Part 2: Breeding and calves"}, "title": {"ja": "4. 子牛を育てる", "en": "4. Raising calves"}, "md": {"ja": "# 4. 子牛を育てる\n\n## この章でわかること\n\n- 生まれてすぐにすること\n- 初乳の大切さ\n- 哺乳と離乳\n- 子牛に多い病気\n- 育成牛の育て方\n\n## 生まれてすぐ\n\n- 息をしているか、鼻や口に羊水が詰まっていないかを確かめる\n- へその緒を消毒する（ヨード液にひたす）。へそから菌が入るのを防ぐ\n- 寒い時期は、体を乾かし、敷きわらや子牛用の上着で温める\n- 乳牛では、母牛からすぐに離して、子牛用の小屋（カーフハッチ）や部屋で育てることが多いです\n- 耳に、個体識別番号（10けた）の耳標を付けます（12章）\n\n## 初乳\n\n- **初乳**（しょにゅう, colostrum）: お産のあと最初に出る乳。濃くて黄色く、**抗体**（免疫グロブリン、IgG）がたくさん入っています\n- 子牛は、抗体を持たずに生まれます（牛では、胎盤を通して母牛の抗体が渡らないため）。**初乳を飲んで、はじめて病気と戦う力を得ます**\n- 腸が抗体をそのまま吸収できるのは、生まれてから 24時間ほどだけです。時間がたつほど吸収が悪くなります\n\n| ポイント | 目安 |\n| --- | --- |\n| 早く | 生まれて 2時間以内（遅くとも 6時間以内）に |\n| たくさん | 体重の 1割ほど（4 L くらい）を |\n| 質のよいものを | 糖度計（Brix 計）で 22% 以上なら、抗体が多い |\n\n- 足りないときや質が悪いときは、凍らせておいた初乳や、初乳の製剤を使います\n- 初乳が足りなかった子牛は、下痢や肺炎になりやすく、死ぬことも多くなります\n\n## 哺乳\n\n- 初乳のあとは、生乳か**代用乳**（だいようにゅう, milk replacer: 子牛用の粉ミルク）を、1日 2回などに分けて飲ませます\n- 早いうちから、**スターター**（calf starter: 子牛用の濃厚飼料）と**水**、少しの良い乾草を置きます。固形のエサを食べると、第一胃が育ちます（2章）\n- 子牛ごとにミルクの量を変えて飲ませる、哺乳ロボット（自動哺乳機）を使う牧場もあります\n\n## 離乳\n\n- **離乳**（りにゅう, weaning）: ミルクをやめて、固形のエサだけにすること\n- 生後 2〜3か月ごろが多いです。スターターを 1日 1 kg 以上、何日か続けて食べられるようになったら、ミルクを少しずつ減らしてやめます\n- 離乳の前後は、エサの変化と群れの変化が重なってストレスが大きいので、一度にいろいろ変えないようにします\n\n## 子牛の病気\n\n| 病気 | 英語 | サイン | 原因の例 |\n| --- | --- | --- | --- |\n| 下痢 | diarrhea（scours） | 水っぽい便、元気がない、脱水（目がくぼむ） | 大腸菌、ロタウイルス、コロナウイルス、クリプトスポリジウム、ミルクの与え方 |\n| 肺炎 | pneumonia | 咳、鼻水、熱、呼吸が速い | ウイルスと細菌。寒さ、すきま風、換気の悪さ、ストレス |\n| へその炎症 | navel infection | へそが腫れる・熱い・膿 | 生まれたときのへその消毒が足りない |\n\n- 下痢でこわいのは脱水です。水と塩分（電解質）を口から補い、ひどいときは獣医師が点滴をします\n- 子牛の病気の多くは、**初乳・清潔・換気・寒さ対策**で減らせます\n\n## 育成牛\n\n- 目標は、**13〜15か月**で体重 350〜400 kg（大人の 55〜60%）になったら初めて授精し、**22〜24か月**で初めてのお産をすることです（3章）\n- 1日に 0.8 kg ほど体重を増やしていきます\n- 育ちが遅いと、初めてのお産が遅れ、乳を出すまでのエサ代がかさみます。逆に太らせすぎると、乳房の発達によくないとされます\n- 育成牛を、地域の育成牧場や公共牧場に預ける（預託する）こともあります\n\n## まとめ\n\n- 生まれたら、呼吸・へその消毒・保温\n- 初乳は「早く（2時間以内）・たくさん（4 L）・質のよいものを」。子牛の免疫は初乳で決まる\n- 代用乳とスターターで育て、2〜3か月で離乳する\n- 子牛の病気は下痢と肺炎が多い。初乳・清潔・換気で防ぐ\n- 13〜15か月で初めて授精し、22〜24か月で初めてのお産\n", "en": "# 4. Raising calves\n\n## What you will learn\n\n- What to do right after birth\n- Why colostrum is so important\n- Milk feeding and weaning\n- Common calf diseases\n- Raising heifers\n\n## Right after birth\n\n- Check that the calf is breathing and that its nose and mouth are clear of fluid\n- Disinfect the navel (dip it in iodine) to stop germs getting in\n- In cold weather, dry the calf and keep it warm with straw or a calf jacket\n- On dairy farms, calves are usually separated from the mother soon and raised in a calf hutch or pen\n- An ear tag with a 10-digit individual ID number is attached (Chapter 12)\n\n## Colostrum\n\n- **Colostrum** (初乳): the first milk after calving. It is thick and yellow and full of **antibodies** (immunoglobulin, IgG)\n- Calves are born with no antibodies (in cattle, antibodies cannot pass from the mother through the placenta). **A calf gets its first protection against disease from colostrum**\n- The gut can absorb antibodies whole for only about 24 hours after birth. Absorption gets worse every hour\n\n| Key point | Guide |\n| --- | --- |\n| Quickly | Within 2 hours after birth (6 hours at the latest) |\n| Enough | About 10% of body weight (about 4 L) |\n| Good quality | 22% or more on a Brix refractometer means plenty of antibodies |\n\n- If there is not enough, or the quality is poor, use frozen colostrum or a colostrum product\n- Calves that did not get enough colostrum get diarrhea and pneumonia more often, and more of them die\n\n## Milk feeding\n\n- After colostrum, calves drink whole milk or **milk replacer** (代用乳, powdered milk for calves), for example twice a day\n- From early on, give **calf starter** (スターター, concentrate feed for calves), **water** and a little good hay. Eating solid feed makes the rumen grow (Chapter 2)\n- Some farms use an automatic calf feeder, which gives each calf its own amount of milk\n\n## Weaning\n\n- **Weaning** (離乳): stopping milk so the calf eats only solid feed\n- It is often done at 2–3 months old. When a calf eats 1 kg or more of starter a day for several days in a row, milk is reduced bit by bit and then stopped\n- Around weaning, changes in feed and group come together and cause a lot of stress, so do not change many things at once\n\n## Calf diseases\n\n| Disease | Japanese | Signs | Example causes |\n| --- | --- | --- | --- |\n| Diarrhea (scours) | 下痢 | Watery manure, weak, dehydrated (sunken eyes) | E. coli, rotavirus, coronavirus, Cryptosporidium, feeding mistakes |\n| Pneumonia | 肺炎 | Cough, runny nose, fever, fast breathing | Viruses and bacteria, plus cold, drafts, poor ventilation and stress |\n| Navel infection | へその炎症 | Swollen, hot navel, pus | The navel was not disinfected well at birth |\n\n- The danger of diarrhea is dehydration. Give water and salts (electrolytes) by mouth. In bad cases a vet gives a drip\n- Most calf diseases can be reduced with **colostrum, cleanliness, good ventilation and protection from cold**\n\n## Heifers\n\n- The goal: first insemination at **13–15 months** when the heifer weighs 350–400 kg (55–60% of adult weight), and first calving at **22–24 months** (Chapter 3)\n- Heifers should gain about 0.8 kg a day\n- Slow growth delays the first calving, and feed costs pile up before she gives any milk. On the other hand, making young heifers too fat is said to be bad for udder development\n- Some farms send heifers to a local rearing farm or public pasture\n\n## Summary\n\n- After birth: check breathing, disinfect the navel, keep the calf warm\n- Colostrum: \"quickly (within 2 hours), enough (4 L), good quality\". A calf's immunity depends on colostrum\n- Raise calves on milk replacer and starter, and wean at 2–3 months\n- Diarrhea and pneumonia are common. Prevent them with colostrum, cleanliness and ventilation\n- First insemination at 13–15 months, first calving at 22–24 months\n"}}, {"file": "05-feed.md", "part": {"ja": "第3部 エサ", "en": "Part 3: Feed"}, "title": {"ja": "5. エサの基本（粗飼料・濃厚飼料・配合飼料）", "en": "5. Feed basics: roughage, concentrate, compound feed"}, "md": {"ja": "# 5. エサの基本（粗飼料・濃厚飼料・配合飼料）\n\n## この章でわかること\n\n- 粗飼料と濃厚飼料のちがい\n- 濃厚飼料の種類\n- 配合飼料とは\n- TMR と分離給与\n- 乾物・栄養の言葉\n\n## エサの分け方\n\n![エサの種類](images/feed-types.svg)\n\n| 種類 | 英語 | 特徴 | 例 |\n| --- | --- | --- | --- |\n| **粗飼料**（そしりょう） | roughage / forage | 繊維が多く、かさばる。反芻と唾液を増やし、第一胃を健康に保つ | 牧草（生草・乾草・サイレージ）、コーンサイレージ、稲わら |\n| **濃厚飼料**（のうこうしりょう） | concentrate | 繊維が少なく、エネルギーやたんぱく質が多い。少しの量で栄養がとれる | トウモロコシ・大麦などの穀類、大豆かす、ふすま、配合飼料 |\n\n- 牛は本来、草を食べる動物です。でも、たくさん乳を出すにはエネルギーが足りないので、濃厚飼料を足します\n- **濃厚飼料が多すぎる**と、ルーメンアシドーシスや蹄の病気になります（2章・11章）。**粗飼料が多すぎる**と、エネルギーが足りず乳が減ります\n- この**バランス**が、エサ作りのいちばんの基本です\n\n## 濃厚飼料\n\n| 分類 | 英語 | 例 | 主な栄養 |\n| --- | --- | --- | --- |\n| 穀類 | grains | トウモロコシ、大麦、小麦、マイロ（ソルガム） | デンプン（エネルギー） |\n| 油かす | oilseed meals | 大豆かす（大豆粕）、なたね粕、綿実 | たんぱく質 |\n| ぬか・ふすま | bran | 米ぬか、ふすま（小麦の皮） | 繊維・たんぱく質・リン |\n| 食品工場のかす | by-products | ビートパルプ、ビール粕、豆腐粕（おから）、大豆皮 | 消化のよい繊維など |\n| ビタミン・ミネラル | vitamins, minerals | 炭酸カルシウム、塩、ビタミン剤 | 骨・乳・体の調子 |\n\n- 穀類はそのままでは消化しにくいので、蒸してつぶしたり（圧ぺん・フレーク）、砕いたりして与えます\n\n## 配合飼料\n\n- **配合飼料**（はいごうしりょう, compound feed）: いくつもの原料を、牛の栄養に合わせて、工場で混ぜたエサです。粒（ペレット）・粉（マッシュ）・フレークなどの形があります\n- 中身の例: トウモロコシ、大豆かす、ふすま、なたね粕、炭酸カルシウム、塩、ビタミン、ミネラル\n- 袋や伝票には「TDN ○%、CP ○%」のように、エネルギーとたんぱく質の量が書かれています\n- 搾乳牛用・乾乳牛用・育成牛用・子牛用（スターター）など、目的ごとにあります\n- 原料が1種類だけのものは**単味飼料**（たんみしりょう）といいます\n\n### 配合飼料と輸入\n\n- 日本の配合飼料の原料は、ほとんどが輸入です（トウモロコシはアメリカ・ブラジルなど）\n- そのため、世界の穀物の値段・為替・船の運賃で、エサ代が大きく変わります（ニュースによく出ます）\n- 日本のエサ全体の自給率は 4分の1ほどで、濃厚飼料は 1割ちょっとしかありません\n- エサ代は、牧場の費用の半分近くを占める、いちばん大きな費用です\n\n## 粗飼料\n\n- 牧草・トウモロコシ・稲などを、生のまま・乾かして（乾草, 6章）・発酵させて（サイレージ, 7章）与えます\n- 自分の畑で作るもの（自給飼料）と、輸入した乾草があります\n- **粗飼料の質がよいほど、濃厚飼料を減らせます。** エサ代が下がり、牛も健康になります\n\n## TMR と分離給与\n\n| 与え方 | 英語 | 説明 | 長所と注意 |\n| --- | --- | --- | --- |\n| 分離給与 | component feeding | 粗飼料と濃厚飼料を別々に与える。つなぎ飼いの牛舎に多い | 牛ごとに量を変えやすい。濃厚飼料を一度にたくさん食べるとアシドーシスになりやすいので、1日 3〜6回に分ける |\n| TMR | total mixed ration | 粗飼料・濃厚飼料・ミネラルを全部混ぜて与える。フリーストールの牛舎に多い | どこを食べても同じ栄養になり、第一胃が安定する。牛のグループごとに配合を変える |\n\n- 地域で TMR を作って牧場に配る工場を、**TMR センター**といいます\n- 牛は届く所のエサしか食べないので、押し寄せたエサを近くに戻します（**エサ寄せ**。ロボットもあります）\n- 牛は好きなもの（濃厚飼料）を選んで食べる（**選び食い**, sorting）ことがあります。切る長さや水分で防ぎます\n\n## 乾物と栄養の言葉\n\n| 言葉 | 英語 | 意味 |\n| --- | --- | --- |\n| 乾物（DM） | dry matter | 水分を除いた部分。エサの量や栄養は、乾物で比べる |\n| 乾物摂取量（DMI） | dry matter intake | 1日に食べた乾物の量。体重の 3〜4%（650 kg の牛で 20〜26 kg） |\n| TDN | total digestible nutrients | 消化できる栄養の合計。エネルギーの目安 |\n| CP（粗たんぱく質） | crude protein | たんぱく質の量 |\n| NDF | neutral detergent fiber | 繊維の量。多いとかさばって食べる量が減り、少なすぎるとアシドーシスになる |\n| 粗濃比 | forage-to-concentrate ratio | 粗飼料と濃厚飼料の割合（乾物で）。乳の多い牛で 50:50 前後。濃厚飼料が 6割を超えないようにする |\n\n水分の目安は、乾草 10〜15%、サイレージ 60〜70%、配合飼料 12〜13% です。たとえば水分 65% のサイレージ 10 kg は、乾物では 3.5 kg です。\n\n## まとめ\n\n- エサは、繊維の多い**粗飼料**と、栄養の濃い**濃厚飼料**に分けられる。バランスがいちばん大事\n- **配合飼料**は、穀類・油かす・ミネラルなどを工場で混ぜた濃厚飼料。原料はほとんど輸入\n- 与え方は、別々に与える**分離給与**と、全部混ぜる **TMR**\n- エサの量と栄養は、水分を除いた**乾物**で比べる\n", "en": "# 5. Feed basics: roughage, concentrate, compound feed\n\n## What you will learn\n\n- The difference between roughage and concentrate\n- Types of concentrate\n- What compound feed is\n- TMR and component feeding\n- Words about dry matter and nutrients\n\n## Types of feed\n\n![Types of feed](images/feed-types.svg)\n\n| Type | Japanese | Features | Examples |\n| --- | --- | --- | --- |\n| **Roughage / forage** | 粗飼料（そしりょう） | High in fiber and bulky. Increases rumination and saliva and keeps the rumen healthy | Grass (fresh, hay, silage), corn silage, rice straw |\n| **Concentrate** | 濃厚飼料（のうこうしりょう） | Low in fiber, high in energy or protein. Gives a lot of nutrition in a small amount | Grains such as corn and barley, soybean meal, wheat bran, compound feed |\n\n- Cows are grass-eating animals by nature. But to give a lot of milk they need more energy than grass alone can give, so farmers add concentrate\n- **Too much concentrate** causes rumen acidosis and hoof problems (Chapters 2 and 11). **Too much roughage** means not enough energy and less milk\n- Getting this **balance** right is the most basic rule of feeding\n\n## Concentrate\n\n| Group | Japanese | Examples | Main nutrient |\n| --- | --- | --- | --- |\n| Grains | 穀類 | Corn (maize), barley, wheat, milo (sorghum) | Starch (energy) |\n| Oilseed meals | 油かす | Soybean meal, rapeseed meal, whole cottonseed | Protein |\n| Bran | ぬか・ふすま | Rice bran, wheat bran | Fiber, protein, phosphorus |\n| By-products | 食品工場のかす | Beet pulp, brewers' grains, tofu residue (okara), soy hulls | Easily digested fiber and more |\n| Vitamins and minerals | ビタミン・ミネラル | Calcium carbonate, salt, vitamin mixes | Bones, milk, body functions |\n\n- Whole grains are hard to digest, so they are steamed and pressed (flaked) or ground before feeding\n\n## Compound feed\n\n- **Compound feed** (配合飼料, also called formulated feed): feed made in a factory by mixing many ingredients to match a cow's needs. It comes as pellets, mash (powder) or flakes\n- Example ingredients: corn, soybean meal, wheat bran, rapeseed meal, calcium carbonate, salt, vitamins, minerals\n- The bag or delivery slip shows numbers like \"TDN ○%, CP ○%\" — the energy and protein content\n- There are types for milking cows, dry cows, heifers and calves (starter)\n- A feed made of only one ingredient is called a **single feed ingredient** (単味飼料)\n\n### Compound feed and imports\n\n- Almost all ingredients for compound feed in Japan are imported (corn comes from the USA, Brazil and other countries)\n- So world grain prices, exchange rates and shipping costs change feed prices a lot (this is often in the news)\n- Japan grows only about a quarter of all its livestock feed, and only a little over 10% of its concentrate\n- Feed is the biggest cost on a dairy farm, close to half of all costs\n\n## Roughage\n\n- Grass, corn and rice are fed fresh, dried (hay, Chapter 6) or fermented (silage, Chapter 7)\n- Some roughage is grown on the farm (home-grown feed), and some is imported hay\n- **The better the roughage, the less concentrate you need.** Feed costs go down and cows stay healthier\n\n## TMR and component feeding\n\n| Method | Japanese | Description | Strengths and cautions |\n| --- | --- | --- | --- |\n| Component feeding | 分離給与 | Roughage and concentrate are fed separately. Common in tie-stall barns | Easy to change the amount for each cow. A big meal of concentrate can cause acidosis, so it is split into 3–6 meals a day |\n| TMR (total mixed ration) | TMR | Roughage, concentrate and minerals are all mixed together. Common in free-stall barns | Every bite has the same nutrients, so the rumen stays stable. The mix is changed for each group of cows |\n\n- A factory that makes TMR for several farms in an area is called a **TMR center**\n- Cows only eat feed they can reach, so the feed they push away is pushed back (**feed pushing**; there are robots for this)\n- Cows sometimes pick out the parts they like (concentrate). This is called **sorting** (選び食い). Chop length and moisture help prevent it\n\n## Dry matter and nutrient words\n\n| Word | Japanese | Meaning |\n| --- | --- | --- |\n| Dry matter (DM) | 乾物 | What is left without water. Feed amounts and nutrients are compared on a dry matter basis |\n| Dry matter intake (DMI) | 乾物摂取量 | Dry matter eaten in a day. 3–4% of body weight (20–26 kg for a 650 kg cow) |\n| TDN (total digestible nutrients) | TDN | The total of digestible nutrients. A measure of energy |\n| Crude protein (CP) | 粗たんぱく質 | The amount of protein |\n| NDF (neutral detergent fiber) | NDF | The amount of fiber. Too much makes feed bulky so cows eat less. Too little causes acidosis |\n| Forage-to-concentrate ratio | 粗濃比 | The share of roughage and concentrate (on a dry matter basis). About 50:50 for high-yielding cows. Concentrate should not go above about 60% |\n\nTypical moisture: hay 10–15%, silage 60–70%, compound feed 12–13%. For example, 10 kg of silage with 65% moisture is 3.5 kg of dry matter.\n\n## Summary\n\n- Feed is either fiber-rich **roughage** or nutrient-dense **concentrate**. Balance is the most important thing\n- **Compound feed** is concentrate made by mixing grains, oilseed meals, minerals and more in a factory. Most ingredients are imported\n- Feeding methods: **component feeding** (separately) and **TMR** (all mixed)\n- Feed amounts and nutrients are compared as **dry matter** (without water)\n"}}, {"file": "06-hay.md", "part": {"ja": "第3部 エサ", "en": "Part 3: Feed"}, "title": {"ja": "6. 乾草と牧草（チモシー・アルファルファ）", "en": "6. Hay and grasses: timothy and alfalfa"}, "md": {"ja": "# 6. 乾草と牧草（チモシー・アルファルファ）\n\n## この章でわかること\n\n- 牧草の2つのグループ（イネ科とマメ科）\n- チモシーとアルファルファの特徴とちがい\n- そのほかの粗飼料\n- 乾草の作り方と、刈る時期\n- よい乾草の見分け方\n\n## 牧草の2つのグループ\n\n| グループ | 英語 | 特徴 | 例 |\n| --- | --- | --- | --- |\n| イネ科 | grasses | 繊維が多く、たんぱく質は少なめ。カルシウムも少なめ | チモシー、オーチャードグラス、イタリアンライグラス |\n| マメ科 | legumes | たんぱく質とカルシウムが多い。根に根粒菌がすみ、空気中の窒素を使えるので、肥料が少なくてすむ | アルファルファ、クローバー |\n\n## チモシー\n\n- **チモシー**（timothy）: イネ科の牧草。和名はオオアワガエリ\n- 何年も育つ多年草で、寒さに強く、北海道でたくさん作られています。アメリカやカナダからも輸入しています\n- 穂は細長い円柱の形です\n- 繊維が多めで、たんぱく質は少なめ（粗たんぱく質 8〜12% ほど）。カルシウムが少ないです\n- 牛がよく食べます（嗜好性がよい）。反芻を増やすのに向いています\n- 向いている牛: **乾乳牛・育成牛・子牛**。乾乳牛では、カルシウムが少ないことがお産のあとの乳熱を防ぐのに役立ちます（11章）\n- ただし、ふん尿を肥料にたくさん入れた畑の草は、カリウムが多くなることがあり、乾乳牛では注意します\n- ウサギや馬のエサとしても有名です\n\n## アルファルファ\n\n- **アルファルファ**（alfalfa）: マメ科の牧草。イギリスなどでは lucerne（ルーサン）とも呼びます。和名はムラサキウマゴヤシ\n- 紫の花が咲く多年草で、根が地中深く（数 m）まで伸びます。栄養が多いので「牧草の女王」と呼ばれます\n- **たんぱく質**（粗たんぱく質 17〜22%）と**カルシウム**（1.2〜1.5%）が多く、消化がよいです\n- 向いている牛: **乳をたくさん出している牛**。濃厚飼料のたんぱく質を減らせます\n- 日本では、主にアメリカから輸入しています。乾草のほか、固めた角形の**ヘイキューブ**や、ペレットもあります\n\n### アルファルファで気をつけること\n\n- **乾乳牛に多く与えない**: カルシウムとカリウムが多すぎると、お産のときに骨からカルシウムを出す体の仕組みが働きにくくなり、乳熱（低カルシウム血症）が起きやすくなります（11章）\n- **生の草をたくさん食べると鼓脹症**: 第一胃のガスが泡になって出せなくなり、お腹がふくれます（11章）\n- **葉に栄養が多い**: 乾かすときに葉が落ちやすいので、ていねいに扱います。葉の多いものほど上等です\n\n## チモシーとアルファルファの比較\n\n| | チモシー | アルファルファ |\n| --- | --- | --- |\n| 英語 | timothy | alfalfa（lucerne） |\n| グループ | イネ科 | マメ科 |\n| たんぱく質 | 少なめ（8〜12%） | 多い（17〜22%） |\n| カルシウム | 少ない（0.3〜0.5%） | 多い（1.2〜1.5%） |\n| 繊維 | 多い | 少なめで、消化がよい |\n| 向いている牛 | 乾乳牛・育成牛・子牛 | 乳を出している牛 |\n| 注意 | 遅く刈ると固くなり、栄養が下がる | 乾乳牛の乳熱、生草の鼓脹症 |\n\n## そのほかの粗飼料\n\n| 名前 | 英語 | 特徴 |\n| --- | --- | --- |\n| オーチャードグラス | orchardgrass | イネ科。チモシーより暑さに強い。本州の牧草地に多い |\n| イタリアンライグラス | Italian ryegrass | イネ科。育つのが速い。秋にまいて春に刈ることが多い |\n| スーダングラス | sudangrass | イネ科。夏に育つ |\n| クローバー | clover | マメ科。イネ科の牧草と一緒にまくことが多い |\n| 稲わら | rice straw | 栄養は少ないが、繊維を足すのに使う。乾乳牛や育成牛に |\n| トウモロコシ | corn（maize） | 実ごと刈ってサイレージにすることが多い（7章） |\n\n## 乾草の作り方\n\n1. **刈る**（モア）\n2. **広げて干し、ひっくり返す**（テッダー）。晴れの日が 3〜4日ほど必要\n3. **集めて列にする**（レーキ）\n4. **固める**（ベーラー）。四角いベールや、丸いロールベールにする\n\n- 水分を **15% 以下**まで下げます。湿ったまま積むと、カビたり、熱を持って燃え出したりすることもあります\n- 雨に当たると、栄養が流れ、カビやすくなります。雨の多い日本では乾草作りが難しいので、少し乾かしてサイレージにすること（ラップサイレージ, 7章）も多いです\n\n## 刈る時期と栄養\n\n| 刈る時期 | 栄養 | 量 |\n| --- | --- | --- |\n| 早い（若い草） | 葉が多く、たんぱく質が多く、消化がよい | 少ない |\n| 遅い（穂や花が出たあと） | 茎が固く、繊維が多く、消化が悪い | 多い |\n\n- イネ科は穂が出るころ（出穂期）、アルファルファは花が咲き始めるころが、量と質のバランスがよいとされます\n- 1年に何回か刈ります。1回目を 1番草、2回目を 2番草と呼びます\n\n## よい乾草の見分け方\n\n| 見るところ | よい | よくない |\n| --- | --- | --- |\n| 色 | 緑色 | 茶色・黒っぽい（雨や日光に当たりすぎ） |\n| におい | 草の甘いにおい | カビ臭い・ほこりっぽい |\n| 葉 | 葉が多い | 茎ばかり・葉が落ちている |\n| 手ざわり | やわらかい | 固い・チクチクする |\n| カビ | ない | 白や黒の粉。カビ毒（マイコトキシン）は牛にも人にも悪い |\n\n見た目だけでなく、成分を分析（飼料分析）して、エサの設計に使います。\n\n## まとめ\n\n- 牧草には、繊維の多い**イネ科**（チモシーなど）と、たんぱく質とカルシウムの多い**マメ科**（アルファルファなど）がある\n- **チモシー**は乾乳牛・育成牛・子牛向き。**アルファルファ**は乳を出している牛向き\n- アルファルファは、乾乳牛の乳熱と、生草の鼓脹症に注意\n- 乾草は水分 15% 以下まで乾かす。早く刈るほど栄養が高い\n", "en": "# 6. Hay and grasses: timothy and alfalfa\n\n## What you will learn\n\n- The two groups of forage plants (grasses and legumes)\n- The features of timothy and alfalfa, and how they differ\n- Other roughages\n- How hay is made, and when to cut\n- How to tell good hay\n\n## Two groups of forage plants\n\n| Group | Japanese | Features | Examples |\n| --- | --- | --- | --- |\n| Grasses | イネ科 | High in fiber, lower in protein and calcium | Timothy, orchardgrass, Italian ryegrass |\n| Legumes | マメ科 | High in protein and calcium. Bacteria in root nodules take nitrogen from the air, so they need less fertilizer | Alfalfa, clover |\n\n## Timothy\n\n- **Timothy** (チモシー): a grass. Its Japanese name is オオアワガエリ\n- It is a perennial (it grows for several years) and handles cold well. A lot is grown in Hokkaido, and some is imported from the USA and Canada\n- Its seed head is long and shaped like a thin cylinder\n- It is fairly high in fiber and low in protein (crude protein about 8–12%). It is low in calcium\n- Cows like to eat it (good palatability). It is good for increasing rumination\n- Good for: **dry cows, heifers and calves**. For dry cows, its low calcium helps prevent milk fever after calving (Chapter 11)\n- But grass from fields that got a lot of manure as fertilizer can be high in potassium, so be careful with dry cows\n- It is also well known as food for rabbits and horses\n\n## Alfalfa\n\n- **Alfalfa** (アルファルファ): a legume. In the UK and some other countries it is called **lucerne**. Its Japanese name is ムラサキウマゴヤシ\n- It is a perennial with purple flowers, and its roots go deep (several meters). It is so nutritious that it is called the \"Queen of Forages\"\n- It is high in **protein** (crude protein 17–22%) and **calcium** (1.2–1.5%), and it is easy to digest\n- Good for: **high-yielding milking cows**. It lets farmers use less protein from concentrate\n- Japan imports it mainly from the USA, as hay, as pressed square **hay cubes** (ヘイキューブ), or as pellets\n\n### Cautions with alfalfa\n\n- **Do not feed a lot to dry cows**: too much calcium and potassium makes it harder for the body to release calcium from the bones at calving, so milk fever (low blood calcium) becomes more likely (Chapter 11)\n- **Lots of fresh alfalfa can cause bloat**: gas in the rumen turns into foam that the cow cannot burp out, and the belly swells (Chapter 11)\n- **Most nutrients are in the leaves**: leaves fall off easily when drying, so handle it gently. Leafy alfalfa is the best quality\n\n## Timothy and alfalfa compared\n\n| | Timothy | Alfalfa |\n| --- | --- | --- |\n| Japanese | チモシー | アルファルファ |\n| Group | Grass | Legume |\n| Protein | Lower (8–12%) | High (17–22%) |\n| Calcium | Low (0.3–0.5%) | High (1.2–1.5%) |\n| Fiber | High | Lower, easy to digest |\n| Good for | Dry cows, heifers, calves | Milking cows |\n| Cautions | Cut late, it gets tough and loses nutrients | Milk fever in dry cows, bloat from fresh plants |\n\n## Other roughages\n\n| Name | Japanese | Features |\n| --- | --- | --- |\n| Orchardgrass | オーチャードグラス | Grass. Handles heat better than timothy. Common on Honshu |\n| Italian ryegrass | イタリアンライグラス | Grass. Grows fast. Often sown in autumn and cut in spring |\n| Sudangrass | スーダングラス | Grass. Grows in summer |\n| Clover | クローバー | Legume. Often sown together with grasses |\n| Rice straw | 稲わら | Low in nutrients, but adds fiber. For dry cows and heifers |\n| Corn (maize) | トウモロコシ | Usually cut whole and made into silage (Chapter 7) |\n\n## How hay is made\n\n1. **Mow** the grass (with a mower)\n2. **Spread it out to dry and turn it** (with a tedder). This needs about 3–4 sunny days\n3. **Rake it into rows** (with a rake)\n4. **Bale it** (with a baler) into square bales or round bales\n\n- Hay must be dried to **15% moisture or less**. If it is stacked wet, it can go moldy, heat up and even catch fire\n- Rain washes out nutrients and makes mold more likely. Japan has a lot of rain, so making hay is hard. Farmers often dry grass only a little and make silage instead (wrapped bale silage, Chapter 7)\n\n## When to cut\n\n| Cutting time | Nutrients | Amount |\n| --- | --- | --- |\n| Early (young grass) | Leafy, high in protein, easy to digest | Small |\n| Late (after seed heads or flowers appear) | Tough stems, high in fiber, hard to digest | Large |\n\n- Grasses are best cut when the seed heads come out (heading stage), and alfalfa when it starts to flower. This gives a good balance of amount and quality\n- Fields are cut several times a year. The first cut is called 1番草 (first cutting), the second 2番草 (second cutting)\n\n## How to tell good hay\n\n| Check | Good | Bad |\n| --- | --- | --- |\n| Color | Green | Brown or blackish (too much rain or sun) |\n| Smell | Sweet smell of grass | Moldy or dusty |\n| Leaves | Many leaves | Mostly stems, leaves have fallen off |\n| Feel | Soft | Hard, prickly |\n| Mold | None | White or black powder. Mold toxins (mycotoxins) are bad for cows and people |\n\nBesides looking at it, farmers send samples for analysis (feed analysis) and use the results to design the diet.\n\n## Summary\n\n- Forage plants are **grasses** (high fiber, such as timothy) or **legumes** (high protein and calcium, such as alfalfa)\n- **Timothy** suits dry cows, heifers and calves. **Alfalfa** suits milking cows\n- With alfalfa, watch out for milk fever in dry cows and bloat from fresh plants\n- Hay is dried to 15% moisture or less. The earlier it is cut, the higher the nutrients\n"}}, {"file": "07-silage.md", "part": {"ja": "第3部 エサ", "en": "Part 3: Feed"}, "title": {"ja": "7. サイレージ", "en": "7. Silage"}, "md": {"ja": "# 7. サイレージ\n\n## この章でわかること\n\n- サイレージとは\n- 発酵のしくみ\n- サイレージとサイロの種類\n- 作り方\n- 失敗と、よいサイレージの見分け方\n\n## サイレージとは\n\n- **サイレージ**（silage）: 刈った草やトウモロコシを、空気を抜いて密封し、**乳酸菌で発酵**させて保存したエサです。「草の漬物」と考えるとわかりやすいです\n- 乾草とちがって晴れの日が何日も要らないので、雨の多い日本でも作りやすく、栄養を長く保てます\n- 1年分をまとめて作り、毎日少しずつ取り出して与えます\n- サイレージを作る入れ物や場所を**サイロ**（silo）といいます\n\n## 発酵のしくみ\n\n![サイレージの作り方と発酵](images/silage.svg)\n\n1. 詰めて密封した直後は、草がまだ呼吸していて、残った酸素を使い切ります（数時間〜1日）\n2. 酸素がなくなると、**乳酸菌**が増え、草の糖分から乳酸を作ります\n3. 乳酸で pH が **4 前後**まで下がると、腐らせる菌が増えられなくなり、安定します（3〜6週間）\n4. 空気が入らない限り、何か月も保存できます\n\nうまく作るポイントは、次の3つです。\n\n- **空気を抜く**: 細かく切る、よく踏み固める、すぐに密封する\n- **糖分が十分にある**: 乳酸菌のエサ。マメ科の草は糖分が少なく、難しい\n- **水分がちょうどよい**: 多すぎても少なすぎても失敗する\n\n発酵を助けるために、乳酸菌の添加剤を使うこともあります。\n\n## サイレージの種類\n\n| 種類 | 英語 | 説明 |\n| --- | --- | --- |\n| コーンサイレージ | corn silage（whole-crop） | トウモロコシの実・茎・葉を丸ごと細かく切って作る。実のデンプンが多く、エネルギーが高い。実が黄色く固まりかけたころ（黄熟期）に刈る |\n| グラスサイレージ | grass silage | 牧草で作る。少し乾かして（予乾）水分を下げてから詰める |\n| ラップサイレージ | wrapped bale silage（baleage） | 牧草を丸く固め、フィルムで何重にも巻いて作る。畑に並ぶ白や黒の大きな丸いもの |\n| 稲WCS（稲発酵粗飼料） | whole-crop rice silage | 稲を実ごと刈って作る。田んぼを使って作れる |\n| ヘイレージ | haylage | 水分を低め（40〜50%）にした牧草のサイレージ |\n\n## サイロの種類\n\n| サイロ | 英語 | 説明 |\n| --- | --- | --- |\n| バンカーサイロ | bunker silo | 3方をコンクリートの壁で囲んだ場所に詰め、重機で踏み固め、シートで覆う。大きな牧場に多い |\n| スタックサイロ | drive-over pile | 壁を作らず地面に積み上げ、シートで覆う |\n| タワーサイロ | tower silo | 昔ながらの塔の形。牧場の絵によく描かれる |\n| バッグサイロ | silo bag | 長い袋に詰める |\n| ロールベール | wrapped bale | 1つずつフィルムで巻く（ラップサイレージ） |\n\n## 作り方（コーンサイレージの例）\n\n1. 黄熟期のトウモロコシを、ハーベスター（収穫機）で刈りながら 1〜2 cm に細かく切る\n2. すぐにサイロに運び、薄く広げては重機で何度も踏み固める（空気を抜く）\n3. その日のうちにシートで覆い、タイヤなどの重しを乗せて密封する\n4. 少なくとも 3週間、できれば 1か月以上置いて発酵させてから使い始める\n\n水分の目安は、コーンサイレージで 65〜70%、グラスサイレージで 60〜70% です。\n\n## 失敗したサイレージ\n\n| 失敗 | 原因 | どうなるか |\n| --- | --- | --- |\n| 酪酸発酵 | 水分が多すぎる、糖が少ない、土が混じる | 酪酸菌が増え、腐ったようなひどいにおいになる。牛が食べず、ケトーシスの原因にもなる |\n| カビ | 空気が入る（踏み固めが足りない・シートの穴） | 栄養が減る。カビ毒（マイコトキシン）で牛の健康を損なう |\n| 二次発酵 | 開けたあと、空気にふれて酵母やカビが増える | 熱を持ち、においが変わり、牛が食べなくなる |\n\n- **二次発酵**（好気的変敗）を防ぐには、開けた面（切り口）を小さく平らにし、毎日ある程度の厚さ（目安 15〜30 cm。暑い時期ほど多く）を取り出します\n- シートの穴は、見つけたらすぐにふさぎます（カラスやネズミが開けることもあります）\n\n## よいサイレージの見分け方\n\n| 見るところ | よい | よくない |\n| --- | --- | --- |\n| におい | 甘酸っぱい（ヨーグルトや漬物のよう） | ツンとする酢のにおい、腐ったにおい（酪酸）、カビ臭い |\n| 色 | 黄緑〜黄色っぽい茶色 | 黒っぽい、白や青のカビ |\n| 手ざわり | しっとり | ベタベタ（水分が多すぎ）、熱い（二次発酵） |\n| pH | 4.2 以下（コーンは 3.8〜4.0） | 高い |\n\n## まとめ\n\n- サイレージは、空気を抜いて乳酸菌で発酵させた「草の漬物」。pH 4 前後で安定する\n- コーンサイレージはエネルギーが高い。ラップサイレージは畑に並ぶ白い丸いもの\n- 空気を抜く・糖分・水分がポイント。失敗すると酪酸発酵やカビ\n- 開けたあとの二次発酵を防ぐため、毎日切り口から取り出す\n", "en": "# 7. Silage\n\n## What you will learn\n\n- What silage is\n- How fermentation works\n- Types of silage and silos\n- How to make it\n- Problems, and how to tell good silage\n\n## What is silage?\n\n- **Silage** (サイレージ): cut grass or corn that is sealed with the air pressed out and **fermented by lactic acid bacteria** so it keeps. It is easy to think of it as \"pickled grass\"\n- Unlike hay, it does not need many sunny days, so it is easier to make in rainy Japan, and it keeps nutrients for a long time\n- Farmers make a whole year's supply at once and take out a little each day\n- The container or place where silage is made is called a **silo** (サイロ)\n\n## How fermentation works\n\n![How silage is made and fermented](images/silage.svg)\n\n1. Right after packing and sealing, the plants are still breathing and use up the oxygen left inside (a few hours to a day)\n2. When the oxygen is gone, **lactic acid bacteria** (乳酸菌) grow and turn the plant sugars into lactic acid\n3. When the lactic acid brings the pH down to **about 4**, spoilage bacteria can no longer grow, and the silage becomes stable (3–6 weeks)\n4. As long as no air gets in, it keeps for many months\n\nThere are three keys to good silage:\n\n- **Keep air out**: chop finely, pack it down hard, and seal it quickly\n- **Enough sugar**: sugar feeds the lactic acid bacteria. Legumes have little sugar, so they are harder\n- **The right moisture**: too wet or too dry both cause problems\n\nFarmers sometimes add lactic acid bacteria (an inoculant) to help fermentation.\n\n## Types of silage\n\n| Type | Japanese | Description |\n| --- | --- | --- |\n| Corn silage (whole-crop) | コーンサイレージ | The whole corn plant — grain, stalk and leaves — is chopped. High in starch from the grain, so high in energy. Harvested when the kernels are turning hard and yellow |\n| Grass silage | グラスサイレージ | Made from grass. The grass is dried a little (wilted) to lower the moisture before packing |\n| Wrapped bale silage (baleage) | ラップサイレージ | Grass is rolled into a round bale and wrapped in many layers of film. The big white or black rolls you see in fields |\n| Whole-crop rice silage | 稲WCS（稲発酵粗飼料） | Rice is cut with the grain and made into silage. Rice paddies can be used to grow it |\n| Haylage | ヘイレージ | Grass silage with lower moisture (40–50%) |\n\n## Types of silos\n\n| Silo | Japanese | Description |\n| --- | --- | --- |\n| Bunker silo | バンカーサイロ | Concrete walls on three sides. Filled, packed down by heavy machines, and covered with plastic sheets. Common on large farms |\n| Drive-over pile | スタックサイロ | Piled on the ground with no walls and covered with sheets |\n| Tower silo | タワーサイロ | The traditional tower. Often seen in pictures of farms |\n| Silo bag | バッグサイロ | Packed into a long plastic bag |\n| Wrapped bale | ロールベール | Each bale is wrapped in film (wrapped bale silage) |\n\n## How to make it (corn silage example)\n\n1. When the corn kernels are turning hard and yellow, a forage harvester cuts the plants and chops them into 1–2 cm pieces\n2. The corn is taken to the silo right away, spread in thin layers, and packed down again and again by heavy machines (to push out air)\n3. On the same day, it is covered with plastic sheets and weighed down with tires or similar to seal it\n4. It is left to ferment for at least 3 weeks, and better for a month or more, before feeding starts\n\nTypical moisture is 65–70% for corn silage and 60–70% for grass silage.\n\n## Bad silage\n\n| Problem | Cause | What happens |\n| --- | --- | --- |\n| Butyric fermentation | Too wet, too little sugar, soil mixed in | Butyric acid bacteria grow and it smells terrible, like rotting. Cows do not eat it, and it can cause ketosis |\n| Mold | Air gets in (not packed enough, holes in the sheet) | Nutrients are lost. Mold toxins (mycotoxins) harm the cows |\n| Aerobic spoilage (secondary fermentation) | After opening, air lets yeasts and molds grow | It heats up, the smell changes, and cows stop eating it |\n\n- To prevent **aerobic spoilage** (二次発酵), keep the open face small and flat, and take out a good thickness every day (about 15–30 cm as a guide, more in hot weather)\n- Fix holes in the sheet as soon as you find them (crows and rats sometimes make them)\n\n## How to tell good silage\n\n| Check | Good | Bad |\n| --- | --- | --- |\n| Smell | Sweet and sour, like yogurt or pickles | Sharp vinegar smell, rotten smell (butyric acid), moldy |\n| Color | Yellow-green to yellowish brown | Blackish, white or blue mold |\n| Feel | Moist | Sticky (too wet), hot (aerobic spoilage) |\n| pH | 4.2 or lower (corn: 3.8–4.0) | High |\n\n## Summary\n\n- Silage is \"pickled grass\": sealed without air and fermented by lactic acid bacteria. It becomes stable at about pH 4\n- Corn silage is high in energy. Wrapped bale silage is the big white rolls in fields\n- The keys are keeping air out, enough sugar and the right moisture. Mistakes cause butyric fermentation or mold\n- After opening, take silage from the face every day to prevent aerobic spoilage\n"}}, {"file": "08-milk.md", "part": {"ja": "第4部 乳と病気", "en": "Part 4: Milk and health"}, "title": {"ja": "8. 乳ができるしくみと搾乳", "en": "8. How milk is made, and milking"}, "md": {"ja": "# 8. 乳ができるしくみと搾乳\n\n## この章でわかること\n\n- 乳房のつくり\n- 乳ができるしくみと、乳が出るしくみ\n- 搾乳の手順\n- 乳の成分と検査\n- 出荷できない乳\n\n## 乳房のつくり\n\n- 乳房（にゅうぼう, udder）は、**4つの分房**（ぶんぼう, quarter）に分かれています: 左前・右前・左後・右後\n- 4つの分房はそれぞれ独立していて、乳は混ざりません。乳房炎も、分房ごとに起きます（9章）\n- 後ろの分房のほうが大きく、乳の 6割ほどは後ろから出ます\n- 乳頭（にゅうとう, teat）の先には乳頭口（乳頭管, teat canal）があり、ふだんは筋肉と角質の栓（ケラチン）で閉じて、細菌が入らないようにしています\n\n## 乳ができるしくみ\n\n- 乳を作るのは、乳房の中にあるブドウの房のような小さな袋（**乳腺胞**, alveolus）です。袋のまわりの細胞が、血液から材料をとって乳を作ります\n- 乳 1 L を作るのに、**400〜500 L の血液**が乳房を流れます\n\n| 材料（血液の中） | できる乳の成分 |\n| --- | --- |\n| ブドウ糖 | 乳糖（乳の量を決める） |\n| 酢酸など | 乳脂肪 |\n| アミノ酸 | 乳たんぱく質 |\n\n- 乳糖が水を引き込むので、ブドウ糖が多く作られるほど（もとは第一胃のプロピオン酸, 2章）、乳の量が増えます\n\n## 乳が出るしくみ\n\n- 乳頭を刺激すると、脳から**オキシトシン**（oxytocin）というホルモンが出て、乳腺胞のまわりの筋肉が縮み、乳が押し出されます（射乳, milk let-down）\n- オキシトシンが効き始めるまで 1分前後かかり、効き目は数分です。だから、乳頭を刺激してから **60〜90秒後**にミルカーを付けると、よく搾れます\n- 牛が驚いたり痛かったりすると、アドレナリンがオキシトシンのはたらきを止め、乳が出にくくなります。**静かに、いつも同じ手順で**搾ることが大事です\n\n## 搾乳の手順\n\n1. **前搾り**（forestripping）: 各乳頭から 2〜3回、手で搾って捨てる。乳頭の中の細菌を出し、乳の異常（ブツ・水っぽい・血）を見る。乳を出す刺激にもなる\n2. **プレディッピング**（pre-dipping）: 乳頭を消毒液にひたし、30秒ほど置く\n3. **拭き取り**: 1頭に1枚のきれいなタオルで、乳頭を拭いて乾かす（タオルを使い回すと、乳房炎がうつる）\n4. **ミルカーを付ける**: 刺激から 60〜90秒後に\n5. **搾乳**: 5〜8分ほど。乳が少なくなると自動で外れる（自動離脱）。搾りすぎ（過搾乳）は乳頭を傷める\n6. **ポストディッピング**（post-dipping）: 搾乳の後すぐに、乳頭を消毒液にひたす。乳頭口が閉じるまで（30分〜1時間ほど）細菌が入らないように\n\n- 搾乳は 1日 2回（12時間ごと）が多いです。3回にすると、乳の量が 1割ほど増えます\n- **搾乳ロボット**（AMS）では、牛が自分で入ってきて、ロボットが乳頭を見つけて搾ります。1日に平均 2.5〜3回搾ります\n- 搾った乳は、バルククーラー（冷却タンク）ですぐに冷やします（4 ℃ 前後）\n\n## 乳の成分\n\n| 成分 | 英語 | ホルスタインの目安 | 変わること |\n| --- | --- | --- | --- |\n| 水分 | water | 約 87% | |\n| 乳脂肪 | milk fat | 3.5〜4.2% | 粗飼料（繊維）が足りないと下がる |\n| 乳たんぱく質 | milk protein | 3.1〜3.4% | エネルギーが足りないと下がる |\n| 乳糖 | lactose | 4.5〜4.8% | ほぼ一定 |\n| 無脂乳固形分（SNF） | solids-not-fat | 8.6〜8.9% | 乳たんぱく質・乳糖・ミネラルの合計 |\n\n- 乳の値段は、成分（乳脂肪・無脂乳固形分）と、きれいさ（体細胞数・細菌数）で変わります\n- 乳脂肪率が乳たんぱく質率より低い（逆転）と、ルーメンアシドーシスが疑われます。お産の直後に乳脂肪率がとても高い（5% 以上など）と、ケトーシスが疑われます（11章）\n\n## 乳の検査\n\n| 検査 | 英語 | わかること |\n| --- | --- | --- |\n| 体細胞数（SCC） | somatic cell count | 乳 1 mL の中の細胞（主に白血球）の数。乳房炎の目安。健康な分房は 10万個以下。20万個を超えると潜在性乳房炎が疑われる |\n| 細菌数 | bacteria count | 搾乳や冷やし方が衛生的か |\n| 抗生物質の残留 | antibiotic residue | 治療中の牛の乳が混ざっていないか。混ざると、タンクの乳を全部捨てることになる |\n\n- **牛群検定**（乳用牛群能力検定）: 月に1回、1頭ずつ乳量・乳成分・体細胞数を測る仕組みです。牛の能力と健康を見るのに使います\n\n## 出荷できない乳\n\n- **お産から 5日以内の乳（初乳）**: 日本では法律（乳等省令）で、出荷できません。子牛に飲ませます（4章）\n- **異常のある乳**: 乳房炎のブツや水っぽい乳、血乳（9章・10章）\n- **抗生物質で治療中の乳**と、治療後の決められた期間（**休薬期間**, withdrawal period）の乳\n\n## まとめ\n\n- 乳房は4つの分房に分かれ、それぞれ独立している\n- 乳は血液から作られる（乳 1 L に血液 400〜500 L）。乳糖が乳の量を決める\n- オキシトシンで乳が出る。刺激から 60〜90秒後にミルカーを付ける。静かに、同じ手順で\n- 前搾り → 消毒 → 拭く → 搾乳 → ポストディッピング\n- 体細胞数は乳房炎の目安。初乳・異常な乳・休薬期間の乳は出荷しない\n", "en": "# 8. How milk is made, and milking\n\n## What you will learn\n\n- The structure of the udder\n- How milk is made, and how it comes out\n- The steps of milking\n- Milk components and milk tests\n- Milk that cannot be shipped\n\n## The structure of the udder\n\n- The **udder** (乳房) is divided into **four quarters** (分房): front left, front right, rear left and rear right\n- Each quarter is separate, and their milk does not mix. Mastitis also happens quarter by quarter (Chapter 9)\n- The rear quarters are bigger and give about 60% of the milk\n- At the tip of each **teat** (乳頭) is the **teat canal** (乳頭口). It is normally closed by a muscle and a keratin plug, which keeps bacteria out\n\n## How milk is made\n\n- Milk is made in tiny sacs inside the udder that look like bunches of grapes (**alveoli**, 乳腺胞). The cells around each sac take materials from the blood and make milk\n- To make 1 L of milk, **400–500 L of blood** flows through the udder\n\n| Material (in the blood) | Milk component made |\n| --- | --- |\n| Glucose | Lactose (decides milk volume) |\n| Acetate and others | Milk fat |\n| Amino acids | Milk protein |\n\n- Lactose pulls water into the milk, so the more glucose the cow makes (mostly from propionic acid in the rumen, Chapter 2), the more milk she gives\n\n## How milk comes out\n\n- When the teats are stimulated, the brain releases a hormone called **oxytocin** (オキシトシン). It makes the muscles around the alveoli squeeze, pushing the milk out (**milk let-down**, 射乳)\n- Oxytocin takes about a minute to start working and lasts only a few minutes. So attach the milking unit **60–90 seconds after** stimulating the teats for the best milking\n- If a cow is scared or in pain, adrenaline blocks oxytocin and milk does not come out well. Milking **quietly, with the same routine every time**, is important\n\n## Milking steps\n\n1. **Forestripping** (前搾り): squeeze 2–3 streams by hand from each teat and throw them away. This removes bacteria from the teat and lets you check for abnormal milk (clots, watery milk, blood). It also helps let-down\n2. **Pre-dipping**: dip the teats in disinfectant and leave it for about 30 seconds\n3. **Wiping**: wipe and dry the teats with one clean towel per cow (sharing towels spreads mastitis)\n4. **Attach the milking unit**: 60–90 seconds after stimulation\n5. **Milking**: about 5–8 minutes. When the flow gets low, the unit comes off automatically. Milking too long (overmilking) damages the teats\n6. **Post-dipping**: right after milking, dip the teats in disinfectant. This keeps bacteria out until the teat canal closes (about 30 minutes to 1 hour)\n\n- Most farms milk twice a day (every 12 hours). Milking three times a day gives about 10% more milk\n- With a **milking robot** (automatic milking system, AMS), cows walk in by themselves and the robot finds the teats and milks them. Cows are milked 2.5–3 times a day on average\n- Milk is cooled right away in a bulk tank (to about 4 °C)\n\n## Milk components\n\n| Component | Japanese | Typical for Holsteins | What changes it |\n| --- | --- | --- | --- |\n| Water | 水分 | about 87% | |\n| Milk fat | 乳脂肪 | 3.5–4.2% | Falls when there is not enough roughage (fiber) |\n| Milk protein | 乳たんぱく質 | 3.1–3.4% | Falls when there is not enough energy |\n| Lactose | 乳糖 | 4.5–4.8% | Almost constant |\n| Solids-not-fat (SNF) | 無脂乳固形分 | 8.6–8.9% | Protein + lactose + minerals |\n\n- The milk price depends on components (fat and SNF) and cleanliness (somatic cell count and bacteria count)\n- If the fat percentage falls below the protein percentage (an \"inversion\"), rumen acidosis is suspected. If fat is very high (for example 5% or more) just after calving, ketosis is suspected (Chapter 11)\n\n## Milk tests\n\n| Test | Japanese | What it shows |\n| --- | --- | --- |\n| Somatic cell count (SCC) | 体細胞数 | The number of cells (mostly white blood cells) in 1 mL of milk. A sign of mastitis. Healthy quarters have 100,000 or fewer. Over 200,000 suggests subclinical mastitis |\n| Bacteria count | 細菌数 | Whether milking and cooling are hygienic |\n| Antibiotic residue | 抗生物質の残留 | Whether milk from a treated cow got mixed in. If it did, the whole tank must be thrown away |\n\n- **Milk recording** (牛群検定, also called DHI): once a month, the milk yield, components and SCC of each cow are measured. It is used to check each cow's performance and health\n\n## Milk that cannot be shipped\n\n- **Milk within 5 days after calving (colostrum)**: in Japan the law (乳等省令) says it cannot be shipped. It is fed to calves (Chapter 4)\n- **Abnormal milk**: milk with mastitis clots, watery milk, blood in milk (Chapters 9 and 10)\n- **Milk from cows treated with antibiotics**, and milk during the set time after treatment (the **withdrawal period**, 休薬期間)\n\n## Summary\n\n- The udder has four separate quarters\n- Milk is made from blood (400–500 L of blood for 1 L of milk). Lactose decides how much milk there is\n- Oxytocin lets milk down. Attach the unit 60–90 seconds after stimulation. Milk quietly, with the same routine\n- Forestrip → disinfect → wipe → milk → post-dip\n- SCC is a sign of mastitis. Colostrum, abnormal milk and milk in the withdrawal period are not shipped\n"}}, {"file": "09-mastitis.md", "part": {"ja": "第4部 乳と病気", "en": "Part 4: Milk and health"}, "title": {"ja": "9. 乳房炎（大腸菌による乳房炎）", "en": "9. Mastitis (and E. coli mastitis)"}, "md": {"ja": "# 9. 乳房炎（大腸菌による乳房炎）\n\n## この章でわかること\n\n- 乳房炎とは\n- 臨床型と潜在性\n- 原因になる菌（伝染性と環境性）\n- 大腸菌で乳房炎になるしくみ\n- 見つけ方とセンサー\n\n## 乳房炎とは\n\n- **乳房炎**（にゅうぼうえん, mastitis）: 乳房の中（乳腺）の炎症です。ほとんどは、**乳頭口から細菌が入って**起きます\n- 乳牛の病気でいちばん多く、損もいちばん大きい病気です。乳が減る、乳を捨てる、治療費がかかる、牛を手放す、乳の値段が下がる（体細胞数）、などの損が出ます\n- 乳腺の中は、栄養たっぷりの乳で満たされ、温度は 38 ℃ ほどです。細菌にとって、とても増えやすい場所です\n\n## 臨床型と潜在性\n\n| 種類 | 英語 | 見た目 | 見つけ方 |\n| --- | --- | --- | --- |\n| 臨床型乳房炎 | clinical mastitis | 乳にブツ（固まり）が出る、水っぽい、色が変。乳房が腫れる・熱い・痛がる。重いと熱が出て食べない | 前搾りで乳を見る、乳房をさわる |\n| 潜在性乳房炎 | subclinical mastitis | 乳も乳房もふつうに見える | 体細胞数（SCC）、PL テスト（CMT）、電気伝導度 |\n\n- 潜在性乳房炎は、臨床型の 15〜40倍あるといわれます。気づかないまま乳が減り、ほかの牛にうつることもあります\n- 臨床型の重さは、軽症（乳の異常だけ）・中等症（乳房の腫れもある）・重症（熱・食欲がない・立てないなど、全身の症状）に分けます\n\n### PL テスト（CMT）\n\n- 4つのくぼみのある板（パドル）に、分房ごとに乳を少し搾り、試薬と混ぜます\n- 体細胞が多いと、混ぜた液がドロッとしたゲルになります。固まり方で、程度がわかります\n- 牧場ですぐにできる検査です。英語では CMT（California Mastitis Test）といいます\n\n## 原因になる菌\n\n| グループ | 菌の例 | どこにいる | どううつる |\n| --- | --- | --- | --- |\n| 伝染性 | 黄色ブドウ球菌（Staphylococcus aureus）、無乳性レンサ球菌（Streptococcus agalactiae）、マイコプラズマ（Mycoplasma） | 感染した乳房の中、乳頭の傷 | 搾乳のときに、ミルカー・手・タオルを通して、牛から牛へ |\n| 環境性 | 大腸菌（Escherichia coli）、クレブシエラ（Klebsiella）、環境性レンサ球菌（Streptococcus uberis など） | ふん・敷料・泥・汚れた水 | 牛が寝たり歩いたりしたときに、乳頭の先が汚れて |\n\n- **伝染性の菌**は、長引きやすく治りにくいです。黄色ブドウ球菌は抗生物質が効きにくいことが多く、マイコプラズマは抗生物質がほとんど効かず、群れに広がります。搾乳の衛生と、感染した牛を分けることで防ぎます\n- **環境性の菌**は、牛舎の衛生（敷料・ふん）がカギです。大腸菌は、急に重くなることがあります\n\n## 大腸菌で乳房炎になるしくみ\n\n![大腸菌で乳房炎になるまで](images/ecoli-mastitis.svg)\n\n### 1. 大腸菌はどこにいるか\n\n- 大腸菌（だいちょうきん, E. coli）は、牛の腸にふつうにいる菌で、**ふんに大量に含まれます**\n- ふんが混じった敷料（おがくず・わら・戻し堆肥など）、ぬかるみ、汚れた水の中で増えます。**暑くて湿っている**と、特に増えます\n\n### 2. どうやって乳房に入るか\n\n- 牛は 1日に 10〜14時間横になります。寝ると、乳頭の先が敷料にふれます\n- **搾乳の直後は乳頭口が開いています**（閉じるまで 30分〜1時間ほど）。このときに汚れた所に寝ると、菌が入りやすくなります\n- 乳頭の先が傷ついていたり、ガサガサだったりすると（過搾乳など）、入りやすくなります\n- **乾乳期のはじめと、お産の前後**も入りやすい時期です（乳頭口の栓ができる前と、なくなったあと）\n\n### 3. 体の中で何が起きるか\n\n1. 入った大腸菌は、乳の中で速く増える\n2. 牛の体は菌を退治するために、血液から白血球（好中球）を乳房に大量に送る → **体細胞数が急に増える**\n3. 退治されて壊れた大腸菌から、**エンドトキシン**（内毒素, endotoxin）という毒が出る\n4. エンドトキシンが強い炎症を起こし、血液に入ると、**全身の症状**になる\n\n### 4. どんな症状になるか\n\n- **乳房**: 急に腫れて、熱く、固くなる\n- **乳**: 水っぽい・黄色っぽい（黄色い水のよう）、ブツが出る。乳の量がガクッと減る\n- **全身**: 熱が出る（40 ℃ 以上）、震える、食べない、反芻が止まる、下痢、脱水。重いと立てなくなり、ショックで死ぬこともある（甚急性乳房炎）。熱がむしろ下がってくるのは、ショックの危ないサイン\n- 重くなるかどうかは、菌の量よりも**牛の免疫の状態**で決まります。お産の直後は免疫が弱く、重くなりやすいです\n- 一方で、牛の免疫が早く菌を退治できたときは、軽いまま数日で治ることも多いです\n\n### 5. 治療\n\n- **すぐに獣医師に連絡します。** 重い大腸菌性乳房炎は、時間との勝負です\n- 獣医師が行う治療の例: 点滴（輸液）で脱水とショックを防ぐ、炎症を抑える薬、抗生物質、カルシウム\n- 毒素と菌を含む乳を出すために、こまめに搾ることもあります（頻回搾乳）\n- 抗生物質を使ったら、休薬期間が終わるまで、乳は出荷しません（8章）\n\n### 6. 予防\n\n| すること | なぜ |\n| --- | --- |\n| 敷料を乾いた清潔な状態に保つ。ふんはこまめに取り、敷料を足す・替える | 大腸菌は、湿ったふんと敷料で増える |\n| 搾乳の後に、ポストディッピングをする | 乳頭口が閉じるまで、菌を防ぐ |\n| 搾乳の後に新しいエサを与え、30分〜1時間は立っていてもらう | 乳頭口が閉じる前に寝ないように |\n| 前処理で乳頭をきれいにし、乾かしてからミルカーを付ける | 汚れや水と一緒に菌が入らないように |\n| 暑さ対策（送風・換気） | 暑いと菌が増え、牛も弱る |\n| お産の場所（分娩房）を清潔にする | お産の前後は、特にかかりやすい |\n| 乾乳のときに乳頭口をふさぐ（乳頭シーラント） | 乾乳中に菌を入れない |\n| ワクチン | 国によっては、大腸菌（J5）のワクチンで重くなるのを防ぐ |\n\n## 見つけ方とセンサー\n\n| 方法 | わかること |\n| --- | --- |\n| 前搾りで乳を見る | 臨床型（ブツ・水っぽい・血） |\n| PL テスト（CMT） | 分房ごとの体細胞の多さ |\n| 牛群検定の体細胞数 | 1頭ごとの潜在性乳房炎 |\n| 電気伝導度（搾乳ロボット・ミルクメーター） | 乳房炎の乳は塩分（ナトリウム・塩素）が増えて、電気を通しやすくなる |\n| 乳量の急な減少、反芻・活動量・体温 | 全身の症状が出る、重い乳房炎 |\n\n## まとめ\n\n- 乳房炎は、乳頭口から細菌が入って起きる乳腺の炎症。乳牛でいちばん多く、損も大きい\n- 見てわかる臨床型と、見えない潜在性がある。潜在性は体細胞数や PL テストで見つける\n- 菌は、牛から牛へうつる**伝染性**（黄色ブドウ球菌など）と、ふんや敷料からの**環境性**（大腸菌など）\n- 大腸菌は、ふんで汚れた湿った敷料 → 搾乳直後の開いた乳頭口 → 乳の中で増える → 壊れてエンドトキシン → 全身の症状\n- 乾いた清潔な敷料、ポストディッピング、搾乳後に寝かせない、で防ぐ。重いときはすぐ獣医師へ\n", "en": "# 9. Mastitis (and E. coli mastitis)\n\n## What you will learn\n\n- What mastitis is\n- Clinical and subclinical mastitis\n- The bacteria that cause it (contagious and environmental)\n- How E. coli causes mastitis\n- How to find it, and sensors\n\n## What is mastitis?\n\n- **Mastitis** (乳房炎): inflammation inside the udder (the mammary gland). Most cases happen when **bacteria enter through the teat canal**\n- It is the most common and the most costly disease of dairy cows. Losses include less milk, milk that must be thrown away, treatment costs, losing cows, and a lower milk price (because of high SCC)\n- Inside the udder it is about 38 °C and full of nutritious milk — a very easy place for bacteria to grow\n\n## Clinical and subclinical mastitis\n\n| Type | Japanese | What you see | How to find it |\n| --- | --- | --- | --- |\n| Clinical mastitis | 臨床型乳房炎 | Clots (flakes) in the milk, watery or odd-colored milk. The quarter is swollen, hot or painful. In severe cases, fever and no appetite | Look at the milk when forestripping, feel the udder |\n| Subclinical mastitis | 潜在性乳房炎 | Milk and udder look normal | Somatic cell count (SCC), CMT (PL test), electrical conductivity |\n\n- Subclinical mastitis is said to be 15–40 times more common than clinical mastitis. Without anyone noticing, it lowers milk yield and can spread to other cows\n- Clinical cases are graded as mild (abnormal milk only), moderate (the quarter is also swollen) or severe (the whole body is affected: fever, no appetite, cannot stand)\n\n### CMT (California Mastitis Test)\n\n- Squeeze a little milk from each quarter into a paddle with four cups and mix it with the test liquid\n- If there are many somatic cells, the mixture becomes a thick gel. How thick it gets shows how bad it is\n- It is a quick test you can do on the farm. In Japan it is called the PL test (PL テスト)\n\n## The bacteria that cause it\n\n| Group | Example bacteria | Where they live | How they spread |\n| --- | --- | --- | --- |\n| Contagious | Staphylococcus aureus（黄色ブドウ球菌）, Streptococcus agalactiae（無乳性レンサ球菌）, Mycoplasma（マイコプラズマ） | Inside infected udders, in teat wounds | From cow to cow at milking, through milking units, hands and towels |\n| Environmental | E. coli（大腸菌）, Klebsiella（クレブシエラ）, Streptococcus uberis and other environmental streps | Manure, bedding, mud, dirty water | The teat ends get dirty when cows lie down or walk |\n\n- **Contagious bacteria** cause long-lasting infections that are hard to cure. Staph aureus often does not respond well to antibiotics, and Mycoplasma hardly responds at all and spreads through the herd. They are controlled by milking hygiene and separating infected cows\n- **Environmental bacteria** are controlled by barn hygiene (bedding and manure). E. coli can suddenly become severe\n\n## How E. coli causes mastitis\n\n![How E. coli causes mastitis](images/ecoli-mastitis.svg)\n\n### 1. Where E. coli lives\n\n- E. coli (大腸菌) lives normally in the cow's gut, and **manure is full of it**\n- It grows in bedding mixed with manure (sawdust, straw, recycled manure solids), in mud and in dirty water. It grows fastest when it is **hot and wet**\n\n### 2. How it gets into the udder\n\n- Cows lie down for 10–14 hours a day. When they lie down, the teat ends touch the bedding\n- **Right after milking, the teat canal is open** (it takes about 30 minutes to 1 hour to close). If a cow lies down on dirty bedding then, bacteria get in easily\n- Damaged or rough teat ends (for example from overmilking) let bacteria in more easily\n- **The start of the dry period and the time around calving** are also risky (before the teat plug forms, and after it is lost)\n\n### 3. What happens inside\n\n1. E. coli that gets in grows quickly in the milk\n2. To kill the bacteria, the body sends huge numbers of white blood cells (neutrophils) from the blood into the udder → **SCC rises sharply**\n3. When the bacteria are killed and break apart, they release a poison called **endotoxin** (エンドトキシン, 内毒素)\n4. Endotoxin causes strong inflammation, and if it enters the blood, it affects **the whole body**\n\n### 4. Signs\n\n- **Udder**: suddenly swollen, hot and hard\n- **Milk**: watery and yellowish (like yellow water), with clots. Milk yield drops sharply\n- **Whole body**: fever (40 °C or more), shivering, not eating, rumination stops, diarrhea, dehydration. In severe cases the cow cannot stand and may die of shock (peracute mastitis). If the temperature starts to fall below normal, that is a dangerous sign of shock\n- How severe it gets depends more on **the cow's immune condition** than on the number of bacteria. Just after calving, the immune system is weak, so cases are more severe\n- On the other hand, if the cow's immune system kills the bacteria quickly, many cases stay mild and clear up in a few days\n\n### 5. Treatment\n\n- **Call a vet right away.** With severe E. coli mastitis, every hour counts\n- Examples of what a vet may do: give fluids (a drip) to fight dehydration and shock, anti-inflammatory drugs, antibiotics, calcium\n- The quarter may be milked out often to remove milk full of toxins and bacteria (frequent stripping)\n- If antibiotics are used, milk is not shipped until the withdrawal period is over (Chapter 8)\n\n### 6. Prevention\n\n| What to do | Why |\n| --- | --- |\n| Keep bedding dry and clean. Remove manure often, add or change bedding | E. coli grows in wet manure and bedding |\n| Post-dip after milking | Protects the teat until the canal closes |\n| Give fresh feed after milking so cows stay standing for 30 minutes to 1 hour | So they do not lie down before the teat canal closes |\n| Clean and dry the teats before attaching the unit | So dirt and water do not carry bacteria in |\n| Fight heat (fans, ventilation) | Heat makes bacteria grow and weakens cows |\n| Keep the calving area clean | Cows are especially at risk around calving |\n| Seal the teats at dry-off (teat sealant) | Keeps bacteria out during the dry period |\n| Vaccines | In some countries, an E. coli (J5) vaccine is used to make cases less severe |\n\n## Finding mastitis, and sensors\n\n| Method | What it shows |\n| --- | --- |\n| Looking at milk when forestripping | Clinical mastitis (clots, watery milk, blood) |\n| CMT (PL test) | High cell counts, quarter by quarter |\n| SCC from milk recording | Subclinical mastitis, cow by cow |\n| Electrical conductivity (milking robots, milk meters) | Mastitis milk has more salt (sodium and chloride), so electricity passes through it more easily |\n| Sudden drop in milk yield, rumination, activity, body temperature | Severe mastitis that affects the whole body |\n\n## Summary\n\n- Mastitis is inflammation of the udder caused by bacteria entering through the teat canal. It is the most common and most costly disease of dairy cows\n- There is clinical mastitis (you can see it) and subclinical mastitis (you cannot). Find subclinical cases with SCC and the CMT\n- Bacteria are **contagious** (spread cow to cow, such as Staph aureus) or **environmental** (from manure and bedding, such as E. coli)\n- E. coli: dirty, wet bedding → the open teat canal right after milking → bacteria grow in milk → they break apart and release endotoxin → the whole body is affected\n- Prevent it with dry, clean bedding, post-dipping and keeping cows standing after milking. Call a vet right away in severe cases\n"}}, {"file": "10-blood-milk.md", "part": {"ja": "第4部 乳と病気", "en": "Part 4: Milk and health"}, "title": {"ja": "10. 血乳", "en": "10. Blood in milk"}, "md": {"ja": "# 10. 血乳\n\n## この章でわかること\n\n- 血乳とは\n- なぜ血乳になるのか\n- 原因の見分け方\n- 気をつけること\n\n## 血乳とは\n\n- **血乳**（けつにゅう, blood in milk）: 乳に血が混じって、ピンク〜赤色になったものです。血のかたまりが出ることもあります\n- 赤血球が混じっているので、コップや試験管に入れて置いておくと、赤いものが底に沈みます\n- **血乳は出荷できません。** 少しでもタンクに混ざると、乳全体の色が変わってしまいます\n\n## なぜ血乳になるのか\n\n乳は血液から作られます（8章）。乳腺のまわりには、とても細い血管（毛細血管）がたくさん通っています。**この血管が破れると、血が乳に混じります。** 破れる理由は、主に次の5つです。\n\n### 1. お産の直後（いちばん多い）\n\n- お産の前後は、乳を作り始めるために、乳房に**血液とリンパ液が急にたくさん集まります**\n- そのため、乳房がパンパンにむくみます（**乳房浮腫**, udder edema）。初めてお産をした牛（初産牛）や、乳の多い牛で強く出ます\n- むくみの圧力と、急に大きくなった乳房の中で、細い血管が破れやすくなります\n- 多くは **数日〜2週間ほどで、自然に治ります**\n\n### 2. 乳房のけが\n\n- ほかの牛や自分の後ろ足で乳房を踏む、柵や牛床の段差にぶつける、乳頭を踏まれる、などで出血します\n- 乳房が大きく垂れ下がった牛は、けがをしやすいです\n- **1つの分房だけが急に血乳になった**ときは、けがを疑います\n\n### 3. 搾乳のしかた\n\n- 真空圧が強すぎる、搾りすぎ（過搾乳）、ライナー（乳頭に当たるゴム）が古い、などで、乳頭や乳房の中を傷つけることがあります\n\n### 4. 乳房炎\n\n- 炎症で血管が傷つき、血が混じることがあります。重い乳房炎（大腸菌や、黄色ブドウ球菌によるものなど）で起こります\n- 熱・腫れ・ブツがある、PL テストに反応する、などのときは乳房炎を疑います（9章）\n\n### 5. 血が止まりにくくなる病気（まれ）\n\n- 血を固める力（血小板など）が弱くなる病気や中毒（例: ワラビを食べたときの中毒）では、乳房以外からも出血します\n- 鼻血、皮膚や目の点のような出血、血便などがあれば、すぐに獣医師に連絡します\n\n## 見分け方\n\n| 様子 | 考えられる原因 |\n| --- | --- |\n| お産の直後、初産牛、乳房のむくみが強い、複数の分房から | お産の後の毛細血管の破れ |\n| 急に1つの分房だけ、乳房にあざや傷がある | けが |\n| 熱・腫れ・ブツ・水っぽい、PL テストに反応 | 乳房炎 |\n| 乳房以外からも出血する、元気がない | 血が止まりにくくなる病気 |\n\n## 気をつけること\n\n- 血乳は出荷しません。前搾りで、**どの分房から出ているか**を確かめ、その乳を分けます\n- 原因がわからないとき、何日も続くとき、熱や元気のなさがあるときは、獣医師に相談します\n- 乳房を強くもんだり、たたいたりしません（もっと出血することがあります）\n- けがを防ぐため、牛床の段差や突き出た金具をなくし、滑りにくい床にし、牛を混み合わせすぎないようにします\n- 乳房のむくみを減らすため、乾乳期のエサで塩分（ナトリウム・カリウム）を取りすぎないようにします\n- 搾乳ロボットや一部のミルクメーターは、乳の色をセンサーで見て、血乳を自動で分けます\n\n## まとめ\n\n- 血乳は、乳腺のまわりの細い血管が破れて、乳に血が混じったもの。出荷できない\n- いちばん多いのは、お産の直後の乳房のむくみによるもの（特に初産牛）。多くは数日〜2週間で治る\n- ほかに、けが・搾乳のしかた・乳房炎・まれに血が止まりにくくなる病気\n- どの分房からかを確かめ、続くときや熱があるときは獣医師へ\n", "en": "# 10. Blood in milk\n\n## What you will learn\n\n- What blood in milk is\n- Why blood gets into milk\n- How to tell the causes apart\n- What to watch out for\n\n## What is blood in milk?\n\n- **Blood in milk** (血乳, also called bloody milk): milk mixed with blood, so it looks pink to red. Sometimes blood clots come out too\n- Because it contains red blood cells, if you leave it in a glass or test tube, red material sinks to the bottom\n- **Milk with blood cannot be shipped.** Even a little in the tank changes the color of all the milk\n\n## Why blood gets into milk\n\nMilk is made from blood (Chapter 8). Many very thin blood vessels (capillaries) run around the milk-making tissue.
