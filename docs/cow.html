 **When these vessels break, blood gets into the milk.** There are five main reasons they break.\n\n### 1. Right after calving (the most common)\n\n- Around calving, **a lot of blood and lymph suddenly flows into the udder** to start making milk\n- This makes the udder very swollen and tight (**udder edema**, 乳房浮腫). It is strongest in first-calf heifers (初産牛) and high-yielding cows\n- The pressure of the swelling, and the udder growing so quickly, make thin vessels break easily\n- Most cases **clear up by themselves in a few days to about two weeks**\n\n### 2. Injury to the udder\n\n- The udder can bleed when it is stepped on by another cow or by the cow's own hind leg, hit on a fence or a step in the stall, or when a teat is stepped on\n- Cows with large, low-hanging udders get injured more easily\n- If **only one quarter suddenly gives bloody milk**, suspect an injury\n\n### 3. How the cow is milked\n\n- Vacuum that is too high, overmilking, and old liners (the rubber that touches the teat) can damage the teats and the inside of the udder\n\n### 4. Mastitis\n\n- Inflammation can damage blood vessels and let blood into the milk. This happens with severe mastitis (for example from E. coli or Staph aureus)\n- If there is fever, swelling or clots, or the CMT reacts, suspect mastitis (Chapter 9)\n\n### 5. Diseases that stop blood from clotting (rare)\n\n- Some diseases and poisonings weaken the blood's ability to clot (for example by lowering platelets). One example is poisoning from eating bracken fern (ワラビ). Then the cow bleeds from other places too, not only the udder\n- If you see nosebleeds, small spots of bleeding on the skin or eyes, or blood in the manure, call a vet right away\n\n## Telling the causes apart\n\n| What you see | Possible cause |\n| --- | --- |\n| Just after calving, first-calf heifer, strong udder swelling, several quarters | Broken capillaries after calving |\n| Suddenly only one quarter, bruises or wounds on the udder | Injury |\n| Fever, swelling, clots, watery milk, positive CMT | Mastitis |\n| Bleeding from other places too, the cow is weak | A disease that stops blood from clotting |\n\n## What to watch out for\n\n- Do not ship bloody milk. Forestrip to find **which quarter** it comes from, and keep that milk separate\n- Talk to a vet if you do not know the cause, if it lasts many days, or if the cow has a fever or seems weak\n- Do not rub or hit the udder hard (it can make the bleeding worse)\n- To prevent injuries, remove steps and sharp metal in the stalls, use non-slip floors, and do not crowd the cows\n- To reduce udder swelling, do not give dry cows too much salt (sodium and potassium) in their feed\n- Milking robots and some milk meters check milk color with a sensor and separate bloody milk automatically\n\n## Summary\n\n- Blood in milk happens when thin blood vessels around the milk-making tissue break. This milk cannot be shipped\n- The most common cause is udder swelling right after calving (especially in first-calf heifers). Most cases clear up in a few days to two weeks\n- Other causes: injury, the way the cow is milked, mastitis, and rarely diseases that stop blood from clotting\n- Find which quarter it comes from. If it lasts or the cow has a fever, call a vet\n"}}, {"file": "11-diseases.md", "part": {"ja": "第4部 乳と病気", "en": "Part 4: Milk and health"}, "title": {"ja": "11. お産の前後の病気・蹄・暑さ", "en": "11. Transition diseases, feet and heat"}, "md": {"ja": "# 11. お産の前後の病気・蹄・暑さ\n\n## この章でわかること\n\n- お産の前後に病気が多いわけ\n- 周産期の主な病気\n- 蹄と脚の病気\n- 暑熱ストレス\n- そのほかの病気と、早く見つけるサイン\n\n## お産の前後が危ない\n\n- お産の 3週間前から 3週間後までを、**移行期**（transition period）または周産期と呼びます\n- 乳を作り始めるのに、大量の**エネルギー**と**カルシウム**が必要になります。ところが、お産の前後は食べる量が減るので、足りなくなります\n- 病気の多くがこの時期に起き、1つの病気が次の病気を呼びます（例: 乳熱 → 胎盤停滞 → 子宮炎、ケトーシス → 第四胃変位）\n\n## 周産期の主な病気\n\n| 病気 | 英語 | 何が起きるか | サイン |\n| --- | --- | --- | --- |\n| 乳熱（低カルシウム血症） | milk fever（hypocalcemia） | 初乳を作るためにカルシウムが一気に使われ、血液のカルシウムが足りなくなる。お産から 3日以内に多い | 立てない、耳が冷たい、首を横に曲げてぼんやりする。「熱」と書くが、体温はむしろ下がる |\n| ケトーシス | ketosis | エネルギー不足で体の脂肪を使いすぎ、ケトン体が増える | 食欲（特に濃厚飼料）がない、乳が減る、息や乳が甘ずっぱいにおい、やせる |\n| 第四胃変位 | displaced abomasum（DA） | 第四胃にガスがたまってふくらみ、正しい位置からずれる（多くは左へ） | 食欲が落ち、乳が減る。お腹をたたくと「キーン」と金属のような音がする。手術が必要なことが多い |\n| 胎盤停滞 | retained placenta | お産のあと 12〜24時間たっても、胎盤（後産）が出ない | 陰部から胎盤がぶら下がる。子宮炎の原因 |\n| 子宮炎 | metritis | 子宮に細菌が入って炎症が起きる | くさいおりもの、熱。次の妊娠が遅れる |\n| 脂肪肝 | fatty liver | 体の脂肪が肝臓にたまる | ケトーシスと一緒に起きやすい |\n\n### 防ぐポイント\n\n- 乾乳期に**太らせすぎない**（ボディコンディションスコア BCS で 3.0〜3.5）\n- 乾乳期のエサで、カルシウムとカリウムを取りすぎない（アルファルファを乾乳牛に多く与えない, 6章）。陰イオン塩でカルシウムの仕組みを助けることもある\n- お産の前後に**食べる量を落とさない**（エサを急に変えない、快適な分娩房）\n- お産のあとに、体温・食欲・乳の量・ケトン体（乳や血液の簡単な検査）を確かめる\n\n## 蹄と脚の病気\n\n- **跛行**（はこう, lameness）: 脚をひきずったり、かばったりして歩くこと。乳牛にとても多い問題です\n- 痛みで食べる時間と寝る時間が減り、乳が減り、発情も弱くなります\n\n| 病気 | 英語 | 説明 |\n| --- | --- | --- |\n| 蹄底潰瘍 | sole ulcer | 蹄の底に傷ができる。アシドーシス、固い床、長く立っていることが原因 |\n| 白帯病 | white line disease | 蹄の壁と底のつなぎ目が割れて、菌が入る |\n| 趾皮膚炎（DD） | digital dermatitis | 蹄の後ろの皮膚に、イチゴのような赤いただれができる。菌でうつる。ふんで汚れた湿った床で広がる |\n| 趾間腐爛 | foot rot | 蹄の間が腫れて、くさいにおいがする |\n\n- 予防: **削蹄**（さくてい: 年に 2回ほど蹄を切って形を整える）、蹄浴（消毒液に蹄をひたす）、乾いた清潔な床、よく寝られる牛床、アシドーシスを防ぐエサ\n- 歩き方に点数を付けて（ロコモーションスコア 1〜5）、早めに見つけます。カメラで自動で点数を付ける技術もあります\n\n## 暑熱ストレス\n\n- 牛は暑さに弱い動物です。第一胃の発酵と乳を作ることで、体の中でたくさん熱が出るためです\n- 温度と湿度から計算する **THI**（温湿度指数）が 68〜72 を超えると、影響が出始めます\n\n| サイン | 説明 |\n| --- | --- |\n| 呼吸が速い | 1分に 60回以上。口を開けてハアハアする、よだれ |\n| 立っている時間が増える | 体を冷やすため。蹄にも悪い |\n| 水をたくさん飲む | |\n| 食べる量と乳の量が減る | 乳脂肪も下がりやすい |\n| 繁殖が悪くなる | 発情が弱くなり、受胎率が下がる |\n\n対策は、送風（大きな扇風機）、細霧・散水（ミスト・シャワー）、日陰、屋根の断熱、換気、新鮮な水をたっぷり、涼しい時間に給餌、です。\n\n## そのほかの病気\n\n| 病気 | 英語 | 説明 |\n| --- | --- | --- |\n| 鼓脹症 | bloat | 第一胃にガスがたまり、左のお腹が大きくふくれる。マメ科の生草（アルファルファ・クローバー）で泡状のガスになることがある。息ができなくなり危険 |\n| 創傷性第二胃炎 | hardware disease | 飲み込んだ針金や釘が第二胃に刺さる。磁石を飲ませて防ぐ |\n| 伝染病 | infectious diseases | 口蹄疫、牛ウイルス性下痢（BVD）、牛伝染性リンパ腫（牛白血病）、ヨーネ病など。法律で届け出が必要なものもある |\n\n## 早く見つけるサイン\n\n| サイン | 疑うこと |\n| --- | --- |\n| 食べる量・反芻が減る | ほとんどの病気のはじまり |\n| 乳の量が急に減る | 乳房炎、ケトーシス、第四胃変位、熱 |\n| 熱がある（39.5 ℃ 以上） | 乳房炎、子宮炎、肺炎 |\n| 寝てばかり、または立ってばかり | 跛行、乳熱、暑さ |\n| 活動量が増える | 発情（病気ではない） |\n\n「いつもとちがう」に早く気づくことが大事です。センサーは、これを毎日・1頭ずつ・24時間、数字で見ます（12章）。\n\n## まとめ\n\n- お産の前後3週間（移行期）は、エネルギーとカルシウムが足りなくなり、病気が多い\n- 乳熱・ケトーシス・第四胃変位・胎盤停滞・子宮炎は、つながって起きやすい\n- 跛行は乳牛に多い。削蹄・清潔な床・よく寝られる牛床で防ぐ\n- 牛は暑さに弱い。THI 68〜72 を超えたら、送風・ミスト・水\n- 食べる量・反芻・乳の量・体温の「いつもとちがう」が、早く見つけるサイン\n", "en": "# 11. Transition diseases, feet and heat\n\n## What you will learn\n\n- Why many diseases happen around calving\n- The main transition diseases\n- Hoof and leg problems\n- Heat stress\n- Other diseases, and early warning signs\n\n## The risky time around calving\n\n- The time from 3 weeks before to 3 weeks after calving is called the **transition period** (移行期, 周産期)\n- To start making milk, the cow suddenly needs a lot of **energy** and **calcium**. But around calving she eats less, so she runs short\n- Many diseases happen at this time, and one disease often leads to another (for example: milk fever → retained placenta → metritis, or ketosis → displaced abomasum)\n\n## Main transition diseases\n\n| Disease | Japanese | What happens | Signs |\n| --- | --- | --- | --- |\n| Milk fever (hypocalcemia) | 乳熱（低カルシウム血症） | Making colostrum uses up calcium very fast, and blood calcium falls too low. Most common within 3 days after calving | Cannot stand, cold ears, turns the neck to the side and looks dull. Despite the name, body temperature actually falls |\n| Ketosis | ケトーシス | Lack of energy makes the body burn too much fat, and ketone bodies build up | Poor appetite (especially for concentrate), less milk, sweet-sour smell on the breath or milk, weight loss |\n| Displaced abomasum (DA) | 第四胃変位 | The abomasum fills with gas and moves out of place (usually to the left) | Eats less, less milk. Tapping the belly makes a high \"ping\" like metal. Often needs surgery |\n| Retained placenta | 胎盤停滞 | The placenta (afterbirth) does not come out within 12–24 hours after calving | The placenta hangs from the vulva. Leads to metritis |\n| Metritis | 子宮炎 | Bacteria get into the uterus and cause inflammation | Bad-smelling discharge, fever. Delays the next pregnancy |\n| Fatty liver | 脂肪肝 | Body fat builds up in the liver | Often happens together with ketosis |\n\n### Prevention points\n\n- Do not let dry cows get **too fat** (body condition score, BCS, 3.0–3.5)\n- In the dry period, do not feed too much calcium and potassium (do not feed a lot of alfalfa to dry cows, Chapter 6). Anionic salts are sometimes used to help the calcium system work\n- Keep cows **eating well** around calving (no sudden feed changes, a comfortable calving pen)\n- After calving, check body temperature, appetite, milk yield and ketone bodies (simple milk or blood tests)\n\n## Hoof and leg problems\n\n- **Lameness** (跛行): walking with a limp or favoring a leg. It is a very common problem in dairy cows\n- Pain means less time eating and lying down, less milk, and weaker heats\n\n| Disease | Japanese | Description |\n| --- | --- | --- |\n| Sole ulcer | 蹄底潰瘍 | A wound on the bottom of the hoof. Caused by acidosis, hard floors and standing too long |\n| White line disease | 白帯病 | The joint between the hoof wall and the sole cracks and bacteria get in |\n| Digital dermatitis (DD) | 趾皮膚炎 | A red, strawberry-like sore on the skin at the back of the hoof. Spread by bacteria, especially on wet floors dirty with manure |\n| Foot rot | 趾間腐爛 | The skin between the claws swells and smells bad |\n\n- Prevention: **hoof trimming** (削蹄, about twice a year), footbaths (walking through disinfectant), dry and clean floors, comfortable stalls for lying, and feed that prevents acidosis\n- Scoring how cows walk (locomotion score 1–5) finds problems early. There is also technology that scores it automatically with cameras\n\n## Heat stress\n\n- Cows are weak in hot weather, because rumen fermentation and milk production make a lot of heat inside the body\n- When the **THI** (temperature-humidity index, 温湿度指数), calculated from temperature and humidity, goes above 68–72, cows start to be affected\n\n| Sign | Description |\n| --- | --- |\n| Fast breathing | 60 or more breaths a minute. Panting with the mouth open, drooling |\n| Standing more | To cool down. Also bad for the hooves |\n| Drinking a lot of water | |\n| Eating less and giving less milk | Milk fat also tends to fall |\n| Poorer breeding | Heats get weaker and conception rates fall |\n\nWhat helps: fans, misting and sprinklers, shade, roof insulation, ventilation, plenty of fresh water, and feeding in the cooler hours.\n\n## Other diseases\n\n| Disease | Japanese | Description |\n| --- | --- | --- |\n| Bloat | 鼓脹症 | Gas builds up in the rumen and the left side of the belly swells. Fresh legumes (alfalfa, clover) can turn the gas into foam. The cow can suffocate — an emergency |\n| Hardware disease | 創傷性第二胃炎 | Swallowed wire or nails stick into the reticulum. Prevented by giving the cow a magnet to swallow |\n| Infectious diseases | 伝染病 | Foot-and-mouth disease, bovine viral diarrhea (BVD), enzootic bovine leukosis (bovine leukemia), Johne's disease and others. Some must be reported by law |\n\n## Early warning signs\n\n| Sign | Suspect |\n| --- | --- |\n| Eats less, ruminates less | The start of almost any disease |\n| Sudden drop in milk | Mastitis, ketosis, displaced abomasum, fever |\n| Fever (39.5 °C or more) | Mastitis, metritis, pneumonia |\n| Lying down all the time, or standing all the time | Lameness, milk fever, heat |\n| More activity | Heat (estrus) — not a disease |\n\nNoticing \"something is different from usual\" early is what matters. Sensors watch for this every day, cow by cow, 24 hours a day, as numbers (Chapter 12).\n\n## Summary\n\n- In the 3 weeks before and after calving (the transition period), cows run short of energy and calcium, and many diseases happen\n- Milk fever, ketosis, displaced abomasum, retained placenta and metritis tend to come together\n- Lameness is common. Prevent it with hoof trimming, clean floors and comfortable stalls\n- Cows are weak in heat. When THI goes above 68–72, use fans, misting and water\n- Changes from normal in eating, rumination, milk yield and body temperature are early warning signs\n"}}, {"file": "12-smart.md", "part": {"ja": "第5部 牧場とスマート酪農", "en": "Part 5: The farm and smart dairy"}, "title": {"ja": "12. 牛の暮らしとスマート酪農", "en": "12. Cow life and smart dairy farming"}, "md": {"ja": "# 12. 牛の暮らしとスマート酪農\n\n## この章でわかること\n\n- 牛の一日の過ごし方\n- 牛舎の種類\n- 酪農家の一日の仕事\n- センサーとロボットでわかること・できること\n- センサーを使うときに大事なこと\n\n## 牛の一日\n\n| 行動 | 1日の時間の目安 |\n| --- | --- |\n| 横になって休む | 10〜14時間 |\n| 食べる | 3〜5時間（1日 9〜14回に分けて） |\n| 反芻する | 7〜10時間（多くは横になりながら） |\n| 水を飲む | 30分ほど（1日 80〜150 L） |\n| 搾乳・移動など | 2〜3時間 |\n\n- 「よく食べ、よく休み、よく反芻する」牛が健康で、乳もよく出します。牛が快適に過ごせることを**カウコンフォート**（cow comfort）といいます\n- 立っている時間が長いと、蹄を痛め、乳房に流れる血液も減ります\n\n## 牛舎の種類\n\n| 種類 | 英語 | 説明 |\n| --- | --- | --- |\n| つなぎ飼い | tie-stall | 1頭ずつ決まった場所につなぐ。1頭ずつ世話がしやすい。搾乳は、牛のいる場所でパイプラインミルカーを使う。日本の中小規模の牧場に多い |\n| フリーストール | free-stall | 牛は自由に歩き回り、寝るときは1頭分ずつ区切られた寝床（ストール）に入る。搾乳は、ミルキングパーラー（搾乳室）か搾乳ロボットで。大きな牧場に多い |\n| フリーバーン | free-barn（bedded pack） | 区切りのない広い寝床に敷料を厚く敷き、自由に過ごす |\n| 放牧 | grazing（pasture） | 牧草地で草を食べて過ごす。エサ代が少なく、牛も運動できる |\n\n## 酪農家の一日\n\n| 時刻（例） | 仕事 |\n| --- | --- |\n| 5:00 | 朝の搾乳、エサやり、牛の様子を見る |\n| 8:00 | 牛舎の掃除（ふん出し・敷料）、子牛の哺乳 |\n| 10:00 | 発情の確認と授精、獣医師の診療、削蹄 |\n| 13:00 | 畑仕事（牧草・トウモロコシ）、事務、休けい |\n| 16:00 | 夕方の搾乳、エサやり、掃除 |\n| 19:00 | 片付け、見回り |\n\n- 牛の世話に休みの日はありません。お産は夜中のことも多いです\n- 酪農ヘルパー（代わりに搾乳などをする人）、コントラクター（畑仕事の請負）、TMR センターなど、地域で仕事を分ける仕組みもあります\n- 人手が足りないことが、スマート酪農が広がる大きな理由です\n\n## センサーとロボット\n\n| 技術 | 英語 | 何を測る・何をする | わかること |\n| --- | --- | --- | --- |\n| 首輪・足・耳の活動量計 | activity monitor（collar, pedometer, ear tag） | 加速度で、歩数・動き・頭の動きを測る | 発情（活動量が 2〜4倍）、反芻・食べる時間、病気 |\n| 反芻センサー | rumination sensor | あごの動きや、かむ音 | 反芻時間が減る → 病気・お産・暑さ |\n| 胃のセンサー（ボーラス） | rumen bolus | 飲み込ませて、第二胃の中で温度や動きを測る | 熱、水を飲んだ回数、お産が近いこと |\n| 体温・尾のセンサー | vaginal / tail sensor | 体温や、尾の上げ方 | お産が近いこと（体温が下がる、尾をよく上げる） |\n| 搾乳ロボット・ミルクメーター | milking robot（AMS）, milk meter | 乳量、電気伝導度、乳の色、体細胞 | 乳房炎、血乳、乳量の変化 |\n| カメラと AI | camera + AI | 体の形、歩き方、顔 | ボディコンディションスコア（BCS）、跛行、牛の見分け |\n| 通過式体重計 | walk-over scale | 通るときに体重を測る | 成長、やせた・太った |\n| 環境センサー | climate sensor | 温度・湿度から THI を出す | 暑熱ストレス。送風機やミストを自動で動かす |\n| 給餌・エサ寄せロボット | feeding robot, feed pusher | エサを配る、押し寄せる | 食べる量を増やし、人の手間を減らす |\n| 哺乳ロボット | automatic calf feeder | 子牛ごとにミルクの量を決めて飲ませる | 飲んだ量・飲む速さ → 子牛の病気 |\n\n### センサーで大事なこと\n\n- 1回の数字より、**その牛のふだんとの差**を見ます（例: 反芻の時間が、ふだんより 2割減った）\n- お知らせ（アラート）は診断ではありません。**人が牛を見て確かめる**きっかけです\n- 牛ごとのデータは、耳標の**個体識別番号**（10けた）と結びつけて記録します\n- 何年もデータを集めると、牧場全体の成績（繁殖・乳房炎・エサ）や、病気になりやすい牛も見えてきます\n- スマート農業News の「酪農・畜産」「IoT・センサー」のニュースは、この章の技術の話が多いです\n\n## まとめ\n\n- 牛は 1日に 10〜14時間休み、7〜10時間反芻する。よく休める牛ほど乳が出る\n- 牛舎には、つなぎ飼い・フリーストール・フリーバーン・放牧がある\n- 酪農は休みがなく人手が足りない。だからセンサーとロボットが広がっている\n- 活動量で発情、反芻で病気、電気伝導度で乳房炎、体温でお産、THI で暑さがわかる\n- アラートは診断ではない。ふだんとの差を見て、人が確かめる\n", "en": "# 12. Cow life and smart dairy farming\n\n## What you will learn\n\n- How a cow spends her day\n- Types of barns\n- A dairy farmer's day\n- What sensors and robots can tell us and do\n- What matters when using sensors\n\n## A cow's day\n\n| Activity | Typical time per day |\n| --- | --- |\n| Lying down and resting | 10–14 hours |\n| Eating | 3–5 hours (in 9–14 meals) |\n| Ruminating | 7–10 hours (mostly while lying down) |\n| Drinking | about 30 minutes (80–150 L a day) |\n| Milking, walking, etc. | 2–3 hours |\n\n- Cows that \"eat well, rest well and ruminate well\" are healthy and give more milk. Keeping cows comfortable is called **cow comfort** (カウコンフォート)\n- Standing too long hurts the hooves and reduces blood flow to the udder\n\n## Types of barns\n\n| Type | Japanese | Description |\n| --- | --- | --- |\n| Tie-stall | つなぎ飼い | Each cow is tied in her own place. Easy to care for each cow. Cows are milked in place with a pipeline milking system. Common on small and medium farms in Japan |\n| Free-stall | フリーストール | Cows walk freely and lie down in single-cow beds (stalls). They are milked in a milking parlor or by a milking robot. Common on large farms |\n| Free-barn (bedded pack) | フリーバーン | Cows move freely on one large bed with thick bedding and no dividers |\n| Grazing (pasture) | 放牧 | Cows eat grass in the field. Low feed costs, and cows get exercise |\n\n## A dairy farmer's day\n\n| Time (example) | Work |\n| --- | --- |\n| 5:00 | Morning milking, feeding, checking the cows |\n| 8:00 | Cleaning the barn (removing manure, adding bedding), feeding calves |\n| 10:00 | Checking heats and inseminating, vet visits, hoof trimming |\n| 13:00 | Field work (grass and corn), paperwork, rest |\n| 16:00 | Evening milking, feeding, cleaning |\n| 19:00 | Clearing up, a last check on the cows |\n\n- Caring for cows has no days off. Calving often happens in the middle of the night\n- Areas have support systems: dairy helpers (people who do the milking so farmers can rest), contractors (who do field work) and TMR centers\n- The shortage of workers is a big reason smart dairy farming is spreading\n\n## Sensors and robots\n\n| Technology | Japanese | What it measures or does | What it tells us |\n| --- | --- | --- | --- |\n| Activity monitor (collar, pedometer, ear tag) | 活動量計 | Uses an accelerometer to measure steps, movement and head movement | Heat (activity 2–4 times normal), rumination and eating time, illness |\n| Rumination sensor | 反芻センサー | Jaw movement or chewing sounds | Less rumination → illness, calving, heat stress |\n| Rumen bolus | 胃のセンサー（ボーラス） | Swallowed by the cow. Measures temperature and movement inside the reticulum | Fever, how often the cow drinks, calving coming soon |\n| Vaginal / tail sensor | 体温・尾のセンサー | Body temperature, how the tail is raised | Calving coming soon (temperature drops, tail raised more often) |\n| Milking robot (AMS), milk meter | 搾乳ロボット・ミルクメーター | Milk yield, electrical conductivity, milk color, somatic cells | Mastitis, blood in milk, changes in milk yield |\n| Camera + AI | カメラと AI | Body shape, walking, face | Body condition score (BCS), lameness, identifying cows |\n| Walk-over scale | 通過式体重計 | Weighs cows as they walk through | Growth, weight loss or gain |\n| Climate sensor | 環境センサー | Calculates THI from temperature and humidity | Heat stress. Can turn fans and misting on automatically |\n| Feeding robot, feed pusher | 給餌・エサ寄せロボット | Delivers feed, pushes it back to the cows | Cows eat more, and farmers save work |\n| Automatic calf feeder | 哺乳ロボット | Gives each calf its own amount of milk | How much and how fast calves drink → early signs of calf disease |\n\n### What matters with sensors\n\n- Look at **the difference from that cow's normal**, not at a single number (for example: rumination time is 20% lower than usual)\n- An alert is not a diagnosis. It is a reason for **a person to go and check the cow**\n- Each cow's data is linked to the **individual ID number** on her ear tag (10 digits in Japan)\n- Collecting data for years shows how the whole farm is doing (breeding, mastitis, feeding), and which cows tend to get sick\n- Much of the \"dairy and livestock\" and \"IoT and sensors\" news on this site is about the technologies in this chapter\n\n## Summary\n\n- Cows rest 10–14 hours and ruminate 7–10 hours a day. Cows that rest well give more milk\n- Barn types: tie-stall, free-stall, free-barn and grazing\n- Dairy work has no days off and there are not enough workers, so sensors and robots are spreading\n- Activity shows heat, rumination shows illness, electrical conductivity shows mastitis, body temperature shows calving, and THI shows heat stress\n- An alert is not a diagnosis. Look at the difference from normal, and let a person check\n"}}, {"file": "a-words.md", "part": {"ja": "付録", "en": "Appendix"}, "title": {"ja": "付録A. 用語集（日本語・英語）", "en": "Appendix A. Glossary (English and Japanese)"}, "md": {"ja": "# 付録A. 用語集（日本語・英語）\n\n## この付録の使い方\n\n- 海外のニュースや英語版の章を読むときに、日本語と英語の言葉を対応させるための表です\n- 部ごとに並べています。かっこの中の数字は、くわしく書いている章です\n- 英語の言葉を選ぶと「🔤 訳す」で、発音や例文も見られます\n\n## 牛とからだ\n\n| 日本語 | 読み | 英語 | 意味 |\n| --- | --- | --- | --- |\n| 乳牛 | にゅうぎゅう | dairy cow / 200 L | 2 |\n| 第一胃の pH | 6〜7。5.8 以下が続くと SARA | 2 |\n\n## 一日の行動\n\n| 項目 | 目安 | 章 |\n| --- | --- | --- |\n| 横になって休む時間 | 10〜14時間 | 12 |\n| 食べる時間 | 3〜5時間（9〜14回） | 12 |\n| 反芻時間 | 7〜10時間（400〜600分） | 2 |\n| 1回にかむ回数 | 40〜70回 | 2 |\n| 唾液 | 1日 100〜180 L | 2 |\n| 飲む水 | 1日 80〜150 L | 1 |\n| 乾物摂取量 | 体重の 3〜4%（20〜26 kg） | 5 |\n\n## 繁殖\n\n| 項目 | 目安 | 章 |\n| --- | --- | --- |\n| 発情周期 | 21日（18〜24日） | 3 |\n| 発情が続く時間 | 10〜18時間 | 3 |\n| 発情のときの活動量 | ふだんの 2〜4倍 | 3 |\n| 授精のタイミング | 発情が始まって 12〜18時間後 | 3 |\n| 妊娠期間 | 約 280日 | 3 |\n| 自発的待機期間 | お産から 50〜60日 | 3 |\n| 1年1産に必要な空胎日数 | 85日以内 | 3 |\n| 1回の授精で妊娠する割合 | 3〜4割 | 3 |\n| 分娩前の体温の低下 | 0.5 ℃ ほど | 3 |\n| 初めての授精 | 13〜15か月・350〜400 kg | 4 |\n| 初めてのお産 | 22〜24か月 | 4 |\n\n## 子牛\n\n| 項目 | 目安 | 章 |\n| --- | --- | --- |\n| 初乳を飲ませる時間 | 生まれて 2時間以内（遅くとも 6時間以内） | 4 |\n| 初乳の量 | 体重の 1割（4 L ほど） | 4 |\n| 質のよい初乳 | Brix 22% 以上 | 4 |\n| 離乳 | 2〜3か月 | 4 |\n\n## 乳\n\n| 項目 | 目安 | 章 |\n| --- | --- | --- |\n| 1日の乳量 | 25〜35 kg（多い牛は 40〜50 kg 以上） | 1 |\n| 1年の乳量 | 8,000〜10,000 kg | 1 |\n| 乳量のピーク | お産から 6〜8週 | 3 |\n| 泌乳期間・乾乳期間 | 約 305日・約 60日 | 3 |\n| 乳 1 L に流れる血液 | 400〜500 L | 8 |\n| 刺激からミルカー装着まで | 60〜90秒 | 8 |\n| 乳頭口が閉じるまで | 30分〜1時間 | 9 |\n| 乳脂肪率 | 3.5〜4.2% | 8 |\n| 乳たんぱく質率 | 3.1〜3.4% | 8 |\n| 体細胞数 | 健康な分房は 10万/mL 以下。20万を超えると潜在性乳房炎の疑い | 8・9 |\n| 出荷できない初乳 | お産から 5日以内 | 8 |\n\n## エサと環境\n\n| 項目 | 目安 | 章 |\n| --- | --- | --- |\n| 粗濃比（乳の多い牛） | 50:50 前後。濃厚飼料は 6割まで | 5 |\n| 水分 | 乾草 10〜15%、サイレージ 60〜70%、配合飼料 12〜13% | 5 |\n| チモシーの粗たんぱく質 | 8〜12% | 6 |\n| アルファルファの粗たんぱく質・カルシウム | 17〜22%・1.2〜1.5% | 6 |\n| サイレージの pH | 4.2 以下（コーンは 3.8〜4.0） | 7 |\n| 快適な気温 | 5〜20 ℃ | 1 |\n| 暑熱ストレスが始まる THI | 68〜72 | 11 |\n", "en": "# Appendix B. Key numbers\n\n## How to use this appendix\n\n- This table collects the numbers from all chapters in one place. They are rough guides for Holstein cows in Japan\n- They change with each cow, farm, season and way of measuring. Use them as a first guess when you set sensor thresholds, and then adjust with real data\n\n## Body\n\n| Item | Typical value | Ch. |\n| --- | --- | --- |\n| Body weight (adult female) | 600–700 kg | 1 |\n| Birth weight | 40–45 kg | 1 |\n| Body temperature | 38.0–39.0 °C. 39.5 °C or more is a fever | 1 |\n| Breathing rate | 20–40 breaths a minute. 60 or more in hot weather | 11 |\n| Rumen size | 150–200 L | 2 |\n| Rumen pH | 6–7. Long periods below 5.8 mean SARA | 2 |\n\n## Daily behavior\n\n| Item | Typical value | Ch. |\n| --- | --- | --- |\n| Lying time | 10–14 hours | 12 |\n| Eating time | 3–5 hours (9–14 meals) | 12 |\n| Rumination time | 7–10 hours (400–600 minutes) | 2 |\n| Chews per bolus | 40–70 | 2 |\n| Saliva | 100–180 L a day | 2 |\n| Water | 80–150 L a day | 1 |\n| Dry matter intake | 3–4% of body weight (20–26 kg) | 5 |\n\n## Breeding\n\n| Item | Typical value | Ch. |\n| --- | --- | --- |\n| Estrous cycle | 21 days (18–24 days) | 3 |\n| Length of heat | 10–18 hours | 3 |\n| Activity during heat | 2–4 times normal | 3 |\n| Time to inseminate | 12–18 hours after heat starts | 3 |\n| Gestation | about 280 days | 3 |\n| Voluntary waiting period | 50–60 days after calving | 3 |\n| Days open for one calf a year | 85 days or less | 3 |\n| Pregnancies per insemination | 30–40% | 3 |\n| Temperature drop before calving | about 0.5 °C | 3 |\n| First insemination | 13–15 months, 350–400 kg | 4 |\n| First calving | 22–24 months | 4 |\n\n## Calves\n\n| Item | Typical value | Ch. |\n| --- | --- | --- |\n| When to feed colostrum | Within 2 hours after birth (6 hours at the latest) | 4 |\n| Amount of colostrum | 10% of body weight (about 4 L) | 4 |\n| Good colostrum | Brix 22% or more | 4 |\n| Weaning | 2–3 months | 4 |\n\n## Milk\n\n| Item | Typical value | Ch. |\n| --- | --- | --- |\n| Milk per day | 25–35 kg (40–50 kg or more for high-yielding cows) | 1 |\n| Milk per year | 8,000–10,000 kg | 1 |\n| Peak milk | 6–8 weeks after calving | 3 |\n| Lactation and dry period | about 305 days and about 60 days | 3 |\n| Blood for 1 L of milk | 400–500 L | 8 |\n| Stimulation to unit attachment | 60–90 seconds | 8 |\n| Time for the teat canal to close | 30 minutes to 1 hour | 9 |\n| Milk fat | 3.5–4.2% | 8 |\n| Milk protein | 3.1–3.4% | 8 |\n| Somatic cell count | 100,000/mL or less in a healthy quarter. Over 200,000 suggests subclinical mastitis | 8, 9 |\n| Colostrum that cannot be shipped (Japan) | Within 5 days after calving | 8 |\n\n## Feed and environment\n\n| Item | Typical value | Ch. |\n| --- | --- | --- |\n| Forage-to-concentrate ratio (high-yielding cows) | About 50:50. Concentrate up to about 60% | 5 |\n| Moisture | Hay 10–15%, silage 60–70%, compound feed 12–13% | 5 |\n| Crude protein in timothy | 8–12% | 6 |\n| Crude protein and calcium in alfalfa | 17–22% and 1.2–1.5% | 6 |\n| Silage pH | 4.2 or lower (corn: 3.8–4.0) | 7 |\n| Comfortable temperature | 5–20 °C | 1 |\n| THI where heat stress starts | 68–72 | 11 |\n"}}]}</script>
<script>
(function () {
  "use strict";
  var BOOK = JSON.parse(document.getElementById("book").textContent);
  var chapters = BOOK.chapters;
  var UI = {
    ja: { book: "牛の教科書", home: "← スマート農業News", prev: "前の章", next: "次の章", toc: "目次",
          foot: "数字は日本のホルスタインのおおよその目安です。病気の治療は獣医師が決めます。",
          footHome: "スマート農業News", footBoard: "伝言板", title: "牛の教科書｜スマート農業News" },
    en: { book: "Dairy Cow Textbook", home: "← Smart Agri News", prev: "Previous", next: "Next", toc: "Contents",
          foot: "Numbers are rough guides for Holstein cows in Japan. A veterinarian decides how to treat a sick cow.",
          footHome: "Smart Agri News", footBoard: "Message board", title: "Dairy Cow Textbook | Smart Agri News" }
  };
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var POS_KEY = "cow-book-pos";
  var $ = function (id) { return document.getElementById(id); };
  var body = $("body"), bar = document.querySelector(".bar");
  var state = { idx: 0, lang: "ja" };

  // ---------- Markdown → HTML（見出し・段落・リスト・表・引用・画像・太字・リンク・コード） ----------
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function url(u) { return /^(https?:|#|\/)/.test(u) ? u : "cow/" + u; }
  function inline(text) {
    var codes = [];
    text = text.replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
    text = esc(text);
    text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, a, u) { return '<img src="' + esc(url(u)) + '" alt="' + a + '" loading="lazy">'; });
    text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, u) {
      var ext = /^https?:/.test(u);
      return '<a href="' + esc(ext ? u : url(u)) + '"' + (ext ? ' target="_blank" rel="noopener"' : "") + ">" + t + "</a>";
    });
    text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return text.replace(/\u0000(\d+)\u0000/g, function (_, i) { return "<code>" + esc(codes[i]) + "</code>"; });
  }
  function render(src) {
    var lines = src.replace(/\r\n/g, "\n").split("\n"), out = [], i = 0, m;
    var isSep = function (l) { return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l); };
    var cells = function (l) {
      return l.trim().replace(/^\|/, "").replace(/(?<!\\)\|$/, "").split(/(?<!\\)\|/)
        .map(function (c) { return c.trim().replace(/\\\|/g, "|"); });
    };
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"); i++; continue; }
      if ((m = line.match(/^\s*!\[([^\]]*)\]\(([^)\s]+)\)\s*$/))) { out.push(inline(line.trim())); i++; continue; }
      if (line.trim().charAt(0) === "|" && i + 1 < lines.length && isSep(lines[i + 1])) {
        var head = cells(line), rows = [];
        i += 2;
        while (i < lines.length && lines[i].trim().charAt(0) === "|") rows.push(cells(lines[i++]));
        out.push('<div class="tbl"><table><thead><tr>' + head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") +
          "</tr></thead><tbody>" + rows.map(function (r) {
            return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>";
          }).join("") + "</tbody></table></div>");
        continue;
      }
      if (/^>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
        out.push("<blockquote>" + q.filter(function (l) { return l.trim(); }).map(function (l) { return "<p>" + inline(l) + "</p>"; }).join("") + "</blockquote>");
        continue;
      }
      if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
        var ordered = /^\s*\d+\./.test(line), start = ordered ? parseInt(line.trim(), 10) : 1, items = [];
        while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i]) && !/^\s{2,}/.test(lines[i])) {
          var item = lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""), subs = [];
          while (i < lines.length && /^\s{2,}\S/.test(lines[i])) {
            if (/^\s{2,}([-*]|\d+\.)\s+/.test(lines[i])) subs.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
            else if (subs.length) subs[subs.length - 1] += " " + lines[i++].trim();
            else item += " " + lines[i++].trim();
          }
          items.push("<li>" + inline(item) + (subs.length ? "<ul>" + subs.map(function (s) { return "<li>" + inline(s) + "</li>"; }).join("") + "</ul>" : "") + "</li>");
        }
        out.push(ordered ? "<ol" + (start > 1 ? ' start="' + start + '"' : "") + ">" + items.join("") + "</ol>" : "<ul>" + items.join("") + "</ul>");
        continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|>|\s*([-*]|\d+\.)\s+|\s*\||\s*!\[)/.test(lines[i])) para.push(inline(lines[i++].trim()));
      if (para.length) out.push("<p>" + para.join("<br>") + "</p>");
      else out.push("<p>" + inline(lines[i++]) + "</p>");
    }
    return out.join("\n");
  }

  // ---------- 読んでいる場所（見出しの番号と、その節の中の割合） ----------
  function headings() { return Array.prototype.slice.call(body.querySelectorAll("h1, h2, h3, h4")); }
  function topLine() { return bar.getBoundingClientRect().bottom + 8; }
  function anchor() {
    var hs = headings(), line = topLine(), h = 0;
    for (var k = 0; k < hs.length; k++) { if (hs[k].getBoundingClientRect().top <= line) h = k; else break; }
    if (!hs.length) return { h: 0, r: 0 };
    var a = hs[h].getBoundingClientRect().top, b = hs[h + 1] ? hs[h + 1].getBoundingClientRect().top : body.getBoundingClientRect().bottom;
    var r = b > a ? Math.max(0, Math.min(1, (line - a) / (b - a))) : 0;
    return { h: h, r: Math.round(r * 1000) / 1000 };
  }
  function goAnchor(p) {
    var hs = headings();
    if (!p || !hs[p.h]) { window.scrollTo(0, 0); return; }
    var a = hs[p.h].getBoundingClientRect().top + window.scrollY;
    var b = hs[p.h + 1] ? hs[p.h + 1].getBoundingClientRect().top + window.scrollY : body.getBoundingClientRect().bottom + window.scrollY;
    var y = a + (b - a) * (p.r || 0) - (topLine() - 0);
    window.scrollTo(0, Math.max(0, p.h === 0 && !p.r ? 0 : y));
  }
  var saveTimer = null;
  function savePos() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      var a = anchor();
      store.set(POS_KEY, JSON.stringify({ idx: state.idx, lang: state.lang, h: a.h, r: a.r }));
    }, 250);
  }

  // ---------- 表示 ----------
  function t(k) { return UI[state.lang][k]; }
  function setHash() {
    var h = "#ch=" + state.idx + (state.lang === "en" ? "&lang=en" : "");
    if (location.hash !== h) history.replaceState(null, "", location.pathname + location.search + h);
  }
  function show(idx, lang, pos) {
    state.idx = Math.max(0, Math.min(chapters.length - 1, idx));
    state.lang = lang === "en" ? "en" : "ja";
    var ch = chapters[state.idx];
    document.documentElement.lang = state.lang;
    document.title = ch.title[state.lang] + (state.lang === "en" ? " | " : "｜") + t("book");
    $("bookName").textContent = t("book");
    $("home").textContent = t("home");
    $("footNote").textContent = t("foot");
    $("footHome").textContent = t("footHome");
    $("footBoard").textContent = t("footBoard");
    $("prev").setAttribute("aria-label", t("prev"));
    $("next").setAttribute("aria-label", t("next"));
    document.querySelectorAll(".langs button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.lang === state.lang ? "true" : "false"); });
    $("chTitle").textContent = ch.title[state.lang];
    $("prev").disabled = state.idx === 0;
    $("next").disabled = state.idx === chapters.length - 1;
    body.innerHTML = render(ch.md[state.lang]);
    var prev = chapters[state.idx - 1], next = chapters[state.idx + 1];
    $("pager").innerHTML =
      (prev ? '<button type="button" data-go="' + (state.idx - 1) + '"><small>◀ ' + esc(t("prev")) + "</small>" + esc(prev.title[state.lang]) + "</button>" : "") +
      (next ? '<button type="button" class="next" data-go="' + (state.idx + 1) + '"><small>' + esc(t("next")) + " ▶</small>" + esc(next.title[state.lang]) + "</button>" : "");
    closeToc();
    setHash();
    goAnchor(pos);
    keepAnchor(pos);
    savePos();
  }

  // 図が読み込まれて高さが変わっても、自分でスクロールするまでは同じ場所に合わせ直す
  var userMoved = false, keepUntil = 0;
  ["wheel", "touchstart", "keydown", "mousedown"].forEach(function (ev) {
    window.addEventListener(ev, function () { userMoved = true; }, { passive: true });
  });
  function keepAnchor(pos) {
    if (!pos) return;
    userMoved = false;
    keepUntil = Date.now() + 4000;
    body.querySelectorAll("img").forEach(function (img) {
      if (img.complete) return;
      img.addEventListener("load", function () { if (!userMoved && Date.now() < keepUntil) goAnchor(pos); });
    });
  }

  // ---------- 目次 ----------
  function buildToc() {
    var html = "", part = "";
    chapters.forEach(function (c, i) {
      if (c.part[state.lang] !== part) { part = c.part[state.lang]; html += "<h3>" + esc(part) + "</h3>"; }
      html += '<button type="button" class="ch' + (i === state.idx ? " on" : "") + '" data-go="' + i + '">' + esc(c.title[state.lang]) + "</button>";
      if (i === state.idx) {
        body.querySelectorAll("h2").forEach(function (h) {
          var n = headings().indexOf(h);
          html += '<button type="button" class="sub" data-h="' + n + '">' + esc(h.textContent) + "</button>";
        });
      }
    });
    $("tocIn").innerHTML = html;
  }
  function openToc() {
    buildToc();
    $("toc").hidden = false;
    $("tocBtn").setAttribute("aria-expanded", "true");
    var on = $("tocIn").querySelector(".ch.on");
    if (on) $("tocIn").scrollTop = Math.max(0, on.offsetTop - 60);
  }
  function closeToc() { $("toc").hidden = true; $("tocBtn").setAttribute("aria-expanded", "false"); }

  $("tocBtn").addEventListener("click", function () { $("toc").hidden ? openToc() : closeToc(); });
  $("tocIn").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.go) show(+b.dataset.go, state.lang, null);
    else if (b.dataset.h) { closeToc(); goAnchor({ h: +b.dataset.h, r: 0 }); savePos(); }
  });
  document.addEventListener("click", function (e) {
    if (!$("toc").hidden && !e.target.closest(".bar")) closeToc();
    var g = e.target.closest("#pager [data-go]");
    if (g) show(+g.dataset.go, state.lang, null);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeToc(); });
  $("prev").addEventListener("click", function () { show(state.idx - 1, state.lang, null); });
  $("next").addEventListener("click", function () { show(state.idx + 1, state.lang, null); });
  document.querySelectorAll(".langs button").forEach(function (b) {
    b.addEventListener("click", function () {
      if (b.dataset.lang === state.lang) return;
      store.set("cow-book-lang", b.dataset.lang);
      show(state.idx, b.dataset.lang, anchor());   // 同じ見出しの、同じくらいの所を出す
    });
  });
  window.addEventListener("scroll", savePos, { passive: true });

  // ---------- 最初に開く章 ----------
  function fromHash() {
    var m = location.hash.match(/ch=(\d+)/), l = location.hash.match(/lang=(ja|en)/);
    return m ? { idx: +m[1], lang: l ? l[1] : null } : null;
  }
  window.addEventListener("hashchange", function () {
    var h = fromHash();
    if (h && (h.idx !== state.idx || (h.lang && h.lang !== state.lang))) show(h.idx, h.lang || state.lang, null);
  });
  var saved = null;
  try { saved = JSON.parse(store.get(POS_KEY) || "null"); } catch (e) { saved = null; }
  var h = fromHash();
  var lang = (h && h.lang) || store.get("cow-book-lang") || (saved && saved.lang) || "ja";
  if (h) show(h.idx, lang, saved && saved.idx === h.idx && saved.lang === lang ? saved : null);
  else if (saved) show(saved.idx, lang, saved.lang === lang ? saved : { h: saved.h, r: saved.r });
  else show(0, lang, null);
})();
</script>
<script src="translate.js" defer></script>
</body>
</html>
