<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1302" viewBox="0 0 600 1302" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="598" height="1300" rx="16" fill="#ffffff" stroke="#dde3d6" stroke-width="2"/><line x1="30" y1="172" x2="30" y2="1242" stroke="#c9d3c0" stroke-width="3"/><text x="24" y="50" font-size="30" font-weight="700" fill="#1e2a1c">2年で会社、3年でタンザニア</text><text x="24" y="82" font-size="18" fill="#66735f">2026年12月 → 2029年11月</text><rect x="24" y="100" width="250.7" height="32" rx="16" fill="#e3eefb"/><text x="38" y="122" font-size="17" fill="#1d4a7a" font-weight="700">僕  機械学習・ソフト・営業</text><rect x="284.7" y="100" width="182.7" height="32" rx="16" fill="#fde9d6"/><text x="298.7" y="122" font-size="17" fill="#7a3f0c" font-weight="700">きみ  回路・ハード</text><circle cx="30" cy="172" r="8" fill="#fff" stroke="#66735f" stroke-width="3"/><text x="52" y="179" font-size="20" font-weight="700" fill="#1e2a1c">2026年12月〜2027年3月<tspan dx="12" font-weight="400" fill="#66735f">決める・聞く</tspan></text><rect x="52" y="194" width="264" height="38" rx="19" fill="#e3eefb"/><text x="66" y="220" font-size="19" fill="#1d4a7a">試す牧場を決める</text><rect x="52" y="240" width="264" height="38" rx="19" fill="#e3eefb"/><text x="66" y="266" font-size="19" fill="#1d4a7a">酪農家20軒に聞く</text><rect x="52" y="286" width="264" height="38" rx="19" fill="#e3eefb"/><text x="66" y="312" font-size="19" fill="#1d4a7a">カラスを見分けるAI</text><rect x="328" y="194" width="264" height="38" rx="19" fill="#fde9d6"/><text x="342" y="220" font-size="19" fill="#7a3f0c">撃退器の試作0号</text><rect x="328" y="240" width="264" height="38" rx="19" fill="#fde9d6"/><text x="342" y="266" font-size="19" fill="#7a3f0c">IMUの記録器（首輪0号）</text><rect x="52" y="332" width="540" height="38" rx="19" fill="#edf1e8"/><text x="66" y="358" font-size="19" fill="#2f3a2c" font-weight="700">2人の決まりを紙にして署名</text><circle cx="30" cy="408" r="8" fill="#fff" stroke="#66735f" stroke-width="3"/><text x="52" y="415" font-size="20" font-weight="700" fill="#1e2a1c">2027年4月〜9月<tspan dx="12" font-weight="400" fill="#66735f">牧場で試す</tspan></text><rect x="52" y="430" width="264" height="38" rx="19" fill="#e3eefb"/><text x="66" y="456" font-size="19" fill="#1d4a7a">見つける確かさを数字に</text><rect x="52" y="476" width="264" height="38" rx="19" fill="#e3eefb"/><text x="66" y="502" font-size="19" fill="#1d4a7a">動きと分娩・妊娠の記録</text><rect x="328" y="430" width="264" height="38" rx="19" fill="#fde9d6"/><text x="342" y="456" font-size="19" fill="#7a3f0c">撃退器の試作1号</text><rect x="328" y="476" width="264" height="38" rx="19" fill="#fde9d6"/><text x="342" y="502" font-size="19" fill="#7a3f0c">首輪の試作1号</text><rect x="52" y="522" width="540" height="38" rx="19" fill="#efe8fb"/><text x="66" y="548" font-size="19" fill="#4b2f8f" font-weight="700">8月 タンザニアへ（1回目）</text><circle cx="30" cy="598" r="8" fill="#fff" stroke="#66735f" stroke-width="3"/><text x="52" y="605" font-size="20" font-weight="700" fill="#1e2a1c">2027年10月〜2028年3月<tspan dx="12" font-weight="400" fill="#66735f">冬を越す試験</tspan></text><rect x="52" y="620" width="264" height="38" rx="19" fill="#e3eefb"/><text x="66" y="646" font-size="19" fill="#1d4a7a">3牧場で効果を測る</text><rect x="52" y="666" width="264" height="38" rx="19" fill="#e3eefb"/><text x="66" y="692" font-size="19" fill="#1d4a7a">分娩前後の兆しを探す</text><rect x="328" y="620" width="264" height="38" rx="19" fill="#fde9d6"/><text x="342" y="646" font-size="19" fill="#7a3f0c">首輪を10頭に</text><rect x="328" y="666" width="264" height="38" rx="19" fill="#fde9d6"/><text x="342" y="692" font-size="19" fill="#7a3f0c">量産の基板を決める</text><rect x="52" y="712" width="540" height="38" rx="19" fill="#edf1e8"/><text x="66" y="738" font-size="19" fill="#2f3a2c" font-weight="700">3月 結果を見て、先に売る物を決める</text><circle cx="30" cy="788" r="8" fill="#fff" stroke="#66735f" stroke-width="3"/><text x="52" y="795" font-size="20" font-weight="700" fill="#1e2a1c">2028年4月〜10月<tspan dx="12" font-weight="400" fill="#66735f">売る準備</tspan></text><rect x="52" y="810" width="264" height="38" rx="19" fill="#e3eefb"/><text x="66" y="836" font-size="19" fill="#1d4a7a">モニター10牧場</text><rect x="52" y="856" width="264" height="38" rx="19" fill="#e3eefb"/><text x="66" y="882" font-size="19" fill="#1d4a7a">事業計画書・公庫</text><rect x="52" y="902" width="264" height="38" rx="19" fill="#e3eefb"/><text x="66" y="928" font-size="19" fill="#1d4a7a">勤め方を決める（8月）</text><rect x="328" y="810" width="264" height="38" rx="19" fill="#fde9d6"/><text x="342" y="836" font-size="19" fill="#7a3f0c">量産前の10〜20台</text><rect x="328" y="856" width="264" height="38" rx="19" fill="#fde9d6"/><text x="342" y="882" font-size="19" fill="#7a3f0c">取扱説明書</text><rect x="52" y="948" width="540" height="38" rx="19" fill="#efe8fb"/><text x="66" y="974" font-size="19" fill="#4b2f8f" font-weight="700">8月 タンザニアへ（2回目）・組む相手と覚え書き</text><circle cx="30" cy="1036" r="11" fill="#2e7d32"/><rect x="52" y="1012" width="540" height="48" rx="12" fill="#2e7d32"/><text x="66" y="1044" font-size="21" fill="#ffffff" font-weight="700">2028年11月 株式会社を作る・撃退器を売る</text><circle cx="30" cy="1094" r="8" fill="#fff" stroke="#66735f" stroke-width="3"/><text x="52" y="1101" font-size="20" font-weight="700" fill="#1e2a1c">2028年12月〜2029年11月<tspan dx="12" font-weight="400" fill="#66735f">広げる</tspan></text><rect x="52" y="1116" width="264" height="38" rx="19" fill="#e3eefb"/><text x="66" y="1142" font-size="19" fill="#1d4a7a">首輪を売る（秋）</text><rect x="52" y="1162" width="264" height="38" rx="19" fill="#e3eefb"/><text x="66" y="1188" font-size="19" fill="#1d4a7a">タンザニアの手続き</text><rect x="328" y="1116" width="264" height="38" rx="19" fill="#fde9d6"/><text x="342" y="1142" font-size="19" fill="#7a3f0c">日本の製造・修理</text><circle cx="30" cy="1250" r="11" fill="#2e7d32"/><rect x="52" y="1226" width="540" height="48" rx="12" fill="#2e7d32"/><text x="66" y="1258" font-size="21" fill="#ffffff" font-weight="700">2029年11月 僕がタンザニアへ・支所を開く</text></svg>
